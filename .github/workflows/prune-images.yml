# Expire the npm images. npm-images.yml publishes one image per package version
# for every commit on main that passes ci, so without this each package's list
# grows without bound.
#
# Each package keeps its newest 20 versions. A version is a tag that is never
# moved, so deleting an old one breaks nothing but a lockfile that still pins
# it. Untagged manifests are deleted whatever their age, because nothing can
# name them.
name: prune-images

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  prune:
    name: prune images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A scheduled run prunes; a hand-started one asks first.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      KEEP: "20"
      # The image repository npm-images.yml publishes.
      PACKAGES: >-
        npm/ui
    steps:
      - name: prune
        run: |
          set -euo pipefail
          owner='${{ github.repository_owner }}'
          for package in $PACKAGES; do
            # The API takes a nested package name with its slash encoded.
            pkg=${package//\//%2F}
            # An owner that is a user rather than an organisation answers on a
            # different path. A package not published yet answers 404 on both,
            # and has nothing to prune. Any other failure stops the job, rather
            # than reading as nothing to prune.
            if ! versions=$(gh api --paginate "/orgs/$owner/packages/container/$pkg/versions" 2>"$RUNNER_TEMP/org.err"); then
              if ! versions=$(gh api --paginate "/users/$owner/packages/container/$pkg/versions" 2>"$RUNNER_TEMP/user.err"); then
                if grep -q "HTTP 404" "$RUNNER_TEMP/org.err" && grep -q "HTTP 404" "$RUNNER_TEMP/user.err"; then
                  echo "== $package: not published yet"
                  continue
                fi
                cat "$RUNNER_TEMP/org.err" "$RUNNER_TEMP/user.err" >&2
                exit 1
              fi
            fi
            echo "== $package"
            # Newest first, so the index is the rank the keep rule uses. Untagged
            # manifests sort last and are never kept.
            echo "$versions" | jq -c '
              (map(select((.metadata.container.tags // []) | length > 0)) | sort_by(.created_at) | reverse)
              + map(select((.metadata.container.tags // []) | length == 0))
              | to_entries[]' |
            while read -r entry; do
              rank=$(jq -r '.key' <<<"$entry")
              id=$(jq -r '.value.id' <<<"$entry")
              tags=$(jq -r '.value.metadata.container.tags // [] | join(",")' <<<"$entry")
              if [ -n "$tags" ] && [ "$rank" -lt "$KEEP" ]; then
                echo "  keep   $tags"
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then
                echo "  WOULD DELETE ${tags:-<untagged>}"
                continue
              fi
              echo "  delete ${tags:-<untagged>}"
              gh api -X DELETE "/orgs/$owner/packages/container/$pkg/versions/$id" \
                || gh api -X DELETE "/users/$owner/packages/container/$pkg/versions/$id"
            done
          done
