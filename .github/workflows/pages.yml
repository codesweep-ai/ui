name: pages

# Publish codesweep.ai/ui/: the repository's documents at the root, and the
# component gallery under /preview/.
#
# The gallery is the reason this is a build rather than the branch-served README
# the other repositories use. It resolves @codesweep-ai/ui to src/, so the page
# shows the components at this commit rather than the last published ones, and
# that only holds if something compiles it on every push.
# On a finished build rather than on the push itself.
#
# This site now carries ci-status.json, which codesweep.ai/dashboards/ci reads,
# and that file is a report on this repository's workflow runs. Built on push,
# it would be written while ci was still running and would say so, and nothing
# would rewrite it once ci finished. Waking on ci's completion is what makes the
# file report a verdict.
#
# ci runs on every push to main, so the documents and the gallery still publish
# on every push, a few minutes later than they used to.
#
# `completed` rather than a success filter: a failed build is exactly the news
# the dashboard exists to show, so it has to publish too.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read # the site is built from the tree and nothing is written back
  actions: read # ci-status.json is this repository's own workflow runs
  pages: write # publish the built site
  id-token: write # the deployment is minted from the run rather than from a key

# One site, so one deploy at a time. Unlike the npm workflow a superseded run is
# not cancelled: there is nothing to gain by racing to replace a page that is
# about to be replaced anyway, and a deployment killed halfway is worse than a
# page that is a minute stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    # ci runs on pull_request as well as on push, and workflow_run fires for
    # either. Without this guard a pull request's build would publish that branch
    # to the documentation URL everyone reads.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Written before Jekyll runs, so Jekyll copies it into the site like any
      # other file at the repository root. It reads this repository's own workflow
      # runs and nothing else, so the job's GITHUB_TOKEN is enough.
      #
      # Pinned by commit rather than by branch, so a change over there cannot
      # change what this build runs.
      - name: write the CI status
        uses: codesweep-ai/dashboards/action@4c204c69b8b2b79a101c65520b86944de06942a0
        with:
          window: "20"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # No `npm run check` here. ci.yml runs the gate against this same commit,
      # and a page is not a published version: the worst a bad one does is show
      # the wrong thing until the next push, which is not what the release
      # workflows are guarding against.
      - run: npm run preview:build

      - uses: actions/configure-pages@v5

      # The same Jekyll, the same gem and the same repository settings the
      # branch-served site was built with, so the documents render here exactly
      # as they rendered there. _config.yml says why it holds nothing but an
      # exclude list.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Assembled into a new directory rather than by writing the gallery into
      # ./_site. The step above runs in a container as root, so its output is
      # readable by the rest of the job but not writable by it.
      - name: assemble the site
        run: |
          mkdir -p site/preview
          cp -R _site/. site/
          cp -R preview/dist/. site/preview/

      # A missing file here would show up only as ui quietly dropping off the
      # dashboard, which is the kind of failure nobody goes looking for.
      - name: check the status file was published
        run: test -s site/ci-status.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    # Only main is the live site. This workflow can be dispatched on a branch to
    # see the build, and without this guard that dispatch would publish the
    # branch to the documentation URL everyone reads.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment carries the deployment's URL and whatever protection rules
    # the repository puts on it; deploy-pages refuses to run outside one.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
