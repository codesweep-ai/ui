name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release for the tag
  actions: read # ci's run on the tagged commit decides whether it publishes
  id-token: write # provenance, minted from the run rather than from a key

jobs:
  publish:
    name: publish to npm
    # Only a tag publishes. A dispatch from a branch has no version to release,
    # and package.json is what carries it.
    if: startsWith(github.ref, 'refs/tags/v')
    # A cloud-hosted runner, which provenance requires.
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the wait below can sit out a whole ci run
    steps:
      # ci runs on main rather than on tags, so a release waits for ci's verdict
      # on the commit the tag points at. The tag usually arrives in the same push
      # as its commit, whose run can appear a moment after this one starts. A
      # pull request's run does not count: it tested the commit merged into main,
      # not the commit itself.
      - name: wait for ci to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 12); do
            run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::ci has not run on $GITHUB_SHA, so nothing publishes from it. Push the commit to main first."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --compact --interval 30

      - uses: actions/checkout@v7
        with:
          # The readiness rules read the history. The depth is also load-bearing for
          # the publish guard: stage-package.mjs judges whether the commit can be
          # fetched, from the remote refs and tags a full fetch brings.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, and which npm a given
      # Node 24 bundles is not something to leave to chance: 24.4.1 shipped
      # 11.4.2, under the floor. Without this the run falls back to looking for
      # a token it does not have.
      - run: npm install -g npm@latest

      - run: npm ci

      # The whole gate, because a release is the one build nobody re-runs.
      - run: npm run check

      # No token. The package names this workflow as a trusted publisher, so npm
      # takes the run's own identity and mints a credential that lives for the
      # length of the publish.
      - run: npm run stage

      # Through publish-staged.mjs, which skips a version this commit already
      # published, so a re-run after the GitHub release step failed gets as far
      # as that step again.
      - run: node scripts/publish-staged.mjs --provenance --access public

      # The tag is what a reader finds first, so it gets a page of its own with
      # the changes since the last one.
      - name: create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
