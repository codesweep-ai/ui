name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release for the tag
  id-token: write # provenance, minted from the run rather than from a key

jobs:
  publish:
    name: publish to npm
    # Only a tag publishes. A dispatch from a branch has no version to release,
    # and package.json is what carries it.
    if: startsWith(github.ref, 'refs/tags/v')
    # A cloud-hosted runner, which provenance requires.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the readiness rules read the history

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, and which npm a given
      # Node 24 bundles is not something to leave to chance: 24.4.1 shipped
      # 11.4.2, under the floor. Without this the run falls back to looking for
      # a token it does not have.
      - run: npm install -g npm@latest

      - run: npm ci

      # The whole gate, because a release is the one build nobody re-runs.
      - run: npm run check

      # No token. The package names this workflow as a trusted publisher, so npm
      # takes the run's own identity and mints a credential that lives for the
      # length of the publish.
      - run: npm run stage

      - run: npm publish .package --provenance --access public

      # The tag is what a reader finds first, so it gets a page of its own with
      # the changes since the last one.
      - name: create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
