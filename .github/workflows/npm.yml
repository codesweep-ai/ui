name: npm

# Publish a build of one commit to the `dev` channel. Nothing about it is a
# release: no tag is cut, no GitHub release is made, and `latest` never moves.
#
# This is separate from release.yml on purpose. Something that runs on every push
# should not be able to reach the release machinery at all, and the permissions
# below are what make that true rather than merely intended.
#
# On ci finishing rather than on the push, because a published version cannot be
# taken back, so nothing publishes from a commit ci has not passed. Not a job in
# ci.yml either: npm checks a trusted publisher against the workflow a run
# started from, so a publish called from ci.yml would be refused as ci.yml's.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would publish, without publishing it
        type: boolean
        default: false

permissions:
  contents: read # this workflow reads the repository and writes nothing to it
  actions: read # a dispatch reads ci's run on the commit it publishes
  id-token: write # provenance, minted from the run rather than from a key

# One publish at a time, and a superseded one is dropped: two pushes in a row
# would otherwise race, and the older is of no interest by the time it lands.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish a dev build
    # A passing ci run on a push to main, and only while its commit is still
    # main's head. A run started from ci builds main's head rather than the
    # commit ci tested, and its provenance names main's head too, so the two
    # have to be the same commit. One that is not has been superseded, and the
    # newer commit publishes when its own ci run passes.
    #
    # And only in codesweep-ai's own repository. A fork, or a copy under another
    # owner, publishes under that owner's scope, with credentials only that owner
    # can set up, so a publish started by ci there could only fail. It is skipped
    # instead. A dispatch publishes from anywhere, for an owner who has.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository_owner == 'codesweep-ai' &&
       !github.event.repository.fork &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    # A cloud-hosted runner, which provenance requires.
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a dispatch can sit out a whole ci run before it builds
    steps:
      # A dispatch names a commit rather than a ci run, so it finds that commit's
      # run and waits for its verdict. A pull request's run does not count: it
      # tested the commit merged into main, not the commit itself. A dry run
      # publishes nothing, so it waits for nothing.
      - name: wait for ci to pass on this commit
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 12); do
            run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::ci has not run on $GITHUB_SHA, so nothing publishes from it. Run ci on it first."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --compact --interval 30

      - uses: actions/checkout@v7
        with:
          # The version is the commit, so the history has to be here. The depth is
          # also load-bearing for the publish guard: stage-package.mjs judges whether
          # that commit can be fetched, from the remote refs and tags a full fetch brings.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, and which npm a given
      # Node 24 bundles is not something to leave to chance: 24.4.1 shipped
      # 11.4.2, under the floor. Without this the run falls back to looking for
      # a token it does not have.
      - run: npm install -g npm@latest

      - run: npm ci

      # The gate, because a published version cannot be taken back.
      - run: npm run check

      # The commit's own timestamp and hash, so the same commit always names
      # itself the same way. scripts/dev-version.mjs says why the patch is
      # bumped rather than the current version reused.
      - name: version this build
        run: |
          version="$(node scripts/dev-version.mjs)"
          echo "publishing $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      # The tarball's contents are assembled in .package/, which is what carries
      # the README written for someone installing this rather than reading the
      # repository. scripts/stage-package.mjs says why that needs a directory.
      - run: npm run stage

      # No token. The package names this workflow as its trusted publisher, so
      # npm takes the run's own identity and mints a credential that lives for
      # the length of the publish.
      #
      # `--tag dev` keeps `latest` where the last release left it, and a caret
      # range never resolves to a prerelease, so nobody gets one without asking.
      #
      # Through publish-staged.mjs, which skips a version this commit already
      # published, so re-running ci on a published commit does not fail here.
      - name: publish
        run: node scripts/publish-staged.mjs --tag dev --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
