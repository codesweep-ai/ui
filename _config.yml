# Two settings, and the reasons neither is obvious.
#
# `exclude` is here so Jekyll's copy of the gallery's source does not land on
# top of the gallery the workflow builds. /preview/ is one or the other.
#
# Naming an exclude list replaces Jekyll's defaults rather than adding to them,
# so node_modules and the two build caches have to be named again here. That is
# not housekeeping. The workflow runs `npm ci` before Jekyll, so node_modules is
# on disk when it walks the tree, and @dnd-kit ships a CHANGELOG carrying an
# unterminated `{{` that Liquid reads as its own syntax and fails the build on.
#
# Nothing else is excluded, deliberately. Every page the branch build published
# — the component and pattern docs, the documents, the source tree — keeps the
# URL it already has.
exclude:
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - preview

# `include` is what gets two documents rendered at all. The plugin that turns a
# .md file carrying no YAML header into a page refuses a fixed list of names —
# README, LICENSE, CONTRIBUTING, CODE_OF_CONDUCT and a few more — on the
# grounds that GitHub renders those itself. That left these two served as raw
# text/markdown while every other document became a page, and the README
# linking to them as .md while it linked to everything else as .html. Naming
# them here is the plugin's own way out: it consults this before the list.
#
# README.md is deliberately absent. A different plugin already makes it
# index.html, and naming it here would add a second copy at README.html.
include:
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
