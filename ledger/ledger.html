     re-themes itself; the amber needs a different step per theme. */
  --chart-found: var(--color-cat-1-mid);
  --chart-fixed: var(--color-cat-3-dark);
  --sev-c: var(--color-error);
  --sev-h: var(--color-severe);

/* Root scrollbar stability now comes from the design system's base.css

  padding: 2px 10px; font-size: var(--font-size-xs); cursor: pointer;
}
.tbtn:hover { background: var(--color-nav-hover); }
/* One column, one grammar: the narrow (brief-width) presentation is the ledger's

main { max-width: 760px; margin: 0 auto; padding: var(--space-4) var(--space-5) var(--space-6); }

<script id="ledger-data" type="application/json">{"project":"ui","staleAfterDays":14,"records":[{"id":"CUI-001","title":"escapeMarkdownHtml escapes \u003c inside code, corrupting code spans, fences and mermaid diagrams","type":"defect","severity":"high","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["15bbb39"],"integrated":[],"verified":"npx vitest run src/lib/markdownUrl.test.ts: 12 passed. Reverting only src/lib/markdownUrl.ts and rerunning fails 7 of those 12, plus all 3 consumer cases added to MarkdownViewer.security.test.tsx (both viewers) and MarkdownViewer.mermaid.test.tsx. The 5 that still pass on the reverted build are the prose cases, which is the evidence prose escaping is unchanged. Full suite 569 passed across 57 files, up from 554 across 56. npm run check exit 0."},"resolution":null,"details":"`escapeMarkdownHtml` in `src/lib/markdownUrl.ts` replaces every `\u003c` that opens a tag with `&lt;`, and `MarkdownViewer` applies it to the whole document before either renderer sees it. The escape does not know where code begins, so it corrupts verbatim regions.\n\nTwo symptoms. Inline `` `Array\u003cstring>` `` renders on the page as the literal text `Array&lt;string>`, because neither renderer decodes entities back inside code. And a `\u003cbr/>` inside a ```mermaid fence reaches MermaidDiagram as `&lt;br/>`, so mermaid emits a stray `br` in the node label instead of a line break.\n\nIn prose the bug is invisible, because the lightweight parser's `appendText` decodes entities again. That is why it survived: it only shows up inside code, and it shows up on every TypeScript generic.\n\nThe escape exists to keep raw HTML out of react-markdown's tree, where a consumer's rehype plugin would render it. A fix must keep prose escaping byte for byte identical and exempt only regions both renderers already treat as literal text.\n\nWorked around in the consuming app by post-processing the rendered DOM to undo the entity.","notes":[{"date":"2026-09-06","text":"Confirmed against src/lib/markdownUrl.ts:25 and src/components/MarkdownViewer.tsx:756. Reproduced with a throwaway vitest file: the escaper's output contains `Array&lt;string>` and `one&lt;br/>two`, both asserted and passing."},{"date":"2026-09-06","text":"The report arrived with a full fix and a claim of 565 tests passing across 57 files. That work is not in this repository, whose baseline is 554 across 56. Treating the design as a proposal rather than as landed work."},{"date":"2026-09-06","text":"Fixed by making the escaper code-aware rather than by narrowing what it escapes. It now walks the source and passes fenced blocks and code spans through untouched, reusing LightweightMarkdown's own fence regexes so the escaper and the parser cannot disagree about where code begins. Indented 4-space code blocks are deliberately still escaped, because telling one from a lazy paragraph continuation is ambiguous and a wrong guess would under-escape."},{"date":"2026-09-06","text":"If you worked around this in a consumer app, undo it. Any post-processing that rewrote &lt; back to \u003c in rendered output will now double-handle correct text, and a pre-pass over the markdown source is no longer needed. Take the fix and delete the workaround rather than leaving both in place. components/MarkdownViewer.md now states the prose and code rules separately, so the guarantee you are relying on is written down."}],"links":["CUI-002"]},{"id":"CUI-002","title":"LightweightMarkdown never renders single-marker emphasis, so *text* shows its markers","type":"defect","severity":"high","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["10ca181"],"integrated":[],"verified":"npx vitest run src/components/MarkdownViewer.conformance.test.tsx: 14 passed, of which 10 are new assertions run against both parsers. Reverting only src/components/LightweightMarkdown.tsx fails 3 of them, including the corpus comparison, which is the evidence the widened corpus now guards the invariant. Full suite 579 passed across 57 files, up from 569. npm run check exit 0."},"resolution":null,"details":"`parseInline` in `src/components/LightweightMarkdown.tsx` has branches for backslash escapes, code spans, images, links, `**` and `__` for strong, `~~` for strikethrough, and hard breaks. It has no branch for a single `*` or `_`, so emphasis falls through to the literal-text path and the markers are printed.\n\nTo a reader the failure looks intermittent: bold renders and italic does not.\n\nThe lightweight parser is what the default `MarkdownViewer` export uses. The rich parser renders `\u003cem>` correctly, so the two disagree. That contradicts the invariant asserted by `MarkdownViewer.conformance.test.tsx`, which claims both parsers produce the same DOM.\n\nThat test passes only because `markdownConformanceCorpus` never contains single-marker emphasis. It exercises `**bold text**` and `**strong text**` and nothing else. Widening the corpus belongs to this record, because a fix that leaves the corpus thin leaves the invariant unguarded.\n\nWorked around in the consuming app by pre-converting single markers to double before handing content to the viewer.","notes":[{"date":"2026-09-06","text":"Confirmed against src/components/LightweightMarkdown.tsx:142-147, which matches `**` and `__` only. Reproduced with a throwaway vitest file: `*italic* and _also_ and **bold**` renders 0 `\u003cem>`, 1 `\u003cstrong>`, and the literal text `*italic*`."},{"date":"2026-09-06","text":"Corpus gap confirmed by reading src/test/markdownConformance.ts in full."},{"date":"2026-09-06","text":"Fixed by adding an emphasis branch after the two-marker forms, so `**` is never read as a pair of `*`. It carries two flanking rules taken from CommonMark: a marker followed by whitespace opens nothing, and `_` does not emphasise inside a word. The second is what leaves snake_case identifiers alone, and the corpus now asserts it."},{"date":"2026-09-06","text":"If you worked around this in a consumer app, undo it. A pre-pass that rewrote single markers to double before handing content to the viewer will now produce bold where the author wrote italic, so it is worse than doing nothing once this ships. Remove it rather than leaving both."}],"links":["CUI-001","CUI-015"]},{"id":"CUI-003","title":"SectionedTree does not scroll the selected row into view, but Tree does","type":"defect","severity":"med","status":"closed","foundBy":"an agent building a six-section navigation sidebar against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d","2cd300f"],"integrated":[],"verified":"Measured before fixing: a throwaway test rendering Tree and changing selectedId from outside recorded 0 scrollIntoView calls, so Tree did not do this either. Fixed as an opt-in prop on both. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline. Default flipped to true in 2cd300f, with three further tests in Tree.overflow.test.tsx asserting the scroll happens, that it can be turned off, and that it is not animated: 11 passed in that file, 609 across 60 files. npm run check exit 0, visual:compare 76/76, axe violations 0."},"resolution":null,"details":"`Tree` scrolls its selected row into view. `SectionedTree`, which composes Trees, does not.\n\nWhen selection is driven from outside the component, by a link elsewhere on the page setting `selectedId`, the selected row can sit off screen in a SectionedTree with no indication. The sidebar shows an unrelated position. The same interaction works in a plain Tree.\n\nThis is filed as a defect rather than a gap because two components meant to compose behave differently on the same input.\n\nWorked around in the consuming app by abandoning SectionedTree for Panel plus Tree per section.","notes":[{"date":"2026-09-06","text":"Confirmed: src/components/Tree.tsx:597 calls scrollIntoView with block nearest. A grep for scrollIntoView across src/components returns no hit in SectionedTree.tsx."},{"date":"2026-09-06","text":"The report's premise was wrong and the record is corrected here rather than rewritten. Tree does call scrollIntoView, but only for the current search match and for keyboard navigation. An externally-set selectedId scrolled in neither component. Measured with a throwaway test that stubbed Element.prototype.scrollIntoView and counted 0 calls across a selectedId change."},{"date":"2026-09-06","text":"So this was a missing capability rather than an inconsistency. Fixed as scrollSelectedIntoView on both, defaulting to false, because turning it on by default would change Tree's behaviour for everyone on the strength of a premise that did not hold. Consumers driving selection from a link elsewhere on the page should pass it."},{"date":"2026-09-06","text":"The repository owner reversed the default to true, on the grounds that nobody could name a reason to want a selection left off screen. The conservative default came from the report being wrong about the baseline, not from a case against the behaviour, so the reversal stands."},{"date":"2026-09-06","text":"The selection scroll is deliberately not animated, which the other two callers are. Search matches and arrow keys scroll because the user just acted on the tree, where an animation helps them follow the move. This one fires because the page changed underneath it, so an animation draws the eye to movement nobody asked for, and rapid selection changes queue smooth scrolls against each other. Both animated callers now honour prefers-reduced-motion, which they did not before: that was a pre-existing gap against the convention Skeleton, Toast, PulseBadge and StreamingText already keep, and making this routine is what surfaced it."}],"links":["CUI-004","CUI-011"]},{"id":"CUI-004","title":"SectionedTree forces a filter box and an expand-all control on every section","type":"defect","severity":"med","status":"closed","foundBy":"an agent building a six-section navigation sidebar against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d"],"integrated":[],"verified":"npx vitest run src/components/SectionedTree.chrome.test.tsx: 6 passed, covering the default, turning every filter off, one section overriding the rest, and dropping the expand-all control. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"`SectionedTree` renders a filter input and an expand-all control for every section, and neither can be turned off. It sets `filterable`, `onToggleExpandAll` and `allExpanded` on each child Tree itself, and exposes none of them on its own props.\n\nWith six sections that is six filter boxes and six expand-all controls, most of them over sections of two to eleven items. In a 300px sidebar the chrome outweighed the content.\n\nThe inconsistency is the argument for calling this a defect. Plain `Tree` offers `filterable` as opt-in. `SectionedTree` composes Trees and removes a choice the composed component gives.\n\nWorked around in the consuming app by abandoning SectionedTree for Panel plus Tree per section, with a filter only on sections above twenty items. That took six filter boxes down to two.","notes":[{"date":"2026-09-06","text":"Confirmed: src/components/SectionedTree.tsx:311-315 passes filterable, onToggleExpandAll and allExpanded unconditionally. SectionedTreeProps at lines 26-48 exposes none of the three."},{"date":"2026-09-06","text":"Fixed as filterable and expandAllControl, both defaulting to true so nothing existing changes, with TreeSection.filterable overriding per section. If you abandoned SectionedTree for Panel plus Tree because of this, it is worth another look: filterable={false} with a per-section override is what the workaround was reproducing by hand."}],"links":["CUI-003","CUI-011"]},{"id":"CUI-005","title":"No stable styling hooks, so consumer overrides target generated class names","type":"improvement","severity":"high","status":"open","foundBy":"agents building two consumer apps against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Components carry `data-component` on their root and nothing on the structure beneath it. A consumer who has to reach inside one has only the generated class names, such as `cs-component-tree-142` and `cs-component-panel-20`. Those change on any rebuild, so the selector silently stops matching and the override quietly disappears.\n\nThe proposal is a stable `data-part` attribute on the structural elements, with values along the lines of `row`, `icon`, `scroller`, `header` and `body`, on Tree, SectionedTree, Panel and MarkdownViewer.\n\nThis is ranked high despite being an improvement. It is the escape hatch that every other record on this list is currently forced through, and it is an escape hatch that breaks on upgrade.\n\nWorked around in the consuming apps by targeting the generated names, which is the failure this record describes.","notes":[{"date":"2026-09-06","text":"Confirmed: a grep for data-part across src returns nothing. The generated names quoted in the report match the pattern emitted today, for example cs-component-panel-5 in src/styles/components/panel.css."},{"date":"2026-09-06","text":"Partly done in 5d4f99d and 8a781bd. Tree carries data-part on its scroller, rows, labels and icons; SectionedTree on its sections, headers and bodies; Table on its truncatable cell; Tooltip on its bubble. Panel and MarkdownViewer still have none, so this stays open. The convention is settled by the parts above: name the structural element, not its role in one layout."},{"date":"2026-09-06","text":"Panel now carries data-part on its header and body, added in a49c3aa alongside the overflow fix. MarkdownViewer is the last component on the list with none."}],"links":["CUI-007","CUI-008","CUI-009","CUI-011"]},{"id":"CUI-006","title":"A wrong stylesheet import set renders every component unstyled with no warning","type":"improvement","severity":"med","status":"open","foundBy":"an agent building a consumer app against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"A consumer that imports `styles/tokens.css` and `styles/base.css` without the component sheets gets a page where every component renders as unstyled stacked blocks. Nothing errors and nothing warns. One app ran that way unnoticed, with 415 CSS rules loaded where it should have had 1742.\n\n`core.css` is three imports: tokens, base and utilities. It carries no component styles, so loading it alone is not enough either.\n\nThe report proposed folding the component styles into `core.css`. That conflicts with the per-component design INSTALL.md documents, which exists so a consumer pays only for what it renders. The defect worth fixing is the silence, not the packaging. A component that renders with no stylesheet should say so once, in development, rather than rendering as bare markup.\n\nWorked around in the consuming app by adding the missing import once the cause was found.","notes":[{"date":"2026-09-06","text":"Confirmed: src/styles/core.css is @import of tokens.css, base.css and utilities.css only. The 415 and 1742 rule counts come from the report and were not re-measured here."}],"links":[]},{"id":"CUI-007","title":"Tree centres its row content, so a wrapping label misaligns the leaf icon","type":"improvement","severity":"med","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d"],"integrated":[],"verified":"npx vitest run src/components/Tree.overflow.test.tsx: 8 passed, including that the root records center by default and start on request. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"Tree rows are laid out with `align-items: center`, and there is no prop to change it. A `renderLabel` that returns two lines, such as a filename above a description, leaves the leaf icon floating at the vertical middle of the row instead of sitting on the first line. The reporter measured the icon centre at 131px against a first-line centre of 123px.\n\nCentring is right for the single-line labels Tree anticipates. It is wrong the moment `renderLabel` wraps, and `renderLabel` is a public prop, so wrapping is a supported input.\n\nThe proposal is `alignLabel` taking `center` or `start`, defaulting to `center`, or aligning to the first line automatically when the label wraps.\n\nWorked around in the consuming app with a CSS override on the generated class name.","notes":[{"date":"2026-09-06","text":"Confirmed: align-items center at src/styles/components/tree.css:136, and TreeProps carries no alignment prop."},{"date":"2026-09-06","text":"Fixed as alignLabel. Pair it with labelOverflow=\"wrap\" for the two-line renderLabel this was reported against. If you worked around it with a CSS override on a generated class name, drop the override."}],"links":["CUI-005","CUI-014"]},{"id":"CUI-008","title":"Tree rows can only scroll horizontally, never truncate or wrap","type":"improvement","severity":"med","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d"],"integrated":[],"verified":"npx vitest run src/components/Tree.overflow.test.tsx: 8 passed. visual:compare shows the truncated label and the untouched focus ring at 76/76. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"A Tree row carries `min-width: 100%` and its scroller `overflow: auto`, so a long label widens the row and produces a horizontal scrollbar. The reporter measured a 599px row inside a 403px scroller.\n\nIn a narrow sidebar holding several trees that is several nested horizontal scrollbars, and there is no prop to opt out of it.\n\nThe proposal is `labelOverflow` taking `scroll`, `truncate` or `wrap`, defaulting to `scroll` so today's behaviour is unchanged. `truncate` would ellipsize and `wrap` would allow multiple lines, which pairs with the alignment record.\n\nWorked around in the consuming app with a CSS override on the generated class name.","notes":[{"date":"2026-09-06","text":"Confirmed: min-width 100% at src/styles/components/tree.css:85 and overflow auto at tree.css:165. TreeProps carries no overflow prop."},{"date":"2026-09-06","text":"Fixed as labelOverflow, defaulting to truncate. The repository owner chose consistency with the other ten components over compatibility, so this changes how an existing app's trees look. scroll restores the old behaviour."},{"date":"2026-09-06","text":"The first attempt regressed the focus ring. Dropping min-width on the row let it shrink to its content, and the ring shrank with it, which visual:compare caught as 543 differing pixels on the tree keyboard-navigation capture. The row now keeps max-width 100% and the label shrinks instead."},{"date":"2026-09-06","text":"If you worked around this in a consumer app, remove the CSS override that released overflow on the generated class names. It now fights the component. Where you want the old sideways scrolling, ask for labelOverflow=\"scroll\" rather than overriding."}],"links":["CUI-005","CUI-007","CUI-014"]},{"id":"CUI-009","title":"Panel collapsed hides its own header, leaving nothing to restore it","type":"improvement","severity":"med","status":"open","foundBy":"agents building two consumer apps against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Panel's `collapsed` prop sets `width: 0`, `overflow: hidden` and `border-style: none`, all with `!important`. That is the right behaviour for a side panel collapsing to an edge.\n\nIn a vertical stack it hides the title bar and any toggle along with the body, so nothing remains on screen to click to restore it. `PanelProps` exposes `width` and no direction, so a consumer cannot ask for the other axis.\n\nEvery app that wants a vertical disclosure therefore rebuilds one by hand: a chevron button in the `actions` slot, `aria-expanded` and `aria-controls` wiring, and CSS to hide the body. That is accessibility plumbing being reimplemented per app, which is what a kit exists to prevent.\n\nThe proposal is a disclosure variant, either `collapsible` with a `direction` of `horizontal` or `vertical`, or a dedicated component, keeping the header visible and shipping the toggle and the ARIA wiring.\n\nWorked around in the consuming apps by building that disclosure by hand.","notes":[{"date":"2026-09-06","text":"Confirmed: the collapsed class cs-component-panel-5 sets width 0, overflow hidden and border-style none, at src/styles/components/panel.css lines 24, 57 and 79. PanelProps at src/components/Panel.tsx:5-14 has no direction and no height."}],"links":["CUI-005","CUI-011"]},{"id":"CUI-010","title":"MarkdownViewer outline and minimap collapse state cannot be observed","type":"improvement","severity":"med","status":"open","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`outlineCollapsed` and `minimapCollapsed` seed internal state and are never read again. There is no change callback, so a consumer cannot learn that the user collapsed a pane.\n\nThe cost is larger than it sounds. A viewer is typically keyed per document, so it remounts on every document switch and both panes reset. The user's choice is lost on each navigation, not merely on reload.\n\nWith no callback the only route open to the consumer was a capture-phase click listener matching the component's own aria-labels, against the pattern `/^(Collapse|Expand) (outline|minimap)$/`. That reaches into the component's accessible names, which are not an API, and it breaks the moment a label is reworded.\n\nThe proposal is `onOutlineCollapsedChange` and `onMinimapCollapsedChange`, or an internal `storageKey` that persists the state.\n\nWorked around in the consuming app with exactly that aria-label listener.","notes":[{"date":"2026-09-06","text":"Confirmed: src/components/MarkdownViewer.tsx:283-287 seeds useState from the props and never syncs back. No onOutlineCollapsedChange or onMinimapCollapsedChange exists in the file."}],"links":["CUI-012"]},{"id":"CUI-011","title":"No content-height mode on Tree or Panel, so stacked nav sections need internal overrides","type":"feature-idea","severity":"med","status":"open","foundBy":"agents building navigation sidebars against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"A sidebar of several titled nav sections stacked in one scrolling column has no supported route. Each section should be as tall as its own rows, with one scrollbar owned by the sidebar. It is the standard documentation sidebar, and Panel plus Tree is what a consumer reaches for.\n\nBoth components are built to do the opposite. Panel exposes `width` and no height, documented as filling the available flex space. Tree has no height or scroll prop and brings its own `overflow: auto`. Each is designed to fill a container and scroll inside itself.\n\nSo the pattern is only reachable by overriding internals from outside, releasing `height`, `max-height`, `min-height` and `overflow` together down the whole chain. That depends on the internal box structure and breaks silently on a version bump.\n\nGetting the override partly right fails in a way that is very hard to see. Releasing `overflow` without releasing `height` leaves the inner component at its inherited height while its content spills out. An ancestor with `overflow: hidden` clips the overflow, and those rows never count toward the outer scroller's `scrollHeight`. The reporter measured 1344px of scrollHeight for 2562px of nav, with roughly half of a 72 item list unreachable by mouse while still reachable by `scrollIntoView`. It was reported as the last row being slightly clipped.\n\nA partial override producing silent, input-method-dependent content loss is the argument for a first-class mode rather than a documented recipe.\n\nThe proposal is something explicit on both, such as `height=\"auto\"` on Panel and a matching `scroll={false}` on Tree, meaning size to content and let an ancestor own the scrolling. A third report asked for the same thing as `scroll` taking `section` or `container` on SectionedTree.\n\nWorked around in the consuming apps with the override chain described above, plus making the scrolling parent a plain block rather than a flex column, since a flex column shrinks each section to an equal share of its own height.","notes":[{"date":"2026-09-06","text":"Confirmed: overflow auto is unconditional at src/styles/components/tree.css:165, and PanelProps at src/components/Panel.tsx:5-14 exposes width with no height."},{"date":"2026-09-06","text":"Merged from two reports asking for the same capability in different shapes, one on Panel and Tree and one on SectionedTree. The unreachable-content failure the reporter described was caused by their own partial override rather than by kit behaviour, and is recorded here as the argument for the mode, not as a separate defect."},{"date":"2026-09-06","text":"Scope clarified while fixing CUI-018. This is additive rather than a correction: the bounded panel that scrolls its own content works and the Explorer pattern demonstrates it. What is missing is the other layout, where several titled sections each size to their content and one ancestor owns the scrollbar. If that ships, Explorer should probably gain a second card showing it rather than replacing the first, because both layouts are real."}],"links":["CUI-003","CUI-004","CUI-005","CUI-009"]},{"id":"CUI-012","title":"storageKey persists arrangement on some components and not others","type":"improvement","severity":"low","status":"open","foundBy":"agents building two consumer apps against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`SplitPane` takes a `storageKey` and persists its width. `useTheme` and `ThemeToggle` take one too. `Panel`, `Tree` and `MarkdownViewer` have no equivalent, so every consumer that wants panel open state, tree expansion or viewer panes to survive a reload writes its own localStorage code, each with its own try and catch for private mode and quota errors.\n\nThe proposal is to adopt `storageKey` as a kit-wide convention for user-arrangement state, with storage failures degrading to in-memory rather than throwing.\n\nThis is filed low because each component can adopt it independently and nothing is broken today. It is worth deciding once so the components that adopt it agree on the name and the failure behaviour.","notes":[{"date":"2026-09-06","text":"Confirmed: storageKey appears on src/lib/useTheme.ts, src/components/ThemeToggle.tsx and src/components/SplitPane.tsx, and on no other component."}],"links":["CUI-010"]},{"id":"CUI-013","title":"The chart theming bridge resolves colour but not typography, so marks cannot measure text","type":"improvement","severity":"med","status":"open","foundBy":"an agent hand-drawing charts against the useChartTheme bridge on 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`patterns/Chart.md` states that the kit ships no chart primitives, only a theming bridge: draw the marks yourself and take every value from `useChartTheme()`. The reason given is that d3 and canvas need concrete values such as `#1ee0ca` rather than `var(--color-accent)`.\n\nThat reasoning applies to type as much as to colour, and the bridge stops at colour. `ChartTheme` carries sixteen colour fields and no typography at all. There is no family, no size, no weight, and no way to ask how wide a string will render.\n\nThe kit already accepts that chart consumers need this. There is a dedicated `--font-size-chart-axis` token, and `styleAxis()` applies it along with `--font-family-mono` to axis text. It passes them as `var(...)` strings, which works for SVG and DOM text and is unusable for the two things a drawing consumer needs. `ctx.font` will not accept a `var()` string, and nothing can be laid out around text whose width is unknown.\n\nMeasurement is the part that bites. Any chart drawing a labelled box, a legend chip or a truncated tick has to know the label width before it draws. With no way to ask, a consumer either reimplements a twenty-line probe or hard-codes a per-character estimate. The estimate is what ships, because it is one line and looks right on the strings it was tested against. It is a design token copied into a magic number, so it rots silently when the type scale moves. The reporter estimated 7.4px per character against a real 8.39px and drew labels wider than the boxes around them.\n\nThe proposal is to extend the existing bridge with a resolved `fontFamily`, a resolved `fontSizeAxis` in pixels, and a `measureText` helper backed by a cached canvas context. Two details matter: invalidate the cached font on a theme flip, the same way colours are re-read, and account for web fonts settling after `document.fonts.ready`.\n\nWorked around in the consuming app with the per-character estimate described above.","notes":[{"date":"2026-09-06","text":"Confirmed: ChartTheme at src/lib/chartTheme.ts:7-24 is sixteen colour fields with no typography, and styleAxis at chartTheme.ts:98-99 passes var(--font-family-mono) and var(--font-size-chart-axis) through as CSS strings."},{"date":"2026-09-06","text":"The report names a companion useChartTheme and useTheme split-brain defect as filed separately. That report was not supplied, so nothing is recorded for it here. Ask the reporter for it before assuming this record covers it."}],"links":[]},{"id":"CUI-014","title":"Decide whether driving Tree and SectionedTree as navigation is supported","type":"feature-idea","severity":"low","status":"open","foundBy":"session agent, while triaging five consumer reports for the repository owner","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Five of the records filed alongside this one come from driving Tree and SectionedTree as navigation sidebars rather than as file trees: the row alignment, the label overflow, the missing scroll into view, the forced per-section chrome, and the absent content-height mode.\n\nThe components are written for file trees. Nav sidebars want different defaults on nearly every axis, which is why each report arrives as a separate prop request.\n\nThe question is worth answering once, on the record, rather than per prop. If navigation is a supported use, the answer is probably a documented pattern or a variant that sets those defaults together, and the individual props follow from it. If it is not, the records should say so and the answer to a consumer is to compose primitives.\n\nOne of the reports raised this and nobody answered it. Filed so it is not re-litigated five times.","notes":[],"links":["CUI-003","CUI-004","CUI-007","CUI-008","CUI-011"]},{"id":"CUI-015","title":"The two parsers disagree on triple-marker emphasis such as ***both***","type":"defect","severity":"low","status":"open","foundBy":"session agent, while adding single-marker emphasis for CUI-002","opened":"2026-09-06","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`***both***` renders as `\u003cstrong>*both\u003c/strong>*` through the lightweight parser and as `\u003cem>\u003cstrong>both\u003c/strong>\u003c/em>` through the rich one. The lightweight parser matches the leading `**` first, and the `*both` left inside it never closes, so the marker is printed.\n\nThis predates the emphasis work in CUI-002 and is unchanged by it. Both builds were rendered and produce identical output, so the branch added there neither caused nor worsened it.\n\nIt is filed because `MarkdownViewer.conformance.test.tsx` asserts the two parsers produce the same DOM, and that claim is not true for this input. The corpus does not contain a triple marker, so the assertion passes.\n\nSeverity is low because triple markers are rare in the documents this renderer is aimed at. The honest options are to fix the nesting, or to write down that the lightweight subset excludes it and keep the corpus honest about what it covers.","notes":[{"date":"2026-09-06","text":"Measured both ways. With the emphasis branch and with it reverted, the lightweight parser produces \u003cstrong>*both\u003c/strong>* for ***both***, so the divergence is pre-existing."}],"links":["CUI-002"]},{"id":"CUI-016","title":"Ship a Tooltip component and move every native title tooltip onto it","type":"improvement","severity":"med","status":"closed","foundBy":"the repository owner, deciding how to fix CUI-008","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["8a781bd","31b2728"],"integrated":[],"verified":"npx vitest run src/components/Tooltip.test.tsx: 13 passed, covering the hover delay, focus opening with no delay, Escape, the hoverable bubble, both describedBy modes, overflowOnly in each direction, disabled, and that the trigger keeps its own handlers and ref. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"The kit has no tooltip component and uses the browser's native `title` attribute instead. `Table` attaches one on hover, and only when the text is actually cut off, by comparing `scrollWidth` against `clientWidth`. `patterns/DataTable.md` documents that as the expected behaviour, so it is a decision rather than an oversight.\n\nA native `title` never appears on keyboard focus. Tab to a truncated row and there is no way to read the full text, so the affordance exists for mouse users alone. It also cannot be styled, cannot be dismissed, and disappears if the pointer moves onto it.\n\nOne nuance decides the design. When text is truncated with an ellipsis the full string is still in the DOM, so a screen reader already reads it. A tooltip repeating it must therefore be hidden from assistive technology or the name is announced twice. A tooltip carrying new information must be announced. The component needs both modes and the caller picks.\n\nAgreed shape: shows on hover after a delay and on keyboard focus immediately, dismissible with Escape, stays open when the pointer moves onto it, and no collision detection in this pass. That is the WCAG 1.4.13 bar for content on hover or focus.\n\nEvery existing `title` used as a tooltip moves onto it in the same pass, so the kit ends with one mechanism rather than two.","notes":[{"date":"2026-09-06","text":"Filed before building, at the repository owner's direction, after they chose the accessible scope and a full retrofit over a staged one. Driven by CUI-008, which needs somewhere to put the full text once a Tree label is cut."},{"date":"2026-09-06","text":"Shipped in two commits: the component, then the migration of every native title onto it. Table and EventLanes keep their truncation measurement through overflowOnly. Where an accessible name already carried the text the bubble is visual only; Card's tooltip says more than its name does, so it stays announced."},{"date":"2026-09-06","text":"Two things deliberately not done. There is no collision detection, so a bubble near a viewport edge can clip, and the preview's new Tooltip section is not in the visual baseline, whose capture list is fixed at 35 components."}],"links":["CUI-008","CUI-005"]},{"id":"CUI-017","title":"The visual gate captures components but not patterns, so a pattern can break unseen","type":"defect","severity":"med","status":"closed","foundBy":"user report (repository owner): \"a couple of things broke on the Explorer pattern\", after the Tree work in CUI-008","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["08190f8"],"integrated":[],"verified":"npm run visual:capture: 35 components, 9 patterns and 3 interaction states per theme, taking the gate from 76 screenshots to 94. Two consecutive compares both reported 94/94 with 0 differing pixels, so the pattern captures are deterministic. Reapplying the Tree flex regression fails the run by name: FAIL light/pattern-explorer.png at 1034 pixels and FAIL dark at 1050. npm run check exit 0, axe violations 0 in both themes."},"resolution":null,"details":"`visual:capture` records 35 components and 3 interaction states per theme. It records no patterns. A pattern composes several components, which is exactly where a change that is right for one component in isolation goes wrong, and nothing looks at them.\n\nThis is not theoretical. A `flex: 1 1 auto` added to Tree's label for CUI-008 made the label fill its row. In a flipped tree, which lays its row out with `row-reverse`, that pinned every label to the far edge instead of beside its icon. The label measured 231px wide at an 8px gap from the row's left edge, where it should have been 20px wide at a 219px gap. `visual:compare` passed 76 of 76 screenshots throughout, because the Explorer pattern is not among them. The repository owner found it by opening the page.\n\nThe capture list is also fixed rather than derived: it stayed at 35 components while the catalog went to 37, so the Tooltip added in CUI-016 is not captured either. A new component joins the gate only if somebody remembers to add it.\n\nTwo things worth separating. Adding the nine pattern tabs to the baseline closes most of the hole. Deriving the list from the catalog stops it reopening.","notes":[{"date":"2026-09-06","text":"Found by sweeping all nine pattern tabs in both themes against a build of main, which is what the gate should have been doing. After fixing the flex, every pattern matched except two that differ for good reasons: the markdown viewer demo prints bundle sizes, which grew from 166,136 to 167,230 bytes, and the agent activity demo captures a streaming cursor mid-animation."},{"date":"2026-09-06","text":"The discipline half is written down: CONTRIBUTING.md now lists patterns as a fifth file that moves with a component, and says plainly that nothing enforces it. This record is the enforcement half."},{"date":"2026-09-06","text":"Closed in two halves. The nine pattern pages are captured with their trees expanded, because a pattern at rest shows collapsed rows and hides the composition. Reduced motion is emulated so the agent activity page stops landing mid-animation, which StreamingText already honours."},{"date":"2026-09-06","text":"The first version of this did not work. It captured the patterns and still passed the regression: 2084 differing pixels spread across a whole-page shot stayed under the 0.1% per-image ratio. A ratio dilutes a real layout shift in a large capture, so an absolute floor of 250 pixels now sits alongside it. That is safe because runs in the pinned image are deterministic to the pixel."},{"date":"2026-09-06","text":"Recapturing removed the preview-only palette lab overlay from 28 existing captures, which had been baked into the baseline. The capture now seeds it closed. Accessibility is unchanged: violations 0 to 0 and incomplete 1 to 1, with passes 53 to 52 because a collapsed overlay leaves one rule no nodes to check."},{"date":"2026-09-06","text":"The list is still explicit rather than derived, because several catalogued components cannot be captured at rest: Tooltip renders only while open, and Chip, Legend, RadioGroup and SegmentedControl have no section of their own. A check now fails when the catalog names a component this file neither captures nor excuses, which is what stops it falling behind again."}],"links":["CUI-008","CUI-016"]},{"id":"CUI-018","title":"Panel clips content taller than itself, with no scrollbar and no way to reach it by mouse","type":"defect","severity":"high","status":"closed","foundBy":"user report (repository owner): \"the Explorer - Sectioned Tree entries are not scrolling for me\"","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["a49c3aa"],"integrated":[],"verified":"npx vitest run src/components/Panel.scroll.test.tsx: 4 passed, in browser mode because jsdom computes no layout and would pass against a panel that clips everything. Reverting only panel.css fails 2 of the 4. Driven in the real Explorer pattern with Playwright: a mouse wheel over the panel moves scrollTop from 0 to 700 to 1701, which is the full previously hidden extent, against 0 before the fix. Full suite 613 passed across 61 files. npm run check exit 0. visual:compare 76/76 with axe violations 0, so no panel in the captured set gained a scrollbar."},"resolution":null,"details":"Panel's body carries `overflow: hidden`. Content taller than the Panel is therefore clipped with no scrollbar, and Panel exposes `width` and nothing for height or scrolling, so a consumer cannot ask for anything else without overriding internals.\n\nMeasured in the Explorer pattern with Playwright. The Panel body is 408px tall around 2109px of content, so 1701px of a 65 row tree is off screen. A real wheel gesture over the tree moves nothing: no box inside the card changes `scrollTop`, and the window does not move either.\n\nThe content is not gone, which is what makes this hard to see. A box with `overflow: hidden` still scrolls programmatically, so `scrollIntoView` on the last row takes the body's `scrollTop` from 0 to 1685 and brings it into view. Keyboard navigation and any link-driven selection therefore work, and only the mouse fails. That is the input-method-dependent content loss one of the original consumer reports described, except here it is the kit's own component doing the clipping rather than a consumer's override.\n\nTwo faults, and they are separable. Panel losing content silently is the component fault and the one to fix: either the body scrolls when it overflows, or Panel gains a prop that says what to do, but clipping without a scrollbar should not be the default. The Explorer pattern composing an unbounded SectionedTree inside a fixed height Panel is the second, and patterns are the worked examples people copy, so it currently teaches the broken composition.\n\nDeciding this properly means deciding CUI-011 with it. A content-height mode on Tree and Panel is the other half of the same question.","notes":[{"date":"2026-09-06","text":"Pre-existing, not introduced by the Tree work. The whole ancestor chain from the deepest row to the body was captured on this branch and on a build of main, and the two are identical: the Panel body reports client 408 and scroll 2109 with overflow hidden in both, and the wheel moves nothing in both."},{"date":"2026-09-06","text":"Not fixed here. Making Panel's body scroll changes the layout of every Panel in every consumer, so it is the repository owner's call rather than a fix to slip into a Tree change."},{"date":"2026-09-06","text":"Fixed by making the body `overflow: auto`. That is not a new decision: components/Panel.md has always specified `flex: 1`, `overflow-y: auto`, `min-height: 0` for the content area, and the stylesheet said `hidden`. The spec was right and the CSS was wrong, so this restores the documented behaviour rather than changing it."},{"date":"2026-09-06","text":"The gates could not have caught this. check-integrity compares documented DOM hooks against the source, not documented CSS properties against the stylesheet, so a spec and a stylesheet disagreeing about overflow goes unnoticed. Worth a record of its own if the same shape turns up again."},{"date":"2026-09-06","text":"The pattern half is not fixed. ExplorerDemo still composes an unbounded SectionedTree inside a fixed height Panel; it now scrolls rather than losing content, but whether that is the composition the pattern should teach belongs with CUI-011."},{"date":"2026-09-06","text":"Correcting the note above that called the pattern a second fault. Measured after the fix: the sectioned explorer has two vertical scrollers, the demo card's own frame and the panel body, and none nested inside the panel. Each section's tree fits its content at 580 of 580, so the nested scrollbars the original reports complained about are not present. The composition is a bounded panel whose content scrolls inside it, which is the ordinary explorer sidebar and needs no change. The pattern was only wrong while the component clipped."}],"links":["CUI-011","CUI-009","CUI-017"]}],"drafts":[],"queue":{"recommendedBy":"session agent, triaging five consumer reports for the repository owner","updated":"2026-09-06","items":[{"id":"CUI-005","why":"The escape hatch every other record is currently forced through, and it breaks on any rebuild."},{"id":"CUI-006","why":"A silent unstyled render is a bad failure mode for a design system, and one app shipped that way unnoticed."}]},"description":"@codesweep-ai/ui is a library of React components and design tokens for agent and LLM interfaces. This ledger tracks its defects, improvements and ideas.","commitUrlTemplate":null,"derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"CUI-001":"2026-09-06","CUI-002":"2026-09-06","CUI-003":"2026-09-06","CUI-004":"2026-09-06","CUI-005":"2026-09-06","CUI-006":"2026-09-06","CUI-007":"2026-09-06","CUI-008":"2026-09-06","CUI-009":"2026-09-06","CUI-010":"2026-09-06","CUI-011":"2026-09-06","CUI-012":"2026-09-06","CUI-013":"2026-09-06","CUI-014":"2026-09-06","CUI-015":"2026-09-06","CUI-016":"2026-09-06","CUI-017":"2026-09-06","CUI-018":"2026-09-06"},"events":[{"d":"2026-09-06","kind":"opened","k":"CU ,{"d":"2026-09-06","kind":"note","k":"CUI-007","x":"Fixed as alignLabel. Pair it with labelOverflow=\"wrap\" for the two-line renderLabel this was reported against. If you wo"},{"d":"2026-09-06","kind":"closed","k":"CUI-007","x":""},{"d":"2026-09-06","kind":"opened","k":"CUI-008","x":""},{"d":"2026-09-06","kind":"note","k":"CUI-008","x":"Confirmed: min-width 100% at src/styles/components/tree.css:85 and overflow auto at tree.css:165. TreeProps carries no o"},{"d":"2026-09-06","kind":"note","k":"CUI-008","x":"Fixed as labelOverflow, defaulting to truncate. The repository owner chose consistency with the other ten components ove"},{"d":"2026-09-06","kind":"note","k":"CUI-008","x":"The first attempt regressed the focus ring. Dropping min-width on the row let it shrink to its content, and the ring shr"},{"d":"2026-09-06","kind":"note","k":"CUI-008","x":"If you worked around this in a consumer app, remove the CSS override that released overflow on the generated class names"},{"d":"2026-09-06","kind":"closed","k":"CUI-008","x":""},{"d":"2026-09-06","kind":"opened","k":"CUI-009","x":""},{"d":"2026-09-06","kind":"note","k":"CUI-009","x":"Confirmed: the collapsed class cs-component-panel-5 sets width 0, overflow hidden and border-style none, at src/styles/c"},{"d":"2026-09-06","kind":"opened","k":"CUI-010","x":""},{"d":"2026-09-06","kind":"note","k":"CUI-010","x":"Confirmed: src/components/MarkdownViewer.tsx:283-287 seeds useState from the props and never syncs back. No onOutlineCol"},{"d":"2026-09-06","kind":"opened","k":"CUI-011","x":""},{"d":"2026-09-06","kind":"note","k":"CUI-011","x":"Confirmed: overflow auto is unconditional at src/styles/components/tree.css:165, and PanelProps at src/components/Panel."},{"d":"2026-09-06","kind":"note","k":"CUI-011","x":"Merged from two reports asking for the same capability in different shapes, one on Panel and Tree and one on SectionedTr"},{"d":"2026-09-06","kind":"note","k":"CUI-011","x":"Scope clarified while fixing CUI-018. This i <script>

(function viewerMain() {

  var byKey = {};

  // Since-last-visit: read the previous visit date, stamp today's. Client-side

  var prevVisit = null;

  // ---- sparkline (found vs fixed, cumulative)

  function groupsFor(items) {

    });
    h += '</div>';
    if (evs.length > CAP) {
      h += '<div class="lanenote">' + (evs.length - CAP) +
        ' older events not shown — narrow the filters, or read the records directly</div>';
    }
    h += '</section>';
    if (!evs.length) {
      h = '<div class="empty">No activity matches the current filters.<br><button class="lnk" id="resetBtn">reset filters</button></div>';
    }
    $('#groups').innerHTML = h;
  }

  function renderBrief() {
    var resolvedN = 0;
    recs.forEach(function (r) { if (r._terminal) resolvedN++; });
    var h = '<div class="brief">';
    h += '<div class="bblock btrend"><div class="bhead2"><span>trend · daily</span><span class="cnt">' +
      '<span class="lg"><i class="swf"></i>' + recs.length + ' found</span> ' +
      '<span class="lg"><i class="swx"></i>' + resolvedN + ' resolved</span> ' +
      '</span></div><div id="spark" class="barwrap"></div></div>';

    var tops = [];
    if (QUEUE) {
      for (var j = 0; j < QUEUE.items.length; j++) {
        var it = QUEUE.items[j];
        if (!it || !it.id) continue;
        for (var k2 = 0; k2 < recs.length; k2++) {
          if (recs[k2].id === it.id && !recs[k2]._terminal) { tops.push({ it: it, r: recs[k2] }); break; }
        }
      }
    }
    var shown = tops.slice(0, 3);
    var qhead = '';
    if (QUEUE && QUEUE.updated) {
      qhead = '<span class="cnt">queue · ' + shown.length + ' of ' + tops.length + ' · as of ' + esc(QUEUE.updated);
      var newer = DERIVED.queuePredates;
      if (newer > 0) qhead += '<span class="qstale"> · predates ' + newer + ' newer event' + (newer > 1 ? 's' : '') + '</span>';
      qhead += '</span>';
    }
    h += '<div class="bblock"><div class="bhead2"><span>up next</span>' + qhead + '</div>';
    if (shown.length) {
      shown.forEach(function (t, ti) {
        h += '<div class="qrow' + (ti === 0 ? ' qfirst' : '') + '" data-open="' + esc(t.r.id) + '"><div class="qrowhead">' +
          '<span class="rank">' + qRank[t.r.id].rank + '</span>' +
          '<span class="idm">' + esc(t.r.id) + '</span>' + (t.r._idea ? '' : sevHtml(t.r.severity)) + tagHtml(t.r.type) + '</div>' +
          '<div class="qttl">' + esc(t.r.title) + '</div>' +
          '<div class="bwhy">' + esc(t.it.why || '') + '</div></div>';
      });
    } else {
      h += '<div class="laneempty">no live queue recommendation — see the board</div>';
    }
    h += '</div>';

    var needs = [];
    DERIVED.draftsAwaiting.forEach(function (dd) { needs.push({ k: dd.k, label: 'draft awaiting an id: ' + dd.title }); });
    recs.forEach(function (r) {
      if (r.status === 'in-progress' && r._stale) needs.push({ k: r.id, label: r.id + ' — in progress but stale ' + r._age + 'd' });
    });
    DERIVED.unqueuedCriticals.forEach(function (id) { needs.push({ k: id, label: id + ' — critical but not in the queue' }); });
    h += '<div class="bblock"><div class="bhead2"><span>needs you</span></div>';
    if (needs.length) {
      needs.slice(0, 5).forEach(function (n) {
        h += '<div class="actrow" data-open="' + esc(n.k) + '"><span class="ttl">' + esc(n.label) + '</span></div>';
      });
    } else {
      h += '<div class="laneempty">nothing — the agents have it</div>';
    }
    h += '</div>';

    h += '<div class="bviews"><button class="chip" data-goview="board">board</button>' +
      '<button class="chip" data-goview="list">list</button>' +
      '<button class="chip" data-goview="activity">activity</button></div>';
    h += '</div>';
    $('#groups').innerHTML = h;
    sparkline();
  }

  function renderList() {
    if (state.view === 'brief') { renderBrief(); return; }
    if (state.view === 'board') { renderBoard(); return; }
    if (state.view === 'activity') { renderActivity(); return; }
    var items = recs.concat(drafts).filter(function (r) { return pass(r, false); });
    var h = '';
    var resolvedDescL = function (a, b) {
      var ar = a.resolved || '', br = b.resolved || '';
      if (ar !== br) return ar < br ? 1 : -1;
      var ka = keyOf(a), kb = keyOf(b);
      return ka < kb ? 1 : -1;
    };
    groupsFor(items).forEach(function (g) {
      if ((g.key === 'closed' || g.key === 'retired') && state.sort === 'id') g.items.sort(resolvedDescL);
      else g.items.sort(cmp);
      var col = state.collapsed[g.key];
      h += '<section class="grp ' + (g.cls || '') + '"><header data-g="' + g.key + '"><span>' +
        (col ? '&#9656;' : '&#9662;') + ' ' + esc(g.label) + '</span><span class="cnt">' + g.items.length + '</span></header>';
      if (!col) {
        h += '<div class="cards listcards">';
        g.items.forEach(function (r) { h += bcardHtml(r); });
        h += '</div>';
      }
      h += '</section>';
    });
    if (!items.length) {
      h = '<div class="empty">No records match the current filters.<br><button class="lnk" id="resetBtn">reset filters</button></div>';
    }
    $('#groups').innerHTML = h;
  }

  function resetFilters() {
    state.q = ''; state.status = 'all'; state.staleOnly = false; state.newOnly = false;
    state.types = { 'defect': 1, 'improvement': 1, 'feature-idea': 1 };
    state.sevs = { 'critical': 1, 'high': 1, 'med': 1, 'low': 1 };
    $('#q').value = '';
    syncControls();
  }


  function syncControls() {
    $('#staleBtn').classList.toggle('on', state.staleOnly);
    $('#newBtn').classList.toggle('on', state.newOnly);
    var af = 0;
    if (state.status !== 'all') af++;
    if (!(state.types.defect && state.types.improvement && state.types['feature-idea'])) af++;
    if (!(state.sevs.critical && state.sevs.high && state.sevs.med && state.sevs.low)) af++;
    if (state.staleOnly) af++;
    $('#cycStatus').textContent = 'status · ' + (STATUS_FACES[state.status] || state.status);
    var ti = cycleIndex(TYPE_CYCLE, state.types, TYPE_KEYS);
    $('#cycType').textContent = 'type · ' + (ti >= 0 ? TYPE_CYCLE[ti].face : 'custom');
    var si = cycleIndex(SEV_CYCLE, state.sevs, SEV_KEYS);
    $('#cycSev').textContent = 'sev · ' + (si >= 0 ? SEV_CYCLE[si].face : 'custom');
    $('#cycStatus').classList.toggle('hasactive', state.status !== 'all');
    $('#cycType').classList.toggle('hasactive', ti !== 0);
    $('#cycSev').classList.toggle('hasactive', si !== 0);
    $('#resetChip').disabled = af === 0;
    $('#cycGroup').textContent = 'group · ' + GROUP_FACES[state.groupBy];
    $('#cycSort').textContent = 'sort · ' + SORT_FACES[state.sort];
    $('#cycGroup').classList.toggle('hasactive', state.groupBy !== 'status');
    $('#cycSort').classList.toggle('hasactive', state.sort !== 'id');
    renderList();
  }

  function showModal(k) {
    clearIntroSkin();
    var all = recs.concat(drafts);
    var r = null;
    for (var j = 0; j < all.length; j++) if (keyOf(all[j]) === k) { r = all[j]; break; }
    if (!r) return;
    var h = '<div class="mhead"><span class="idm">' + esc(r.id || 'draft') + '</span>' +
      (r._idea ? '' : sevHtml(r.severity)) + tagHtml(r.type) +
      (r._draft ? '<span class="tag">' + esc(r.member) + '</span>' : '') +
      (r.stint ? '<span class="wo">' + esc(r.stint) + '</span>' : '') + staleHtml(r) +
      '<span class="mmeta">' + (r._terminal ? '&#10003; ' + esc(r.resolved || '') : esc(r.foundBy || '')) + '</span></div>';
    h += '<div class="mttl">' + esc(r.title) + '</div>';
    h += detailHtml(r);
    $('#modalbody').innerHTML = h;
    var m = $('#modal');
    m.hidden = false;
    m.scrollTop = 0;
    var mc = m.querySelector('.modalcard');
    if (mc) mc.scrollTop = 0;
    if (r.id) { try { history.replaceState(null, '', '#' + r.id); } catch (e) { /* file:// */ } }
  }
  function closeModal() {
    clearIntroSkin();
    $('#modal').hidden = true;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file:// */ }
  }

  function updateView() {
    document.getElementById('viewBrief').classList.toggle('on', state.view === 'brief');
    document.getElementById('viewList').classList.toggle('on', state.view === 'list');
    document.getElementById('viewBoard').classList.toggle('on', state.view === 'board');
    document.getElementById('viewActivity').classList.toggle('on', state.view === 'activity');
    document.querySelector('.filterbar').classList.toggle('boardmode', state.view !== 'list');
    document.body.classList.toggle('briefmode', state.view === 'brief');
  }

  // ---- wiring
  $('#groups').addEventListener('click', function (ev) {
    var gv = ev.target.closest('[data-goview]');
    if (gv) { state.view = gv.getAttribute('data-goview'); updateView(); renderList(); return; }
    var bc = ev.target.closest('.bcard,.actrow,.qrow');
    if (bc) { showModal(bc.getAttribute('data-open')); return; }
    var lnk = ev.target.closest('.lnk');
    if (lnk && lnk.id === 'resetBtn') { resetFilters(); return; }
    if (lnk && lnk.getAttribute('data-link')) { showModal(lnk.getAttribute('data-link')); return; }
    var gh = ev.target.closest('header[data-g]');
    if (gh) {
      var g = gh.getAttribute('data-g');
      if (state.collapsed[g]) delete state.collapsed[g]; else state.collapsed[g] = 1;
      renderList();
    }
  });
  $('#viewBrief').addEventListener('click', function () { state.view = 'brief'; updateView(); renderList(); });
  $('#viewList').addEventListener('click', function () { state.view = 'list'; updateView(); renderList(); });
  $('#viewBoard').addEventListener('click', function () { state.view = 'board'; updateView(); renderList(); });
  $('#viewActivity').addEventListener('click', function () { state.view = 'activity'; updateView(); renderList(); });
  var newBtn = $('#newBtn');
  if (newCount > 0) {
    newBtn.hidden = false;
    newBtn.textContent = 'new since last visit (' + newCount + ')';
  }
  newBtn.addEventListener('click', function () { state.newOnly = !state.newOnly; syncControls(); });
  function introHtml() {
    var ent = function (term, def) {
      return '<div class="gent"><div class="gterm">' + term + '</div><div class="gdef">' + def + '</div></div>';
    };
    return '<div class="introbody"><div class="dlbl">how to read this ledger</div>' +
      '<p class="introdesc">A ledger is a repo&#39;s issue tracker kept as files inside the repo: records — one JSON file per defect, improvement, or idea — written mostly by AI agents as they work, and read by the humans directing them. This page is a view of those files.</p>' +
      '<div class="dlbl gband">views</div>' +
      ent('brief', 'the gist: the opened-vs-resolved trend, the queue&#39;s top picks (see &#8220;up next&#8221;) with their rationales, and what needs a human.') +
      ent('board', 'current state by status; queued records carry their rank badge.') +
      ent('list', 'every record, groupable (status &#183; stint &#183; type) and sortable.') +
      ent('activity', 'what happened, newest first. Derived, not logged: one row per dated fact (opened, each note, resolved), so the same id appears once per event.') +
      '<div class="dlbl gband">concepts</div>' +
      ent('record', 'one tracked issue: a type (defect &#183; improvement &#183; idea), a severity (low &#8594; critical), a status (open &#8594; in-progress &#8594; closed / wont-fix / roadmap), and evidence when closed.') +
      ent('up next', 'the queue: a person or agent&#39;s take on what to fix next, each pick with its why. The &#8220;as of&#8221; date is when that judgment was made; the brief flags when it predates newer events.') +
      ent('needs you', 'derived, never authored: the things stuck until a human weighs in — drafts awaiting an id, in-progress records gone quiet (abandoned or alive — your call), open criticals no queue pick covers. The queue is the agents&#39; to-do list; this is yours. It can only be empty, never stale, and empty is the good state.') +
      ent('note', 'a dated update appended to a record; history accretes, never rewrites.') +
      ent('stint', 'the named burst of work a record was picked up in — a branch, an agent run, a working session. Set when work starts, so in-flight work is visible.') +
      ent('stale', 'computed in your browser: no activity on a record for the repo&#39;s configured window.') +
      ent('new', 'new since this browser&#39;s last visit; a first visit marks nothing.') +
      '<div class="dlbl gband">sources</div>' +
      ent('ledger.json', 'project config: name, description, the staleness window.') +
      ent('issues/&lt;id&gt;.json', 'one record per issue — the ledger itself.') +
      ent('drafts/&lt;member&gt;/', 'observations from agents working in parallel, awaiting an id — ids are assigned at integration.') +
      ent('queue.json', 'the fix-next recommendation behind &#8220;up next&#8221;; its author is named inside it.') +
      '<p class="introfoot">All the views in the ledger are generated from exactly these files and never edited by hand. The files themselves are written by whoever does the work — usually agents, following the repo&#39;s operating manual (ledger/AGENTS.md). ' +
      'Click any card or row for the full story: narrative, dated notes, and closure evidence (commits + how it was verified).</p>' +
      '</div>';
  }
  function showIntroModal() {
    $('#modalbody').innerHTML = introHtml();
    var m = $('#modal');
    m.hidden = false;
    var mc = m.querySelector('.modalcard');
    if (mc) { mc.classList.add('intro'); mc.scrollTop = 0; }
  }
  function clearIntroSkin() {
    var mc = $('#modal .modalcard');
    if (mc) mc.classList.remove('intro');
  }
  $('#helpBtn').addEventListener('click', showIntroModal);
  if (prevVisit === null && state.view !== 'brief') showIntroModal();

  $('#modal').addEventListener('click', function (ev) {
    if (ev.target.id === 'modal' || ev.target.closest('#modalx')) { closeModal(); return; }
    var lnk = ev.target.closest('.lnk');
    if (lnk && lnk.getAttribute('data-link')) showModal(lnk.getAttribute('data-link'));
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
  });
  $('#staleBtn').addEventListener('click', function () { state.staleOnly = !state.staleOnly; syncControls(); });
  // narrow-mode cycling filter chips: curated states, fixed footprint
  var TYPE_KEYS = ['defect', 'improvement', 'feature-idea'];
  var SEV_KEYS = ['critical', 'high', 'med', 'low'];
  var TYPE_CYCLE = [
    { face: 'all', set: { defect: 1, improvement: 1, 'feature-idea': 1 } },
    { face: 'defects', set: { defect: 1 } },
    { face: 'improv', set: { improvement: 1 } },
    { face: 'ideas', set: { 'feature-idea': 1 } }
  ];
  var SEV_CYCLE = [
    { face: 'all', set: { critical: 1, high: 1, med: 1, low: 1 } },
    { face: 'crit', set: { critical: 1 } },
    { face: 'high+', set: { critical: 1, high: 1 } },
    { face: 'med+', set: { critical: 1, high: 1, med: 1 } }
  ];
  function cycleIndex(cycle, cur, keys) {
    for (var i = 0; i < cycle.length; i++) {
      var ok = true;
      keys.forEach(function (k) { if (!!cycle[i].set[k] !== !!cur[k]) ok = false; });
      if (ok) return i;
    }
    return -1;
  }
  var STATUS_FACES = { all: 'all', open: 'open', 'in-progress': 'in prog', closed: 'closed', ideas: 'ideas', retired: 'retired', drafts: 'drafts' };
  function statusCycleList() {
    var c = { open: 0, 'in-progress': 0, closed: 0, ideas: 0, retired: 0, drafts: drafts.length };
    recs.forEach(function (r) {
      if (r._idea) c.ideas++;
      else if (r.status === 'open') c.open++;
      else if (r.status === 'in-progress') c['in-progress']++;
      else if (r.status === 'closed') c.closed++;
      else c.retired++;
    });
    return ['all', 'open', 'in-progress', 'closed', 'ideas', 'retired', 'drafts'].filter(function (s) {
      return s === 'all' || c[s] > 0;
    });
  }
  $('#cycStatus').addEventListener('click', function () {
    var list = statusCycleList();
    state.status = list[(list.indexOf(state.status) + 1) % list.length];
    syncControls();
  });
  $('#cycType').addEventListener('click', function () {
    var next = TYPE_CYCLE[(cycleIndex(TYPE_CYCLE, state.types, TYPE_KEYS) + 1) % TYPE_CYCLE.length];
    state.types = Object.assign({}, next.set);
    syncControls();
  });
  $('#cycSev').addEventListener('click', function () {
    var next = SEV_CYCLE[(cycleIndex(SEV_CYCLE, state.sevs, SEV_KEYS) + 1) % SEV_CYCLE.length];
    state.sevs = Object.assign({}, next.set);
    syncControls();
  });
  $('#resetChip').addEventListener('click', function () { resetFilters(); });
  var GROUP_CYCLE = ['status', 'stint', 'type'];
  var GROUP_FACES = { status: 'status', stint: 'stint', type: 'type' };
  var SORT_CYCLE = ['id', 'date', 'sev'];
  var SORT_FACES = { id: 'id', date: 'activity', sev: 'severity' };
  $('#cycGroup').addEventListener('click', function () {
    state.groupBy = GROUP_CYCLE[(GROUP_CYCLE.indexOf(state.groupBy) + 1) % GROUP_CYCLE.length];
    syncControls();
  });
  $('#cycSort').addEventListener('click', function () {
    state.sort = SORT_CYCLE[(SORT_CYCLE.indexOf(state.sort) + 1) % SORT_CYCLE.length];
    syncControls();
  });
  $('#q').addEventListener('input', function (ev) { state.q = ev.target.value; renderList(); });

  var themeBtn = $('#themeBtn');
  function themeLabel() {
    var cur = document.documentElement.getAttribute('data-theme');
    themeBtn.innerHTML = cur === 'dark' ? '&#9788; light' : '&#9789; dark';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ledger-theme', next); } catch (e) { /* file:// */ }
    themeLabel();
  });
  themeLabel();

  var hashTarget = null;
  if (location.hash) {
    var target = decodeURIComponent(location.hash.slice(1));
    var all = recs.concat(drafts);
    for (var j = 0; j < all.length; j++) {
      if (keyOf(all[j]) === target) { hashTarget = target; break; }
    }
  }
  updateView();
  renderList();
  if (hashTarget) showModal(hashTarget);
})();
</script>
</body>
</html>
