  --chart-fixed: var(--color-cat-3-dark);
  --sev-c: var(--color-error);
  --sev-h: var(--color-severe);

}
.tbtn:hover { background: var(--color-nav-hover); }

<script id="ledger-data" type="application/json">{"project":"ui","staleAfterDays":14,"records":[{"id":"CUI-001","title":"escapeMarkdownHtml escapes \u003c inside code, corrupting code spans, fences and mermaid diagrams","type":"defect","severity":"high","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["15bbb39"],"integrated":[],"verified":"npx vitest run src/lib/markdownUrl.test.ts: 12 passed. Reverting only src/lib/markdownUrl.ts and rerunning fails 7 of those 12, plus all 3 consumer cases added to MarkdownViewer.security.test.tsx (both viewers) and MarkdownViewer.mermaid.test.tsx. The 5 that still pass on the reverted build are the prose cases, which is the evidence prose escaping is unchanged. Full suite 569 passed across 57 files, up from 554 across 56. npm run check exit 0."},"resolution":null,"details":"`escapeMarkdownHtml` in `src/lib/markdownUrl.ts` replaces every `\u003c` that opens a tag with `&lt;`, and `MarkdownViewer` applies it to the whole document before either renderer sees it. The escape does not know where code begins, so it corrupts verbatim regions.\n\nTwo symptoms. Inline `` `Array\u003cstring>` `` renders on the page as the literal text `Array&lt;string>`, because neither renderer decodes entities back inside code. And a `\u003cbr/>` inside a ```mermaid fence reaches MermaidDiagram as `&lt;br/>`, so mermaid emits a stray `br` in the node label instead of a line break.\n\nIn prose the bug is invisible, because the lightweight parser's `appendText` decodes entities again. That is why it survived: it only shows up inside code, and it shows up on every TypeScript generic.\n\nThe escape exists to keep raw HTML out of react-markdown's tree, where a consumer's rehype plugin would render it. A fix must keep prose escaping byte for byte identical and exempt only regions both renderers already treat as literal text.\n\nWorked around in the consuming app by post-processing the rendered DOM to undo the entity.","notes":[{"date":"2026-09-06","text":"Confirmed against src/lib/markdownUrl.ts:25 and src/components/MarkdownViewer.tsx:756. Reproduced with a throwaway vitest file: the escaper's output contains `Array&lt;string>` and `one&lt;br/>two`, both asserted and passing."},{"date":"2026-09-06","text":"The report arrived with a full fix and a claim of 565 tests passing across 57 files. That work is not in this repository, whose baseline is 554 across 56. Treating the design as a proposal rather than as landed work."},{"date":"2026-09-06","text":"Fixed by making the escaper code-aware rather than by narrowing what it escapes. It now walks the source and passes fenced blocks and code spans through untouched, reusing LightweightMarkdown's own fence regexes so the escaper and the parser cannot disagree about where code begins. Indented 4-space code blocks are deliberately still escaped, because telling one from a lazy paragraph continuation is ambiguous and a wrong guess would under-escape."},{"date":"2026-09-06","text":"If you worked around this in a consumer app, undo it. Any post-processing that rewrote &lt; back to \u003c in rendered output will now double-handle correct text, and a pre-pass over the markdown source is no longer needed. Take the fix and delete the workaround rather than leaving both in place. components/MarkdownViewer.md now states the prose and code rules separately, so the guarantee you are relying on is written down."}],"links":["CUI-002"]},{"id":"CUI-002","title":"LightweightMarkdown never renders single-marker emphasis, so *text* shows its markers","type":"defect","severity":"high","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["10ca181"],"integrated":[],"verified":"npx vitest run src/components/MarkdownViewer.conformance.test.tsx: 14 passed, of which 10 are new assertions run against both parsers. Reverting only src/components/LightweightMarkdown.tsx fails 3 of them, including the corpus comparison, which is the evidence the widened corpus now guards the invariant. Full suite 579 passed across 57 files, up from 569. npm run check exit 0."},"resolution":null,"details":"`parseInline` in `src/components/LightweightMarkdown.tsx` has branches for backslash escapes, code spans, images, links, `**` and `__` for strong, `~~` for strikethrough, and hard breaks. It has no branch for a single `*` or `_`, so emphasis falls through to the literal-text path and the markers are printed.\n\nTo a reader the failure looks intermittent: bold renders and italic does not.\n\nThe lightweight parser is what the default `MarkdownViewer` export uses. The rich parser renders `\u003cem>` correctly, so the two disagree. That contradicts the invariant asserted by `MarkdownViewer.conformance.test.tsx`, which claims both parsers produce the same DOM.\n\nThat test passes only because `markdownConformanceCorpus` never contains single-marker emphasis. It exercises `**bold text**` and `**strong text**` and nothing else. Widening the corpus belongs to this record, because a fix that leaves the corpus thin leaves the invariant unguarded.\n\nWorked around in the consuming app by pre-converting single markers to double before handing content to the viewer.","notes":[{"date":"2026-09-06","text":"Confirmed against src/components/LightweightMarkdown.tsx:142-147, which matches `**` and `__` only. Reproduced with a throwaway vitest file: `*italic* and _also_ and **bold**` renders 0 `\u003cem>`, 1 `\u003cstrong>`, and the literal text `*italic*`."},{"date":"2026-09-06","text":"Corpus gap confirmed by reading src/test/markdownConformance.ts in full."},{"date":"2026-09-06","text":"Fixed by adding an emphasis branch after the two-marker forms, so `**` is never read as a pair of `*`. It carries two flanking rules taken from CommonMark: a marker followed by whitespace opens nothing, and `_` does not emphasise inside a word. The second is what leaves snake_case identifiers alone, and the corpus now asserts it."},{"date":"2026-09-06","text":"If you worked around this in a consumer app, undo it. A pre-pass that rewrote single markers to double before handing content to the viewer will now produce bold where the author wrote italic, so it is worse than doing nothing once this ships. Remove it rather than leaving both."}],"links":["CUI-001","CUI-015"]},{"id":"CUI-003","title":"SectionedTree does not scroll the selected row into view, but Tree does","type":"defect","severity":"med","status":"closed","foundBy":"an agent building a six-section navigation sidebar against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d","2cd300f"],"integrated":[],"verified":"Measured before fixing: a throwaway test rendering Tree and changing selectedId from outside recorded 0 scrollIntoView calls, so Tree did not do this either. Fixed as an opt-in prop on both. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline. Default flipped to true in 2cd300f, with three further tests in Tree.overflow.test.tsx asserting the scroll happens, that it can be turned off, and that it is not animated: 11 passed in that file, 609 across 60 files. npm run check exit 0, visual:compare 76/76, axe violations 0."},"resolution":null,"details":"`Tree` scrolls its selected row into view. `SectionedTree`, which composes Trees, does not.\n\nWhen selection is driven from outside the component, by a link elsewhere on the page setting `selectedId`, the selected row can sit off screen in a SectionedTree with no indication. The sidebar shows an unrelated position. The same interaction works in a plain Tree.\n\nThis is filed as a defect rather than a gap because two components meant to compose behave differently on the same input.\n\nWorked around in the consuming app by abandoning SectionedTree for Panel plus Tree per section.","notes":[{"date":"2026-09-06","text":"Confirmed: src/components/Tree.tsx:597 calls scrollIntoView with block nearest. A grep for scrollIntoView across src/components returns no hit in SectionedTree.tsx."},{"date":"2026-09-06","text":"The report's premise was wrong and the record is corrected here rather than rewritten. Tree does call scrollIntoView, but only for the current search match and for keyboard navigation. An externally-set selectedId scrolled in neither component. Measured with a throwaway test that stubbed Element.prototype.scrollIntoView and counted 0 calls across a selectedId change."},{"date":"2026-09-06","text":"So this was a missing capability rather than an inconsistency. Fixed as scrollSelectedIntoView on both, defaulting to false, because turning it on by default would change Tree's behaviour for everyone on the strength of a premise that did not hold. Consumers driving selection from a link elsewhere on the page should pass it."},{"date":"2026-09-06","text":"The repository owner reversed the default to true, on the grounds that nobody could name a reason to want a selection left off screen. The conservative default came from the report being wrong about the baseline, not from a case against the behaviour, so the reversal stands."},{"date":"2026-09-06","text":"The selection scroll is deliberately not animated, which the other two callers are. Search matches and arrow keys scroll because the user just acted on the tree, where an animation helps them follow the move. This one fires because the page changed underneath it, so an animation draws the eye to movement nobody asked for, and rapid selection changes queue smooth scrolls against each other. Both animated callers now honour prefers-reduced-motion, which they did not before: that was a pre-existing gap against the convention Skeleton, Toast, PulseBadge and StreamingText already keep, and making this routine is what surfaced it."}],"links":["CUI-004","CUI-011"]},{"id":"CUI-004","title":"SectionedTree forces a filter box and an expand-all control on every section","type":"defect","severity":"med","status":"closed","foundBy":"an agent building a six-section navigation sidebar against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d"],"integrated":[],"verified":"npx vitest run src/components/SectionedTree.chrome.test.tsx: 6 passed, covering the default, turning every filter off, one section overriding the rest, and dropping the expand-all control. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"`SectionedTree` renders a filter input and an expand-all control for every section, and neither can be turned off. It sets `filterable`, `onToggleExpandAll` and `allExpanded` on each child Tree itself, and exposes none of them on its own props.\n\nWith six sections that is six filter boxes and six expand-all controls, most of them over sections of two to eleven items. In a 300px sidebar the chrome outweighed the content.\n\nThe inconsistency is the argument for calling this a defect. Plain `Tree` offers `filterable` as opt-in. `SectionedTree` composes Trees and removes a choice the composed component gives.\n\nWorked around in the consuming app by abandoning SectionedTree for Panel plus Tree per section, with a filter only on sections above twenty items. That took six filter boxes down to two.","notes":[{"date":"2026-09-06","text":"Confirmed: src/components/SectionedTree.tsx:311-315 passes filterable, onToggleExpandAll and allExpanded unconditionally. SectionedTreeProps at lines 26-48 exposes none of the three."},{"date":"2026-09-06","text":"Fixed as filterable and expandAllControl, both defaulting to true so nothing existing changes, with TreeSection.filterable overriding per section. If you abandoned SectionedTree for Panel plus Tree because of this, it is worth another look: filterable={false} with a per-section override is what the workaround was reproducing by hand."}],"links":["CUI-003","CUI-011"]},{"id":"CUI-005","title":"No stable styling hooks, so consumer overrides target generated class names","type":"improvement","severity":"high","status":"closed","foundBy":"agents building two consumer apps against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["31b2728","5d4f99d","a49c3aa","7aa6ae7"],"integrated":[],"verified":"Every component named in the report now carries data-part: Tree on its scroller, rows, labels and icons; SectionedTree on its sections, headers and bodies; Panel on its header and body; MarkdownViewer on its scroller, document, outline, outline nav and minimap, with named rails for the collapsed panes. Table names its truncatable cell and Tooltip its bubble. npx vitest run: 615 passed across 61 files, including hook assertions in Tree.overflow, SectionedTree.chrome, Panel.scroll, Tooltip and MarkdownViewer.states. npm run docs:compile: 37 passed, which is what holds the MarkdownViewer parts to its specification. npm run check exit 0, visual:compare 94/94 with axe violations 0."},"resolution":null,"details":"Components carry `data-component` on their root and nothing on the structure beneath it. A consumer who has to reach inside one has only the generated class names, such as `cs-component-tree-142` and `cs-component-panel-20`. Those change on any rebuild, so the selector silently stops matching and the override quietly disappears.\n\nThe proposal is a stable `data-part` attribute on the structural elements, with values along the lines of `row`, `icon`, `scroller`, `header` and `body`, on Tree, SectionedTree, Panel and MarkdownViewer.\n\nThis is ranked high despite being an improvement. It is the escape hatch that every other record on this list is currently forced through, and it is an escape hatch that breaks on upgrade.\n\nWorked around in the consuming apps by targeting the generated names, which is the failure this record describes.","notes":[{"date":"2026-09-06","text":"Confirmed: a grep for data-part across src returns nothing. The generated names quoted in the report match the pattern emitted today, for example cs-component-panel-5 in src/styles/components/panel.css."},{"date":"2026-09-06","text":"Partly done in 5d4f99d and 8a781bd. Tree carries data-part on its scroller, rows, labels and icons; SectionedTree on its sections, headers and bodies; Table on its truncatable cell; Tooltip on its bubble. Panel and MarkdownViewer still have none, so this stays open. The convention is settled by the parts above: name the structural element, not its role in one layout."},{"date":"2026-09-06","text":"Panel now carries data-part on its header and body, added in a49c3aa alongside the overflow fix. MarkdownViewer is the last component on the list with none."},{"date":"2026-09-06","text":"Closed across four commits rather than one, because each component gained its hooks alongside the change that needed them. That is also why it took until now to finish: the hooks were a means to an end each time rather than the job."},{"date":"2026-09-06","text":"The MarkdownViewer panes are verified by docs:compile, since the specification's example now renders the outline and the minimap. The two rails are named in prose instead: a pane and its rail never appear together, so no single render can prove both and the gate would fail on whichever was absent."},{"date":"2026-09-06","text":"If you worked around this by targeting generated names such as cs-component-tree-142 or cs-component-panel-20, replace the selector with the data-part one and the override stops breaking on upgrade. That is the whole point of the record: the old selectors will keep changing."}],"links":["CUI-007","CUI-008","CUI-009","CUI-011"]},{"id":"CUI-006","title":"A wrong stylesheet import set renders every component unstyled with no warning","type":"improvement","severity":"med","status":"closed","foundBy":"an agent building a consumer app against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"stylesheet warning pass, 2026-09-06","evidence":{"commits":["3c44857"],"integrated":[],"verified":"Two browser tests, because the check reads a custom property off a computed style and jsdom computes none. With every sheet loaded, rendering a Button logs nothing. With the marker rule deleted from the live stylesheet, which is the state a consumer reaches by importing no component sheets, rendering a Chip logs exactly one warning naming `Chip` and `styles/components/chip.css`. Unhooking the check fails that test with `expected \"Mock\" to be called 1 times, but got 0 times`. `npm run ci` exits 0 with every gate run, 635 tests, visual:compare 104/104 at 0 differing pixels, axe 0, and size:subpaths PASS."},"resolution":null,"details":"A consumer that imports `styles/tokens.css` and `styles/base.css` without the component sheets gets a page where every component renders as unstyled stacked blocks. Nothing errors and nothing warns. One app ran that way unnoticed, with 415 CSS rules loaded where it should have had 1742.\n\n`core.css` is three imports: tokens, base and utilities. It carries no component styles, so loading it alone is not enough either.\n\nThe report proposed folding the component styles into `core.css`. That conflicts with the per-component design INSTALL.md documents, which exists so a consumer pays only for what it renders. The defect worth fixing is the silence, not the packaging. A component that renders with no stylesheet should say so once, in development, rather than rendering as bare markup.\n\nWorked around in the consuming app by adding the missing import once the cause was found.","notes":[{"date":"2026-09-06","text":"Confirmed: src/styles/core.css is @import of tokens.css, base.css and utilities.css only. The 415 and 1742 rule counts come from the report and were not re-measured here."},{"date":"2026-09-06","text":"The owner chose a development-time check across every component rather than a single sentinel. That is the right shape for this package: the stylesheets are per component, so a consumer can hold `tree.css` and be missing `card.css`, and a global check can only see the case where nothing at all is loaded. Each sheet sets a marker custom property on its own root, and the component reads it once. 33 components reach the check through `forwardRefToRoot`; Card, CardGroup, Input and Modal forward their own refs and were wired individually."},{"date":"2026-09-06","text":"Two mistakes were caught by measuring rather than by review. The first guard used `import.meta.env.DEV`, which this package's own build replaces: the published copy carried an empty function and would have warned nobody. Reading the built file showed it. The guard is now the consumer's `process.env.NODE_ENV`, which their bundler replaces. The second was the direction of the fallback: bailing when `process` is undefined turned the check off wherever it was not defined, including the browser tests, and the full suite failed where the file alone had passed. It now bails only when it can see production, so an environment that cannot tell warns rather than stays quiet."}],"links":[]},{"id":"CUI-007","title":"Tree centres its row content, so a wrapping label misaligns the leaf icon","type":"improvement","severity":"med","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d"],"integrated":[],"verified":"npx vitest run src/components/Tree.overflow.test.tsx: 8 passed, including that the root records center by default and start on request. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"Tree rows are laid out with `align-items: center`, and there is no prop to change it. A `renderLabel` that returns two lines, such as a filename above a description, leaves the leaf icon floating at the vertical middle of the row instead of sitting on the first line. The reporter measured the icon centre at 131px against a first-line centre of 123px.\n\nCentring is right for the single-line labels Tree anticipates. It is wrong the moment `renderLabel` wraps, and `renderLabel` is a public prop, so wrapping is a supported input.\n\nThe proposal is `alignLabel` taking `center` or `start`, defaulting to `center`, or aligning to the first line automatically when the label wraps.\n\nWorked around in the consuming app with a CSS override on the generated class name.","notes":[{"date":"2026-09-06","text":"Confirmed: align-items center at src/styles/components/tree.css:136, and TreeProps carries no alignment prop."},{"date":"2026-09-06","text":"Fixed as alignLabel. Pair it with labelOverflow=\"wrap\" for the two-line renderLabel this was reported against. If you worked around it with a CSS override on a generated class name, drop the override."}],"links":["CUI-005","CUI-014"]},{"id":"CUI-008","title":"Tree rows can only scroll horizontally, never truncate or wrap","type":"improvement","severity":"med","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["5d4f99d"],"integrated":[],"verified":"npx vitest run src/components/Tree.overflow.test.tsx: 8 passed. visual:compare shows the truncated label and the untouched focus ring at 76/76. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"A Tree row carries `min-width: 100%` and its scroller `overflow: auto`, so a long label widens the row and produces a horizontal scrollbar. The reporter measured a 599px row inside a 403px scroller.\n\nIn a narrow sidebar holding several trees that is several nested horizontal scrollbars, and there is no prop to opt out of it.\n\nThe proposal is `labelOverflow` taking `scroll`, `truncate` or `wrap`, defaulting to `scroll` so today's behaviour is unchanged. `truncate` would ellipsize and `wrap` would allow multiple lines, which pairs with the alignment record.\n\nWorked around in the consuming app with a CSS override on the generated class name.","notes":[{"date":"2026-09-06","text":"Confirmed: min-width 100% at src/styles/components/tree.css:85 and overflow auto at tree.css:165. TreeProps carries no overflow prop."},{"date":"2026-09-06","text":"Fixed as labelOverflow, defaulting to truncate. The repository owner chose consistency with the other ten components over compatibility, so this changes how an existing app's trees look. scroll restores the old behaviour."},{"date":"2026-09-06","text":"The first attempt regressed the focus ring. Dropping min-width on the row let it shrink to its content, and the ring shrank with it, which visual:compare caught as 543 differing pixels on the tree keyboard-navigation capture. The row now keeps max-width 100% and the label shrinks instead."},{"date":"2026-09-06","text":"If you worked around this in a consumer app, remove the CSS override that released overflow on the generated class names. It now fights the component. Where you want the old sideways scrolling, ask for labelOverflow=\"scroll\" rather than overriding."}],"links":["CUI-005","CUI-007","CUI-014"]},{"id":"CUI-009","title":"Panel collapsed hides its own header, leaving nothing to restore it","type":"improvement","severity":"med","status":"closed","foundBy":"agents building two consumer apps against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-07","stint":"Panel and viewer pane pass, 2026-09-07","evidence":{"commits":["68da88c"],"integrated":[],"verified":"`npx vitest run --project browser src/components/Panel.collapse.test.tsx`: 3 tests pass. Collapsed with the default `collapseTo`, the root measures 0px wide and the toggle's left edge sits at or past the root's right edge, where `overflow: hidden` clips it. With `collapseTo=\"header\"` the root keeps its 240px, the title renders, the toggle has a non-zero width and `aria-expanded=\"false\"`, and clicking it calls `onCollapse` once. An expanded panel measures the same width in both modes. Making every mode fold away fails the second test with `expected 0 to be greater than 0`. `collapseTo` reaches `dist/components/Panel.d.ts`, and `npm run ci` exits 0 at 104/104."},"resolution":null,"details":"Panel's `collapsed` prop sets `width: 0`, `overflow: hidden` and `border-style: none`, all with `!important`. That is the right behaviour for a side panel collapsing to an edge.\n\nIn a vertical stack it hides the title bar and any toggle along with the body, so nothing remains on screen to click to restore it. `PanelProps` exposes `width` and no direction, so a consumer cannot ask for the other axis.\n\nEvery app that wants a vertical disclosure therefore rebuilds one by hand: a chevron button in the `actions` slot, `aria-expanded` and `aria-controls` wiring, and CSS to hide the body. That is accessibility plumbing being reimplemented per app, which is what a kit exists to prevent.\n\nThe proposal is a disclosure variant, either `collapsible` with a `direction` of `horizontal` or `vertical`, or a dedicated component, keeping the header visible and shipping the toggle and the ARIA wiring.\n\nWorked around in the consuming apps by building that disclosure by hand.","notes":[{"date":"2026-09-06","text":"Confirmed: the collapsed class cs-component-panel-5 sets width 0, overflow hidden and border-style none, at src/styles/components/panel.css lines 24, 57 and 79. PanelProps at src/components/Panel.tsx:5-14 has no direction and no height."},{"date":"2026-09-07","text":"The repository owner adopted the stopping rule this branch had proposed and never had confirmed: fix the defects a consumer would hit, record everything else, and decide the rest at 0.3.0. This record is one of the six that wait, because each adds or changes a public prop, and `CONTRIBUTING.md` asks that the design be settled before the code is written.\n\nThey are one conversation rather than six, and this is the order they unlock in: CUI-014 first, because whether navigation is a supported use decides CUI-011; then CUI-012, because the `storageKey` convention decides CUI-010; then CUI-009 and CUI-011 together, which are both about sizing to content; and CUI-013 last, which stands alone. The Tooltip and MarkdownMinimap changes that already landed belong in the same conversation.\n\nNothing here is urgent: every consumer that wanted a vertical disclosure has already built one by hand, so the cost is duplication rather than a broken screen."},{"date":"2026-09-07","text":"Closed with a `collapseTo` prop taking `\"edge\"` or `\"header\"`, defaulting to `\"edge\"`, so no existing panel changes. The owner chose it over a `direction` prop, which names an axis rather than what survives, and over a separate component, which would have duplicated Panel's header, actions slot and ARIA.\n\nThis record was larger than the code turned out to be. Panel already rendered the toggle with `aria-expanded` and an \"Expand {title} panel\" label whenever `onCollapse` was given, so most of the accessibility plumbing the record described was there. What was missing was only the collapse that leaves the header behind.\n\n`aria-controls` was considered and left out. The body is not rendered while collapsed, so it would point at an element that does not exist, and keeping the body mounted in one mode and not the other would be a worse trap than the missing attribute. `aria-expanded` is what the disclosure pattern requires, and `components/Panel.md` says why the other is absent.\n\nNo pattern demo collapses a Panel, so nothing downstream moved. The second Explorer card that CUI-011 mentions is still that record's work."}],"links":["CUI-005","CUI-011"]},{"id":"CUI-010","title":"MarkdownViewer outline and minimap collapse state cannot be observed","type":"improvement","severity":"med","status":"closed","foundBy":"an agent building a documentation browser against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-07","stint":"Panel and viewer pane pass, 2026-09-07","evidence":{"commits":["ea836f3"],"integrated":[],"verified":"`npx vitest run --project jsdom src/components/MarkdownViewer.panes.test.tsx`: 5 tests pass, and four targeted reverts each fail the test that covers them. Ignoring the controlled prop fails the controlled test, dropping the two callbacks fails both callback tests, dropping `writePanes` fails the persistence test, and ignoring `defaultOutlineCollapsed` fails the seed test. Collapsing the minimap under a `storageKey` writes `{\"outline\":false,\"minimap\":true}`, and a remount reads it back collapsed. With `getItem` and `setItem` both throwing `QuotaExceededError` the toggles still work. `dist/components/MarkdownViewer.d.ts` carries the new props, and `npm run ci` exits 0."},"resolution":null,"details":"`outlineCollapsed` and `minimapCollapsed` seed internal state and are never read again. There is no change callback, so a consumer cannot learn that the user collapsed a pane.\n\nThe cost is larger than it sounds. A viewer is typically keyed per document, so it remounts on every document switch and both panes reset. The user's choice is lost on each navigation, not merely on reload.\n\nWith no callback the only route open to the consumer was a capture-phase click listener matching the component's own aria-labels, against the pattern `/^(Collapse|Expand) (outline|minimap)$/`. That reaches into the component's accessible names, which are not an API, and it breaks the moment a label is reworded.\n\nThe proposal is `onOutlineCollapsedChange` and `onMinimapCollapsedChange`, or an internal `storageKey` that persists the state.\n\nWorked around in the consuming app with exactly that aria-label listener.","notes":[{"date":"2026-09-06","text":"Confirmed: src/components/MarkdownViewer.tsx:283-287 seeds useState from the props and never syncs back. No onOutlineCollapsedChange or onMinimapCollapsedChange exists in the file."},{"date":"2026-09-07","text":"The repository owner adopted the stopping rule this branch had proposed and never had confirmed: fix the defects a consumer would hit, record everything else, and decide the rest at 0.3.0. This record is one of the six that wait, because each adds or changes a public prop, and `CONTRIBUTING.md` asks that the design be settled before the code is written.\n\nThey are one conversation rather than six, and this is the order they unlock in: CUI-014 first, because whether navigation is a supported use decides CUI-011; then CUI-012, because the `storageKey` convention decides CUI-010; then CUI-009 and CUI-011 together, which are both about sizing to content; and CUI-013 last, which stands alone. The Tooltip and MarkdownMinimap changes that already landed belong in the same conversation.\n\nUntil it is settled, the consuming app keeps the capture-phase listener matching the component's aria-labels, which breaks on a wording change rather than on a version bump."},{"date":"2026-09-07","text":"CUI-012 is settled, which narrows this. Convention 7.3 now says user-arrangement state belongs behind a `storageKey`, and a collapsed pane is arrangement, so `storageKey` is the convention-consistent answer rather than one of two options.\n\nThat does not close this record. A consumer keying the viewer per document still wants to know when a pane collapsed, and a `storageKey` alone does not tell it. Whether the callbacks ship alongside is the part still to decide."},{"date":"2026-09-07","text":"Closed with both halves the record proposed rather than a choice between them. `onOutlineCollapsedChange` and `onMinimapCollapsedChange` report what the user did, and `storageKey` persists the arrangement for the common case where the consumer only wants it remembered. The capture-phase listener matching the component's aria-labels can go.\n\n**This is a breaking change.** `outlineCollapsed` and `minimapCollapsed` seeded state and now control it, so a consumer passing one as an initial value finds that pane fixed. The migration is to rename it to `defaultOutlineCollapsed`. It is deliberate: the old names claimed a contract the component did not honour, which is why `patterns/MarkdownViewer.md` had been documenting a controlled prop that did nothing.\n\nConvention 7.2 gained a paragraph in the same commit. It had said an uncontrolled variant belongs in a separate export, which is right for a collection like a tree's expansion and absurd for one boolean. It now says so."}],"links":["CUI-012"]},{"id":"CUI-011","title":"No content-height mode on Tree or Panel, so stacked nav sections need internal overrides","type":"feature-idea","severity":"med","status":"closed","foundBy":"agents building navigation sidebars against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-07","stint":"nav sidebar pass, 2026-09-07","evidence":{"commits":["a59ca59","96131e9"],"integrated":[],"verified":"`npx vitest run --project browser src/components/Tree.contentHeight.test.tsx`: 5 tests pass. Two bare trees with `scroll={false}` in a 200px scrolling column each measure 580px tall with nothing scrolling inside them, and the column's `scrollHeight` covers both. Removing the rule fails it at `expected 580 to be 200`. Removing only the `height: auto` half, which is the quiet way to get this wrong, fails at `expected 780 to be greater than or equal to 1160`: 380px of rows outside anything that scrolls. `Panel height=\"auto\"` is covered separately, and removing it fails at `expected 200 to be greater than 200`. `npm run ci` exits 0 at 108/108."},"resolution":null,"details":"A sidebar of several titled nav sections stacked in one scrolling column has no supported route. Each section should be as tall as its own rows, with one scrollbar owned by the sidebar. It is the standard documentation sidebar, and Panel plus Tree is what a consumer reaches for.\n\nBoth components are built to do the opposite. Panel exposes `width` and no height, documented as filling the available flex space. Tree has no height or scroll prop and brings its own `overflow: auto`. Each is designed to fill a container and scroll inside itself.\n\nSo the pattern is only reachable by overriding internals from outside, releasing `height`, `max-height`, `min-height` and `overflow` together down the whole chain. That depends on the internal box structure and breaks silently on a version bump.\n\nGetting the override partly right fails in a way that is very hard to see. Releasing `overflow` without releasing `height` leaves the inner component at its inherited height while its content spills out. An ancestor with `overflow: hidden` clips the overflow, and those rows never count toward the outer scroller's `scrollHeight`. The reporter measured 1344px of scrollHeight for 2562px of nav, with roughly half of a 72 item list unreachable by mouse while still reachable by `scrollIntoView`. It was reported as the last row being slightly clipped.\n\nA partial override producing silent, input-method-dependent content loss is the argument for a first-class mode rather than a documented recipe.\n\nThe proposal is something explicit on both, such as `height=\"auto\"` on Panel and a matching `scroll={false}` on Tree, meaning size to content and let an ancestor own the scrolling. A third report asked for the same thing as `scroll` taking `section` or `container` on SectionedTree.\n\nWorked around in the consuming apps with the override chain described above, plus making the scrolling parent a plain block rather than a flex column, since a flex column shrinks each section to an equal share of its own height.","notes":[{"date":"2026-09-06","text":"Confirmed: overflow auto is unconditional at src/styles/components/tree.css:165, and PanelProps at src/components/Panel.tsx:5-14 exposes width with no height."},{"date":"2026-09-06","text":"Merged from two reports asking for the same capability in different shapes, one on Panel and Tree and one on SectionedTree. The unreachable-content failure the reporter described was caused by their own partial override rather than by kit behaviour, and is recorded here as the argument for the mode, not as a separate defect."},{"date":"2026-09-06","text":"Scope clarified while fixing CUI-018. This is additive rather than a correction: the bounded panel that scrolls its own content works and the Explorer pattern demonstrates it. What is missing is the other layout, where several titled sections each size to their content and one ancestor owns the scrollbar. If that ships, Explorer should probably gain a second card showing it rather than replacing the first, because both layouts are real."},{"date":"2026-09-07","text":"The repository owner adopted the stopping rule this branch had proposed and never had confirmed: fix the defects a consumer would hit, record everything else, and decide the rest at 0.3.0. This record is one of the six that wait, because each adds or changes a public prop, and `CONTRIBUTING.md` asks that the design be settled before the code is written.\n\nThey are one conversation rather than six, and this is the order they unlock in: CUI-014 first, because whether navigation is a supported use decides CUI-011; then CUI-012, because the `storageKey` convention decides CUI-010; then CUI-009 and CUI-011 together, which are both about sizing to content; and CUI-013 last, which stands alone. The Tooltip and MarkdownMinimap changes that already landed belong in the same conversation.\n\nThe override chain in the consuming apps stays until then. It is the one workaround here that fails silently, so it is the strongest argument for taking this early."},{"date":"2026-09-07","text":"Closed once CUI-014 was answered, which is what it was waiting on. Two thirds of the first attempt was cut after measuring it. A `[data-height=\"auto\"]` rule on Panel's body and a `scroll` prop forwarded through SectionedTree both measured identical with and without them: a percentage height against an indefinite parent already resolves to auto, so Panel's inline height is the whole fix and SectionedTree never gave its sections a definite height to begin with.\n\nWhat is left is two props that each earn their place. `Panel height=\"auto\"` covers a sidebar of titled panels, and resolves its child tree's height with it. `Tree scroll={false}` covers bare trees stacked with no panel between them, which is where the default clips: two of them in a 200px column reported 400px of scrollHeight for 1160px of tree."}],"links":["CUI-003","CUI-004","CUI-005","CUI-009"]},{"id":"CUI-012","title":"storageKey persists arrangement on some components and not others","type":"improvement","severity":"low","status":"closed","foundBy":"agents building two consumer apps against 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-07","stint":"chart typography and storageKey pass, 2026-09-07","evidence":{"commits":["a7d1599"],"integrated":[],"verified":"`npx vitest run --project jsdom src/components/storageKey.test.tsx`: 3 tests pass with `getItem` and `setItem` both throwing `QuotaExceededError`. `useTheme` still switches to dark, `ThemeToggle`'s radio variant still sets `data-theme=\"dark\"`, and `SplitPane` still renders both panes. Removing `useTheme`'s write guard fails the first with that error, and removing `SplitPane`'s read guard fails the third. `npm run ci` exits 0."},"resolution":null,"details":"`SplitPane` takes a `storageKey` and persists its width. `useTheme` and `ThemeToggle` take one too. `Panel`, `Tree` and `MarkdownViewer` have no equivalent, so every consumer that wants panel open state, tree expansion or viewer panes to survive a reload writes its own localStorage code, each with its own try and catch for private mode and quota errors.\n\nThe proposal is to adopt `storageKey` as a kit-wide convention for user-arrangement state, with storage failures degrading to in-memory rather than throwing.\n\nThis is filed low because each component can adopt it independently and nothing is broken today. It is worth deciding once so the components that adopt it agree on the name and the failure behaviour.","notes":[{"date":"2026-09-06","text":"Confirmed: storageKey appears on src/lib/useTheme.ts, src/components/ThemeToggle.tsx and src/components/SplitPane.tsx, and on no other component."},{"date":"2026-09-07","text":"The repository owner adopted the stopping rule this branch had proposed and never had confirmed: fix the defects a consumer would hit, record everything else, and decide the rest at 0.3.0. This record is one of the six that wait, because each adds or changes a public prop, and `CONTRIBUTING.md` asks that the design be settled before the code is written.\n\nThey are one conversation rather than six, and this is the order they unlock in: CUI-014 first, because whether navigation is a supported use decides CUI-011; then CUI-012, because the `storageKey` convention decides CUI-010; then CUI-009 and CUI-011 together, which are both about sizing to content; and CUI-013 last, which stands alone. The Tooltip and MarkdownMinimap changes that already landed belong in the same conversation.\n\nThis is the one to answer first of the pair with CUI-010, because the name and the storage-failure behaviour bind every component that adopts them afterwards."},{"date":"2026-09-07","text":"Closed as a decision rather than a migration, which is what this record asked for. Convention 7.3 already named the prop and the two calls. What it left open, and what a component adopting it has to agree on, was which state belongs there and what a storage failure means. Both are now written down.\n\nBoth were already true of the three components that take a `storageKey`, and nothing checked either, which is the class this branch exists to close. A test now drives all three against storage that throws.\n\n`Panel`, `Tree` and `MarkdownViewer` still do not take one. Adopting it in each is separate work, and the convention no longer has to be settled first."}],"links":["CUI-010"]},{"id":"CUI-013","title":"The chart theming bridge resolves colour but not typography, so marks cannot measure text","type":"improvement","severity":"med","status":"closed","foundBy":"an agent hand-drawing charts against the useChartTheme bridge on 0.2.0, relayed by the repository owner","opened":"2026-09-06","resolved":"2026-09-07","stint":"chart typography and storageKey pass, 2026-09-07","evidence":{"commits":["957bdb9"],"integrated":[],"verified":"`npx vitest run src/lib/chartTheme`: 11 tests pass, four of them new. In Chromium `theme.fontFamily` equals the computed `--font-family-mono`, `theme.fontSizeAxis` is 11, and `theme.measureText(\"Cache Write\")` returns 72.61px, within 1px of the width the DOM lays the same string out at. Doubling the font size doubles the advance. Zeroing the three fields fails all three browser tests, the last with `expected NaN to be greater than 1.9`. In jsdom, where the canvas shim has no `measureText`, it returns 0 rather than throwing. `dist/lib/chartTheme.d.ts:29` carries the signature, so it reaches the published build. `npm run ci` exits 0."},"resolution":null,"details":"`patterns/Chart.md` states that the kit ships no chart primitives, only a theming bridge: draw the marks yourself and take every value from `useChartTheme()`. The reason given is that d3 and canvas need concrete values such as `#1ee0ca` rather than `var(--color-accent)`.\n\nThat reasoning applies to type as much as to colour, and the bridge stops at colour. `ChartTheme` carries sixteen colour fields and no typography at all. There is no family, no size, no weight, and no way to ask how wide a string will render.\n\nThe kit already accepts that chart consumers need this. There is a dedicated `--font-size-chart-axis` token, and `styleAxis()` applies it along with `--font-family-mono` to axis text. It passes them as `var(...)` strings, which works for SVG and DOM text and is unusable for the two things a drawing consumer needs. `ctx.font` will not accept a `var()` string, and nothing can be laid out around text whose width is unknown.\n\nMeasurement is the part that bites. Any chart drawing a labelled box, a legend chip or a truncated tick has to know the label width before it draws. With no way to ask, a consumer either reimplements a twenty-line probe or hard-codes a per-character estimate. The estimate is what ships, because it is one line and looks right on the strings it was tested against. It is a design token copied into a magic number, so it rots silently when the type scale moves. The reporter estimated 7.4px per character against a real 8.39px and drew labels wider than the boxes around them.\n\nThe proposal is to extend the existing bridge with a resolved `fontFamily`, a resolved `fontSizeAxis` in pixels, and a `measureText` helper backed by a cached canvas context. Two details matter: invalidate the cached font on a theme flip, the same way colours are re-read, and account for web fonts settling after `document.fonts.ready`.\n\nWorked around in the consuming app with the per-character estimate described above.","notes":[{"date":"2026-09-06","text":"Confirmed: ChartTheme at src/lib/chartTheme.ts:7-24 is sixteen colour fields with no typography, and styleAxis at chartTheme.ts:98-99 passes var(--font-family-mono) and var(--font-size-chart-axis) through as CSS strings."},{"date":"2026-09-06","text":"The report names a companion useChartTheme and useTheme split-brain defect as filed separately. That report was not supplied, so nothing is recorded for it here. Ask the reporter for it before assuming this record covers it."},{"date":"2026-09-07","text":"The repository owner adopted the stopping rule this branch had proposed and never had confirmed: fix the defects a consumer would hit, record everything else, and decide the rest at 0.3.0. This record is one of the six that wait, because each adds or changes a public prop, and `CONTRIBUTING.md` asks that the design be settled before the code is written.\n\nThey are one conversation rather than six, and this is the order they unlock in: CUI-014 first, because whether navigation is a supported use decides CUI-011; then CUI-012, because the `storageKey` convention decides CUI-010; then CUI-009 and CUI-011 together, which are both about sizing to content; and CUI-013 last, which stands alone. The Tooltip and MarkdownMinimap changes that already landed belong in the same conversation.\n\nThe per-character estimate stays in the consuming app until then, at 7.4px against a real 8.39px, which is what draws labels wider than the boxes around them."},{"date":"2026-09-07","text":"Taken early rather than held for 0.3.0, on the owner's call. The three fields are additive: nothing constructs a `ChartTheme`, it is only ever read from `useChartTheme()`, so no consumer breaks.\n\nOne number in this record is worth qualifying. The 7.4px per character estimate was measured against the reporter's own font, not this kit's axis font. At `--font-size-chart-axis`, which is 11px, the mono stack measures 6.601px per character. The estimate was wrong in the other direction here, which is the argument for measuring rather than for a better constant.\n\nThe web-font half of the proposal is implemented but does not fire in this repository, because every font stack it ships is a system one and `document.fonts.status` is already `loaded`. The hook re-reads after `document.fonts.ready` only when it is not."}],"links":[]},{"id":"CUI-014","title":"Decide whether driving Tree and SectionedTree as navigation is supported","type":"feature-idea","severity":"low","status":"closed","foundBy":"session agent, while triaging five consumer reports for the repository owner","opened":"2026-09-06","resolved":"2026-09-07","stint":"nav sidebar pass, 2026-09-07","evidence":{"commits":["96131e9"],"integrated":[],"verified":"`patterns/NavSidebar.md` exists, `npm run catalog` lists it, and `Tree`, `SectionedTree` and `Panel` name it in their `patterns` frontmatter. `npx vitest run --project jsdom src/patterns/patterns.wiring.test.tsx`: 9 tests pass, two of them new, driving the real demo. Turning the file-tree chrome back on fails one at `expected [ …(7) ] to have a length of +0 but got 7`. The visual gate captures the page in both themes, taking it from 104 screenshots to 108. `npm run ci` exits 0."},"resolution":null,"details":"Five of the records filed alongside this one come from driving Tree and SectionedTree as navigation sidebars rather than as file trees: the row alignment, the label overflow, the missing scroll into view, the forced per-section chrome, and the absent content-height mode.\n\nThe components are written for file trees. Nav sidebars want different defaults on nearly every axis, which is why each report arrives as a separate prop request.\n\nThe question is worth answering once, on the record, rather than per prop. If navigation is a supported use, the answer is probably a documented pattern or a variant that sets those defaults together, and the individual props follow from it. If it is not, the records should say so and the answer to a consumer is to compose primitives.\n\nOne of the reports raised this and nobody answered it. Filed so it is not re-litigated five times.","notes":[{"date":"2026-09-07","text":"The repository owner adopted the stopping rule this branch had proposed and never had confirmed: fix the defects a consumer would hit, record everything else, and decide the rest at 0.3.0. This record is one of the six that wait, because each adds or changes a public prop, and `CONTRIBUTING.md` asks that the design be settled before the code is written.\n\nThey are one conversation rather than six, and this is the order they unlock in: CUI-014 first, because whether navigation is a supported use decides CUI-011; then CUI-012, because the `storageKey` convention decides CUI-010; then CUI-009 and CUI-011 together, which are both about sizing to content; and CUI-013 last, which stands alone. The Tooltip and MarkdownMinimap changes that already landed belong in the same conversation.\n\nThis is the first question of the six. Answering it either way stops the same request arriving once per prop."},{"date":"2026-09-07","text":"Answered: navigation is a supported use, documented as a recipe rather than a `variant`. The owner chose the recipe because the five props already exist and already work, and a preset guessed at now would be a bundle nobody had used as a set. If everyone ends up setting the same five, that is the evidence for promoting it later.\n\nThe answer is what unblocked CUI-011, which is the fifth setting and the only one that did not exist. The other four came from CUI-003, CUI-004, CUI-007 and CUI-008, all closed already, and `patterns/NavSidebar.md` now sets them together so the sixth report does not arrive as a sixth prop request."}],"links":["CUI-003","CUI-004","CUI-007","CUI-008","CUI-011"]},{"id":"CUI-015","title":"The two parsers disagree on triple-marker emphasis such as ***both***","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while adding single-marker emphasis for CUI-002","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["037a9d4"],"integrated":[],"verified":"Both parsers now render ***both*** and ___both___ as \u003cem>\u003cstrong>both\u003c/strong>\u003c/em>, compared by rendering each through both entries and diffing the article HTML. npx vitest run src/components/MarkdownViewer.conformance.test.tsx: 18 passed. Reverting only LightweightMarkdown.tsx fails 3 of them, including the corpus comparison, which now contains a triple marker. Full suite 619 passed across 61 files. npm run check exit 0, visual:compare 94/94."},"resolution":null,"details":"`***both***` renders as `\u003cstrong>*both\u003c/strong>*` through the lightweight parser and as `\u003cem>\u003cstrong>both\u003c/strong>\u003c/em>` through the rich one. The lightweight parser matches the leading `**` first, and the `*both` left inside it never closes, so the marker is printed.\n\nThis predates the emphasis work in CUI-002 and is unchanged by it. Both builds were rendered and produce identical output, so the branch added there neither caused nor worsened it.\n\nIt is filed because `MarkdownViewer.conformance.test.tsx` asserts the two parsers produce the same DOM, and that claim is not true for this input. The corpus does not contain a triple marker, so the assertion passes.\n\nSeverity is low because triple markers are rare in the documents this renderer is aimed at. The honest options are to fix the nesting, or to write down that the lightweight subset excludes it and keep the corpus honest about what it covers.","notes":[{"date":"2026-09-06","text":"Measured both ways. With the emphasis branch and with it reverted, the lightweight parser produces \u003cstrong>*both\u003c/strong>* for ***both***, so the divergence is pre-existing."},{"date":"2026-09-06","text":"Fixed by matching a run of exactly three markers before the two-marker branch can take the first pair and strand the third. Scoped deliberately: four or more markers still disagree, and the record for that is CUI-019."}],"links":["CUI-002"]},{"id":"CUI-016","title":"Ship a Tooltip component and move every native title tooltip onto it","type":"improvement","severity":"med","status":"closed","foundBy":"the repository owner, deciding how to fix CUI-008","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["8a781bd","31b2728"],"integrated":[],"verified":"npx vitest run src/components/Tooltip.test.tsx: 13 passed, covering the hover delay, focus opening with no delay, Escape, the hoverable bubble, both describedBy modes, overflowOnly in each direction, disabled, and that the trigger keeps its own handlers and ref. Full suite 606 passed across 60 files, up from 554 across 56 at the start of this work. npm run check exit 0. npm run visual:compare 76/76 screenshots passed, 161 differing pixels against a 0.1% threshold, axe violations 0 in both themes and no rule matching more nodes than the baseline."},"resolution":null,"details":"The kit has no tooltip component and uses the browser's native `title` attribute instead. `Table` attaches one on hover, and only when the text is actually cut off, by comparing `scrollWidth` against `clientWidth`. `patterns/DataTable.md` documents that as the expected behaviour, so it is a decision rather than an oversight.\n\nA native `title` never appears on keyboard focus. Tab to a truncated row and there is no way to read the full text, so the affordance exists for mouse users alone. It also cannot be styled, cannot be dismissed, and disappears if the pointer moves onto it.\n\nOne nuance decides the design. When text is truncated with an ellipsis the full string is still in the DOM, so a screen reader already reads it. A tooltip repeating it must therefore be hidden from assistive technology or the name is announced twice. A tooltip carrying new information must be announced. The component needs both modes and the caller picks.\n\nAgreed shape: shows on hover after a delay and on keyboard focus immediately, dismissible with Escape, stays open when the pointer moves onto it, and no collision detection in this pass. That is the WCAG 1.4.13 bar for content on hover or focus.\n\nEvery existing `title` used as a tooltip moves onto it in the same pass, so the kit ends with one mechanism rather than two.","notes":[{"date":"2026-09-06","text":"Filed before building, at the repository owner's direction, after they chose the accessible scope and a full retrofit over a staged one. Driven by CUI-008, which needs somewhere to put the full text once a Tree label is cut."},{"date":"2026-09-06","text":"Shipped in two commits: the component, then the migration of every native title onto it. Table and EventLanes keep their truncation measurement through overflowOnly. Where an accessible name already carried the text the bubble is visual only; Card's tooltip says more than its name does, so it stays announced."},{"date":"2026-09-06","text":"Two things deliberately not done. There is no collision detection, so a bubble near a viewport edge can clip, and the preview's new Tooltip section is not in the visual baseline, whose capture list is fixed at 35 components."}],"links":["CUI-008","CUI-005"]},{"id":"CUI-017","title":"The visual gate captures components but not patterns, so a pattern can break unseen","type":"defect","severity":"med","status":"closed","foundBy":"user report (repository owner): \"a couple of things broke on the Explorer pattern\", after the Tree work in CUI-008","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["08190f8"],"integrated":[],"verified":"npm run visual:capture: 35 components, 9 patterns and 3 interaction states per theme, taking the gate from 76 screenshots to 94. Two consecutive compares both reported 94/94 with 0 differing pixels, so the pattern captures are deterministic. Reapplying the Tree flex regression fails the run by name: FAIL light/pattern-explorer.png at 1034 pixels and FAIL dark at 1050. npm run check exit 0, axe violations 0 in both themes."},"resolution":null,"details":"`visual:capture` records 35 components and 3 interaction states per theme. It records no patterns. A pattern composes several components, which is exactly where a change that is right for one component in isolation goes wrong, and nothing looks at them.\n\nThis is not theoretical. A `flex: 1 1 auto` added to Tree's label for CUI-008 made the label fill its row. In a flipped tree, which lays its row out with `row-reverse`, that pinned every label to the far edge instead of beside its icon. The label measured 231px wide at an 8px gap from the row's left edge, where it should have been 20px wide at a 219px gap. `visual:compare` passed 76 of 76 screenshots throughout, because the Explorer pattern is not among them. The repository owner found it by opening the page.\n\nThe capture list is also fixed rather than derived: it stayed at 35 components while the catalog went to 37, so the Tooltip added in CUI-016 is not captured either. A new component joins the gate only if somebody remembers to add it.\n\nTwo things worth separating. Adding the nine pattern tabs to the baseline closes most of the hole. Deriving the list from the catalog stops it reopening.","notes":[{"date":"2026-09-06","text":"Found by sweeping all nine pattern tabs in both themes against a build of main, which is what the gate should have been doing. After fixing the flex, every pattern matched except two that differ for good reasons: the markdown viewer demo prints bundle sizes, which grew from 166,136 to 167,230 bytes, and the agent activity demo captures a streaming cursor mid-animation."},{"date":"2026-09-06","text":"The discipline half is written down: CONTRIBUTING.md now lists patterns as a fifth file that moves with a component, and says plainly that nothing enforces it. This record is the enforcement half."},{"date":"2026-09-06","text":"Closed in two halves. The nine pattern pages are captured with their trees expanded, because a pattern at rest shows collapsed rows and hides the composition. Reduced motion is emulated so the agent activity page stops landing mid-animation, which StreamingText already honours."},{"date":"2026-09-06","text":"The first version of this did not work. It captured the patterns and still passed the regression: 2084 differing pixels spread across a whole-page shot stayed under the 0.1% per-image ratio. A ratio dilutes a real layout shift in a large capture, so an absolute floor of 250 pixels now sits alongside it. That is safe because runs in the pinned image are deterministic to the pixel."},{"date":"2026-09-06","text":"Recapturing removed the preview-only palette lab overlay from 28 existing captures, which had been baked into the baseline. The capture now seeds it closed. Accessibility is unchanged: violations 0 to 0 and incomplete 1 to 1, with passes 53 to 52 because a collapsed overlay leaves one rule no nodes to check."},{"date":"2026-09-06","text":"The list is still explicit rather than derived, because several catalogued components cannot be captured at rest: Tooltip renders only while open, and Chip, Legend, RadioGroup and SegmentedControl have no section of their own. A check now fails when the catalog names a component this file neither captures nor excuses, which is what stops it falling behind again."}],"links":["CUI-008","CUI-016"]},{"id":"CUI-018","title":"Panel clips content taller than itself, with no scrollbar and no way to reach it by mouse","type":"defect","severity":"high","status":"closed","foundBy":"user report (repository owner): \"the Explorer - Sectioned Tree entries are not scrolling for me\"","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["a49c3aa"],"integrated":[],"verified":"npx vitest run src/components/Panel.scroll.test.tsx: 4 passed, in browser mode because jsdom computes no layout and would pass against a panel that clips everything. Reverting only panel.css fails 2 of the 4. Driven in the real Explorer pattern with Playwright: a mouse wheel over the panel moves scrollTop from 0 to 700 to 1701, which is the full previously hidden extent, against 0 before the fix. Full suite 613 passed across 61 files. npm run check exit 0. visual:compare 76/76 with axe violations 0, so no panel in the captured set gained a scrollbar."},"resolution":null,"details":"Panel's body carries `overflow: hidden`. Content taller than the Panel is therefore clipped with no scrollbar, and Panel exposes `width` and nothing for height or scrolling, so a consumer cannot ask for anything else without overriding internals.\n\nMeasured in the Explorer pattern with Playwright. The Panel body is 408px tall around 2109px of content, so 1701px of a 65 row tree is off screen. A real wheel gesture over the tree moves nothing: no box inside the card changes `scrollTop`, and the window does not move either.\n\nThe content is not gone, which is what makes this hard to see. A box with `overflow: hidden` still scrolls programmatically, so `scrollIntoView` on the last row takes the body's `scrollTop` from 0 to 1685 and brings it into view. Keyboard navigation and any link-driven selection therefore work, and only the mouse fails. That is the input-method-dependent content loss one of the original consumer reports described, except here it is the kit's own component doing the clipping rather than a consumer's override.\n\nTwo faults, and they are separable. Panel losing content silently is the component fault and the one to fix: either the body scrolls when it overflows, or Panel gains a prop that says what to do, but clipping without a scrollbar should not be the default. The Explorer pattern composing an unbounded SectionedTree inside a fixed height Panel is the second, and patterns are the worked examples people copy, so it currently teaches the broken composition.\n\nDeciding this properly means deciding CUI-011 with it. A content-height mode on Tree and Panel is the other half of the same question.","notes":[{"date":"2026-09-06","text":"Pre-existing, not introduced by the Tree work. The whole ancestor chain from the deepest row to the body was captured on this branch and on a build of main, and the two are identical: the Panel body reports client 408 and scroll 2109 with overflow hidden in both, and the wheel moves nothing in both."},{"date":"2026-09-06","text":"Not fixed here. Making Panel's body scroll changes the layout of every Panel in every consumer, so it is the repository owner's call rather than a fix to slip into a Tree change."},{"date":"2026-09-06","text":"Fixed by making the body `overflow: auto`. That is not a new decision: components/Panel.md has always specified `flex: 1`, `overflow-y: auto`, `min-height: 0` for the content area, and the stylesheet said `hidden`. The spec was right and the CSS was wrong, so this restores the documented behaviour rather than changing it."},{"date":"2026-09-06","text":"The gates could not have caught this. check-integrity compares documented DOM hooks against the source, not documented CSS properties against the stylesheet, so a spec and a stylesheet disagreeing about overflow goes unnoticed. Worth a record of its own if the same shape turns up again."},{"date":"2026-09-06","text":"The pattern half is not fixed. ExplorerDemo still composes an unbounded SectionedTree inside a fixed height Panel; it now scrolls rather than losing content, but whether that is the composition the pattern should teach belongs with CUI-011."},{"date":"2026-09-06","text":"Correcting the note above that called the pattern a second fault. Measured after the fix: the sectioned explorer has two vertical scrollers, the demo card's own frame and the panel body, and none nested inside the panel. Each section's tree fits its content at 580 of 580, so the nested scrollbars the original reports complained about are not present. The composition is a bounded panel whose content scrolls inside it, which is the ordinary explorer sidebar and needs no change. The pattern was only wrong while the component clipped."}],"links":["CUI-011","CUI-009","CUI-017"]},{"id":"CUI-019","title":"The two parsers still disagree on four or more emphasis markers","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while fixing the three-marker case in CUI-015","opened":"2026-09-06","resolved":"2026-09-07","stint":"markdown conformance pass, 2026-09-07","evidence":{"commits":["50e9161"],"integrated":[],"verified":"`npx vitest run --project jsdom src/components/MarkdownViewer.conformance.test.tsx`: 21 tests pass, three of them new. They hold `****four****` to `*\u003cstrong>*four\u003c/strong>**` through the lightweight parser and `\u003cstrong>\u003cstrong>four\u003c/strong>\u003c/strong>` through the rich one, and hold the two to the same DOM at three markers. Disabling the three-marker branch in `LightweightMarkdown.tsx` fails that last one with `expected '\u003cstrong>*three\u003c/strong>*' to be '\u003cem>\u003cstrong>three\u003c/strong>\u003c/em>'`, so the pin bites. `npm run check` exits 0."},"resolution":null,"details":"`****four****` renders as `*\u003cstrong>*four\u003c/strong>**` through the lightweight parser and as `\u003cstrong>\u003cstrong>four\u003c/strong>\u003c/strong>` through the rich one.\n\nCUI-015 fixed the three-marker case and stopped there on purpose. Runs of four or more are where CommonMark's delimiter matching stops being a scan and becomes a stack of openers and closers with rules about their lengths. Implementing a guess would trade a known disagreement for a less obvious one.\n\nFiled because MarkdownViewer.conformance.test.tsx asserts the two parsers produce the same DOM, and for this input that is still untrue. The corpus does not contain such a run, so the assertion passes. Either implement the run matching properly, or write down that the lightweight subset stops at three and say so where the conformance claim is made.","notes":[{"date":"2026-09-06","text":"Measured while verifying CUI-015: three markers match in both parsers, four do not."},{"date":"2026-09-07","text":"Closed by the second of the two options this record named, writing the limit down rather than implementing CommonMark's run matching. The owner confirmed that an emphasis fix belongs in the 0.3.0 conversation, and a guess at the pairing would trade a known disagreement for an obscure one.\n\nOne thing the record did not say turned out to matter more than the run itself. The stray markers re-pair with the rest of the line, so `****four**** and ***three***` renders the three-marker run wrongly too. A reader meeting that would look at the wrong run, so the specification says it."}],"links":["CUI-015","CUI-002"]},{"id":"CUI-020","title":"The Form pattern can never show the error states its specification documents","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked to recommend how the patterns should be tested","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["9fb3e1a"],"integrated":[],"verified":"Driven in the built pattern page with Playwright: clicking Create account on an empty form now renders 5 elements with role alert reading Required., Required., Enter a valid email. and Pick a plan., against 0 before the fix. npm run check exit 0."},"resolution":null,"details":"`FormDemo` marks its fields `required` through FormGroup and submits to its own `handleSubmit`, which calls a `validate()` and sets an `error` on each group. The form carries no `noValidate`.\n\nFormGroup forwards `required` to the child input, which is documented and right on its own. The browser then refuses to fire submit on an invalid form, so `handleSubmit` never runs, `validate()` never runs, no `error` is ever set, and the `role=\"alert\"` branch is unreachable. The user sees the browser's own bubble instead of the design system's error treatment.\n\n`patterns/Form.md` documents error states the pattern cannot reach, and the screenshot gate photographs the never-erroring form as correct.\n\nThe fix is a judgement call worth making deliberately rather than quickly. Adding `noValidate` to the demo's form is the smallest change and is what a consumer doing its own validation has to do. Dropping `required` would lose the accessible marking. Either way the lesson belongs in `patterns/Form.md`, because a consumer copying this pattern inherits the same silent failure: native constraint validation and custom validation do not compose without `noValidate`.","notes":[{"date":"2026-09-06","text":"Reported by a reviewer with no context on this repository's recent work, then reproduced here independently rather than taken on trust. A form with one required FormGroup and a submit handler records 0 handler calls and 0 elements with role alert after the submit button is clicked. Confirmed at source: FormGroup.tsx:72-74 forwards required, and FormDemo.tsx:46 has no noValidate."},{"date":"2026-09-06","text":"This is the class of defect the visual gate cannot see, and it is the second one found this way. A form that never errors looks identical to a form that has not been submitted."},{"date":"2026-09-06","text":"Fixed by adding noValidate to the demo's form and writing the rule into patterns/Form.md, which already specified on-submit validation as the final gate without saying that native validation prevents it. `required` stays: it marks the field for assistive technology and that was never the problem."},{"date":"2026-09-06","text":"Making the errors reachable immediately exposed a second defect that had been unobservable while no error ever rendered. See CUI-029."}],"links":["CUI-017"]},{"id":"CUI-021","title":"The Chart pattern's d3 example never translates its axes, so the reference chart is wrong","type":"defect","severity":"high","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["11fa636"],"integrated":[],"verified":"Measured in the built page with Playwright: the x-axis group now carries transform translate(0,212) and computes to a matrix with e 0 and f 212, against e 0 and f 0 before. The rendered chart shows the category labels along the bottom and a readable 0 to 500 y-axis scale, where before the labels printed across the top and the scale was a bare line. npm run check exit 0, visual:compare 94/94 after re-recording, axe violations 0."},"resolution":null,"details":"`ChartDemo.tsx` calls `.attr(\"cs-preview-pages-patterns-chart-demo-14\", `translate(...)`)` on both axis groups. The attribute name was replaced by a generated class name, presumably by a rewrite that walked class strings and caught this one because its value looked like a class. The axes are therefore never translated: the x-axis labels print across the top of the plot and the y-axis ticks fall outside the SVG.\n\n`patterns/Chart.md` names this file as the worked example of imperative charting with `styleAxis` and `ChartTooltip`. It is what a consumer copies to learn the charting bridge.\n\nNothing catches it. d3's `.attr()` takes any name, so typecheck and lint both pass, and the rule the stray name points at is dead Tailwind residue in `preview/src/preview.css` referencing `--tw-*` variables this repository never defines.\n\nFix: restore `.attr(\"transform\", ...)` on both, and delete the orphan rule.","notes":[{"date":"2026-09-06","text":"Confirmed by reading the source. The reviewer additionally probed the built page and found the group carrying the stray attribute with an identity transform matrix and a bounding box at the top of the plot."},{"date":"2026-09-06","text":"The pattern gate closed in CUI-017 caught this, which is the first thing it has caught that was not planted. It reported 1021 and 1066 differing pixels on the two chart captures. Both are under the 0.1% per-image ratio, so the absolute floor added in that record is what made the difference: without it this fix would have landed silently, exactly as the original breakage did."},{"date":"2026-09-06","text":"The dead rule the stray attribute name pointed at was removed with it. It set a transform built from six --tw-* custom properties, none of which this repository defines."}],"links":["CUI-017"]},{"id":"CUI-022","title":"Pattern example code is written in a retired class syntax and names classes that do not exist","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-06","stint":"sandbox-verify, 2026-09-06","evidence":{"commits":["87dec12","7108192","5b10863"],"integrated":[],"verified":"Before the rewrite the ten pattern documents carried 85 class references that resolved to nothing, and afterwards none. `text-label-upper` was the only name that ever resolved, to `src/styles/utilities.css`. The new integrity check counts every occurrence across both documentation directories: run against the tree at 7108192^ it reports 97 failures and exits 1, each naming a class and a line, and against the current tree it reports 0 and exits 0. `npm run check` exits 0, and `cs-lint prose` reports 0 errors on the rewritten documents."},"resolution":null,"details":"All ten `patterns/*.md` write their examples in Tailwind utility and arbitrary-value syntax. Tailwind is not a dependency, and DESIGN_SYSTEM_SPEC section 7.10 says the convention is retired and components use plain CSS with no arbitrary-value syntax.\n\nThe examples also name classes defined nowhere in the repository. The reviewer checked twelve, including `dashboard-stat`, `dashboard-chart-layout` and `data-table-heading`, and found none of them in `src/styles/` or `preview/src/`.\n\nThe code block is the part people paste, and pasted as-is it renders unstyled markup with no way to tell which half of the class list was ever real.\n\nThe reason it rotted silently is worth fixing with it. Every `components/*.md` carries a marked `docs-compile` example that is type-checked and rendered by the gate. No `patterns/*.md` does, and `scripts/docs-compile.mjs` reads the components directory alone.","notes":[{"date":"2026-09-06","text":"Extending docs:compile to the patterns is the half that stops this recurring. Rewriting ten examples without it buys one clean day."},{"date":"2026-09-06","text":"Half done in 87dec12, and the half that stops it recurring. docs:compile now reads the patterns directory as well, so each pattern carries one marked example that is type checked and rendered. Patterns have no Traceability section, so there is nothing to assert about the DOM and the contract is that the example compiles and renders without throwing. That alone caught six wrong prop names in examples written from memory: a trace status that does not exist, ChartFrame imported from the wrong entry, a required onSearch, a StatusBadge label passed as children, and Table's selection prop named wrongly."},{"date":"2026-09-06","text":"Left open for the other half. The gate covers the one marked example per pattern, not the illustrative code blocks around it, so the retired utility syntax and the twelve class names that exist nowhere are still in those. Rewriting them is a documen
