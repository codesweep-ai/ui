:"session agent, while measuring the fresh-page restructure for CUI-055","opened":"2026-09-08","resolved":"2026-09-08","stint":"visual gate flake, 2026-09-08","evidence":{"commits":["ee23996"],"integrated":[],"verified":"`npm run ci` exits 0 at ee23996, reporting 112 of 112 compared screenshots passed, 0 differing pixels and 0 axe rules matching more nodes than the baseline. Eight `npm run visual:compare` runs under full CPU saturation failed none, against 2 of 4 runs failing before the change. Three unloaded runs also failed none. The owner reviewed the 18 moved captures in both themes and confirmed the hovered button on the old baseline."},"resolution":null,"details":"`preparePage` clicks Open Modal and leaves the pointer on that button. The component loop then runs with the pointer parked there. Every element that scrolls under that point is photographed in its hover state.\n\nCUI-062 found this and fixed it. The line it added, `page.mouse.move(0, 0)`, sits in `captureTheme` after the component loop rather than before it. It protects the tree navigation capture and the ones after it, and leaves the component captures exposed.\n\nMoving that one line to the end of `preparePage` changes 17 of the 112 captures. `dark/button.png` moves by 2368 pixels, which is 91 percent of that image, because the committed baseline holds a hovered button rather than a resting one. `dark/table.png` moves by 43289 pixels. `dark/tree.png` moves by 7397, which is the `--color-row-hover` wash the comment above the existing line already describes at 7541 pixels.\n\nThe captures affected are button, card-group, checkbox-group, dropdown, panel, search-input, table and tree in both themes, plus chart-frame in dark. A run that instead moves the component loop to a freshly loaded page produces identical pixel counts. The parked pointer therefore accounts for the whole set.\n\nThis matters because the gate is meant to watch resting states. A reader opening `button.png` sees a hover. A change to the resting style of any of these components would not fail the run.","notes":[{"date":"2026-09-08","text":"The fix stabilises the affected captures under load, which is what the flake in CUI-055 needed.\n\nWith the one line moved, eight `npm run visual:compare` runs under full CPU load produced byte identical captures for `dark/card-group.png`, `dark/search-input.png`, `dark/button.png` and `dark/tree.png`. That is 32 observations with no variation.\n\nWithout the line moved, the same load made `dark/search-input.png` bistable across twelve probe repetitions. It also failed the gate on 2 of 4 runs.\n\nThe `search-input` capture this fix produces is byte identical to the one a freshly loaded page produces. Parking the pointer reaches the same rendering as the fresh page restructure, for one line rather than a restructure.\n\nThe fix is not applied. It moves 17 captures, so it needs a reviewed baseline re-record."},{"date":"2026-09-08","text":"One measurement in this work is unreconciled, and it is recorded rather than explained.\n\nThree comparison runs with the fix applied put `dark/chart-frame.png` at 10 pixels from the old baseline. The re-record, running the same code, put it at 1053. The counting method was cross checked against `button` and `card-group`, which agreed within a few percent, so the gap is not a counting artefact.\n\nThe changed pixels there are thin and spread across a 646 by 139 region, at roughly 20 per row. That is unlike `button`, which changed across its whole surface, and unlike `tree`, whose change is a solid band of 263 pixels on five rows. Those two are hover states. The chart-frame residual looks instead like the antialiasing class CUI-055 describes.\n\nIt has been byte identical across all 11 verification runs, 8 of them under load. The committed baseline is therefore on a rendering that reproduces."}],"links":["CUI-055","CUI-062"]},{"id":"CUI-076","title":"A dispatch of the pages workflow on a branch would publish it to the live site","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while adding the site build gate for CUI-074","opened":"2026-09-08","resolved":"2026-09-08","stint":"pages build, 2026-09-08","evidence":{"commits":["1244860"],"integrated":[],"verified":"`.github/workflows/pages.yml` gives the deploy job `if: github.ref == 'refs/heads/main'`, so a `workflow_dispatch` from a branch builds the site and stops before publishing it. `actionlint` exits 0 on the workflow at 1244860. The build job it depends on carries no such condition, so a branch dispatch still reports whether the site builds."},"resolution":null,"details":"`pages.yml` can be started by hand with `workflow_dispatch`, which is the only way to see the site build on a branch. Its `deploy` job carries no condition on the ref. A dispatch from a branch therefore builds that branch and publishes it to the live documentation URL.\n\nNothing in the workflow says so. The warning has been carried in the handoff notes for this repository instead, as a rule to remember. That is the wrong place for it, because a rule a person has to remember is a rule the next person does not know.\n\nThe build job is safe anywhere and worth running on a branch. Only the deploy is not, and a condition on the ref is what separates them.\n\nThis was found while adding the site build gate that CUI-074 asked for, which makes dispatching `pages.yml` on a branch unnecessary. The guard still belongs there, because the dispatch button remains and the next person will not know what it does.","notes":[{"date":"2026-09-08","text":"The guard is in place, and the gate that made the branch dispatch tempting is in the same commit."}],"links":["CUI-074"]},{"id":"CUI-077","title":"The mermaid boundary test fails about half its runs on the forge and none locally","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while dispatching ci on a branch before merging it","opened":"2026-09-09","resolved":"2026-09-09","stint":"mermaid flake, 2026-09-09","evidence":{"commits":["afff93a"],"integrated":[],"verified":"Five `ci` dispatches on `current-ui-work` at afff93a all reported `completed success`. The two `check` legs carry this test, so that is 10 of 10 legs green, and none of them needed a re-run. Before the change the test failed 3 of 6 observed legs, including both legs of one push to `main`. If that rate had held, five clean runs would occur about 3 percent of the time. Removing the diagram from the test still fails it, 13 seconds in, so the larger budget does not mask a real failure. `npm run ci` exits 0 at afff93a."},"resolution":null,"details":"`src/components/MarkdownViewer.mermaid.test.tsx` fails intermittently on the forge and has never been seen failing locally. The test is `renders a diagram without interpreting markdown-authored HTML labels`. It fails with `AssertionError: expected null not to be null`, and the DOM it prints carries `data-mermaid-rendered=\"false\"`. The diagram has not finished rendering when the assertion runs.\n\nSix observations on 2026-09-09, all on the same unchanged tree at f9a9f65. Run 34297095690, a dispatch on the branch, failed the node 22.13 leg and passed node 24. Run 34299539699, the push to `main`, failed both legs. Re-running the failed jobs in each turned every leg green. That is three failures and three passes of one test on identical code.\n\nIt is not a node version quirk, because it failed on both legs at once. It is not this branch, because the five commits it landed with touch nothing under `src/` and no test or config file. `npm run check` and `npm run ci` ran green many times locally across 2026-09-08.\n\nTwo things make this worse than a slow test. The `npm` workflow runs its own `npm run check` and does not wait for `ci`, so on that push the same commit failed the test in one workflow and passed it in the other, and the publishing one won. A version reached the dev channel while `ci` was red.\n\nThe second is that re-running rewrites the record. `gh run list` now reports both of those runs as `success`, because a re-run replaces the conclusion. The failures are visible only in this record and in job logs that age out.","notes":[{"date":"2026-09-09","text":"The failure was never reproduced locally. The fix rests on a margin measurement rather than on watching the test fail.\n\nTwenty attempts across one, two and four core sandboxes all passed, with a cold Vite cache, the full suite running and every core busy. Fewer cores ran the test faster rather than slower, because vitest parallelises less and nothing then competes with the import. Core count is not the lever, and what the forge does differently is unmeasured.\n\nWhat is measured is the margin. The wait covers a dynamic import of the Mermaid library and a render, and it took 580 to 647 milliseconds of testing-library's 1000 millisecond default in the slowest local configuration. No other test loads the real library, which is why no other test shows this.\n\nThe clean dispatches settle one open question. A larger budget helps a slow render and does nothing for a hung one, so the failure was slowness."}],"links":["CUI-055"]}],"drafts":[],"queue":{"recommendedBy":"session agent, with nothing open","updated":"2026-09-09","items":[]},"description":"@codesweep-ai/ui is a library of React components and design tokens for agent and LLM interfaces. This ledger tracks its defects, improvements and ideas.","links":[],"commitUrlTemplate":null,"rendererVersion":"0.7.0","uiVersion":"0.3.1-dev.20260909170256.1638d27","lastActivity":"2026-09-09","derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"CUI-001":"2026-09-06","CUI-002":"2026-09-06","CUI-003":"2026-09-06","CUI-004":"2026-09-06","CUI-005":"2026-09-06","CUI-006":"2026-09-06","CUI-007":"2026-09-06","CUI-008":"2026-09-06","CUI-009":"2026-09-07","CUI-010":"2026-09-07","CUI-011":"2026-09-07","CUI-012":"2026-09-07","CUI-013":"2026-09-07","CUI-014":"2026-09-07","C
