tation job with no gate behind it yet, and the marked example is now the one a reader can trust."},{"date":"2026-09-06","text":"Starting the other half. Measured across the ten pattern documents: 85 class references in JSX blocks that resolve to nothing, in eight files. Chart.md and ComponentStates.md use no classes and are already clean. The 85 split three ways: retired utility names such as `flex` and `mt-1`, arbitrary-value syntax such as `[color:var(--fg)]`, and invented semantic names such as `dashboard-stat`. Only `text-label-upper` resolves, to `src/styles/utilities.css`."},{"date":"2026-09-06","text":"Closed by the rewrite and the gate together. Each document now defines the classes its own examples use, in plain CSS with values from the tokens. The check resolves a name against the css blocks in the same document and against the stylesheets under `src/styles/`. It reads quoted class attributes only, so a class assembled in a `className={...}` expression is still unchecked. No example in either directory writes one today."}],"links":["CUI-017"]},{"id":"CUI-023","title":"The Dashboard pattern teaches a charting bridge the kit replaced, and does not describe its own demo","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-07","stint":"pattern scope pass, 2026-09-07","evidence":{"commits":["fd8e400"],"integrated":[],"verified":"`grep -rn useChartTokens` over the markdown, TypeScript and TSX in the tree returns nothing outside this ledger, so the hook the document invented is gone rather than moved. `patterns/Dashboard.md` is 367 lines, down from 547. Its Composition block now lists the five cards the demo builds, each naming `ChartFrame`, `ChartTooltip` and `Legend`. `npm run ci` exits 0 with every gate run."},"resolution":null,"details":"`patterns/Dashboard.md` devotes roughly 200 lines to a hand-rolled `useChartTokens()` hook that reads computed CSS variables, plus Recharts-specific tooltip and legend recipes. `useChartTokens` exists nowhere but that document. The shipped answer is `useChartTheme()`, which `patterns/Chart.md` makes its first rule, and Dashboard.md never mentions `useChartTheme`, `ChartFrame` or `ChartTooltip` in its prose even though its own frontmatter lists the latter two as related.\n\nThe hook it teaches is also wrong in the way Chart.md warns about: it re-reads on render without subscribing to the theme flip, so a chart drawn with it does not follow a light and dark toggle.\n\nSeparately, its Composition section describes Card plus Recharts line, bar and pie charts. The demo uses no Recharts at all: it hand-draws SVG with `useChartTheme` and `ChartTooltip`. The `ResponsiveContainer` sizing guidance describes something the demo does not do.\n\nA reader following this document builds a second, divergent theming bridge and never meets ChartFrame's loading, error and empty states.","notes":[{"date":"2026-09-07","text":"Closed by cutting the Recharts section rather than correcting it. `patterns/Chart.md` is the authority on the bridge, and a second account of it in this document is the thing that went stale. What is left is what the Dashboard adds: the four rules its demo follows, what the demo draws, and the three chart shapes.\n\nThe `ResponsiveContainer` sizing guidance went with it. It described a library the demo does not use, and the sizing question is now answered by the `viewBox` the charts actually carry."}],"links":["CUI-013","CUI-024"]},{"id":"CUI-024","title":"The Dashboard demo hand-rolls a Legend, skips ChartFrame, and fixes its charts at 460px","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-07","stint":"pattern scope pass, 2026-09-07","evidence":{"commits":["9962ca0"],"integrated":[],"verified":"`npx vitest run src/patterns/`: 9 tests pass, four of them new. Reverting `DashboardDemo.tsx` fails all four, and the geometry one fails with `expected 477 to be less than or equal to 431`, which is 46px of the widest chart outside its card at a 430px viewport. With the fix the demo renders three `[data-component=\"Legend\"]` roots carrying 12 `data-legend-swatch` and 12 `data-legend-label` hooks, and clearing the filter reaches `chartframe-empty` with the message the bespoke div used to hold. The four dashboard captures were re-recorded and read in both themes, and `npm run ci` exits 0 at 104/104 with 0 differing pixels."},"resolution":null,"details":"Three separate departures in one file.\n\nIt defines a local `Legend` component and uses it three times. The kit exports one, with a `shape` option, `role=\"group\"` and documented `data-legend-swatch` and `data-legend-label` hooks. The local copy has none of that, and it passes resolved colours through `style={{ backgroundColor }}`, which is the one thing `components/Legend.md` forbids: swatch colours are custom-property names, never resolved values.\n\nIts three charts sit in bare Cards. `patterns/Chart.md` says to wrap every chart in `ChartFrame`, so their empty branch is a bespoke div instead of the canonical empty block.\n\nEach chart is a fixed 460 by H pixel SVG with no `viewBox`, so it neither grows nor shrinks. The reviewer measured 31px of chart cut off at a 430px viewport, unreachable because the page does not scroll horizontally, and 460px of chart in an 868px card at a wide one. Dashboard.md tells readers to do the opposite.","notes":[{"date":"2026-09-06","text":"The fixed pixel space is worth keeping for the ChartTooltip coordinate maths, which is what the comment in the demo is actually protecting. A viewBox with a percentage width gets both."},{"date":"2026-09-07","text":"Closed with the note's suggestion, a `viewBox` at a percentage width, and the part the note did not cover. `ChartTooltip` takes container pixels rather than viewBox units, so a chart that scales moves its tooltip off the mark. A `ResizeObserver` gives the rendered width and the tooltip position is scaled by the same factor.\n\nOne thing was worth doing differently. Wrapping the drawn charts in `ChartFrame` first produced a bordered box hugging each chart, because the frame is a flex item in a centring parent. Letting it take the card's width is what makes it read as a panel rather than a stray box."}],"links":["CUI-023"]},{"id":"CUI-025","title":"No pattern was updated for the props added to fix the consumer reports","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["c1a44b5"],"integrated":[],"verified":"The Explorer demo now renders one filter box where it rendered two, measured in the built page: one input with the filter placeholder inside the sectioned explorer, against two before. patterns/Explorer.md documents the per-section choice, the overflow modes, the selection scroll and the data-part hooks; patterns/MasterDetail.md documents the hooks it composes. npm run check exit 0, pattern suites 5 passed, visual:compare 94/94."},"resolution":null,"details":"The kit gained `labelOverflow`, `alignLabel`, `scrollSelectedIntoView`, `filterable`, `expandAllControl` and a set of `data-part` hooks, each in response to a closed record here. A grep across `patterns/*.md` for any of those names returns nothing, and nothing under `preview/src/pages/patterns/` has been touched since the repository's first commit.\n\nCONTRIBUTING now lists patterns as the fifth file that moves with a component, and says the visual gate cannot tell whether a pattern still teaches the right composition after a component gains a prop. This is that failure, several times over.\n\nThe sharpest instance: CUI-004 was filed by someone whose six-section sidebar grew six filter boxes. `patterns/Explorer.md` still presents independent per-section filters as the multi-section shape and never mentions turning them off.","notes":[{"date":"2026-09-06","text":"Filed against the patterns rather than reopening the component records, which are closed correctly. The components do what they should; the worked examples have not caught up."},{"date":"2026-09-06","text":"The first attempt turned the expand-all control off as well, and that was wrong twice over. Two sections is not the six that prompted CUI-004, so the control is proportionate here; and removing it stopped the visual capture expanding the trees, so the gate began photographing a collapsed sidebar and lost the coverage CUI-017 had just added. The filter and the expand control are separate levers and the pattern now says so."},{"date":"2026-09-06","text":"The filter change is invisible to the visual gate, confirmed by reverting it and comparing: 0 differing pixels either way. The capture expands trees but never opens a collapsed section, so the Dependencies section is never photographed. Filed as CUI-030."}],"links":["CUI-004","CUI-005","CUI-007","CUI-008"]},{"id":"CUI-026","title":"The MarkdownViewer pattern specifies a composition its demo no longer shows","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-07","stint":"pattern scope pass, 2026-09-07","evidence":{"commits":["532234f"],"integrated":[],"verified":"`npm run ci` exits 0. `patterns/MarkdownViewer.md` now opens on the flavour ladder the tab renders, names `?flavor=\u003cslug>` and the six rungs, and labels the three-pane example as the Docs page's composition. The internals it restated, the outline width range and the 50ms scroll debounce among them, are a link to `components/MarkdownViewer.md` instead."},"resolution":null,"details":"`patterns/MarkdownViewer.md` specifies a three-pane composition of SplitPane, Panel, Tree and a viewer with outline and minimap. The demo shows a six-flavour bundle-cost ladder instead, and says so in its own comment: the three-pane composition moved to the Docs page.\n\nSo the tab and the specification are two unrelated documents about the same name. A reader who opens one and then reads the other finds nothing in common.\n\nThe flavour ladder is the more useful thing to document, because choosing a parser flavour is the real decision a consumer faces. The three-pane example is worth keeping, labelled as the Docs page composition.\n\nSecondary: the spec duplicates internals that already live in `components/MarkdownViewer.md`, including the outline widths and the scroll debounce. They agree today, so this is duplication rather than contradiction, against CONTRIBUTING's rule that every fact lives in one place.","notes":[{"date":"2026-09-07","text":"Closed at the smaller of the two scopes the record set out. The flavour ladder is documented and the three-pane example is kept and labelled, rather than the demo being rebuilt to match the old specification. The owner confirmed that scope."}],"links":["CUI-010"]},{"id":"CUI-027","title":"Smaller pattern drift, grouped","type":"improvement","severity":"low","status":"closed","foundBy":"an independent reviewer agent, asked to assess whether the patterns had drifted from the design system","opened":"2026-09-06","resolved":"2026-09-07","stint":"pattern scope pass, 2026-09-07","evidence":{"commits":["57f6f42"],"integrated":[],"verified":"All five, each checked. `wrap: true` is on the three StatusBadge columns, which moved 20 and 25 pixels in the two dark master-detail captures, one unit per channel at the badge column's left edge, with the light captures unchanged; both were re-recorded. The chart demo's tooltip rule is `box-shadow: var(--shadow-md)` rather than two undefined Tailwind variables, and `check-integrity` now reports 0 notes where it reported the `--tw-shadow-colored` one. `grep -rn 'OPEN\\.md'` over the markdown returns nothing. `Legend.md` reads `patterns: [Dashboard]`. `FormResults.md` prescribes skeletons and links the reasoning. `npm run ci` exits 0."},"resolution":null,"details":"Five small ones, none worth a record alone.\n\n`MasterDetailDemo` omits `wrap: true` on its three StatusBadge columns while its own spec has it. `components/Table.md` says a column holding structured elements must set it, because a non-wrapping cell is clipped and offered through a tooltip whose content is the same badge again. Nothing clips at the widths tested, since the tables do not set `fixed`, so the symptom is latent rather than visible.\n\nThe Chart demo's hand-rolled Recharts tooltip loses its shadow: the rule it points at sets two undefined Tailwind variables and no `box-shadow`. Side by side with a real ChartTooltip on the same page, one has a shadow and one does not.\n\n`patterns/FormResults.md` prescribes a spinner while results load, which `patterns/ComponentStates.md` lists as an anti-pattern in favour of skeletons.\n\nTwo documents cite `OPEN.md`, which does not exist: that content became the ledger.\n\n`components/Legend.md` claims patterns that do not mention it, and omits Dashboard, which is the one that needs a legend.","notes":[{"date":"2026-09-07","text":"One correction to the record. It said two documents cite `OPEN.md`, and only `components/EventLanes.md` still did. No ledger record covers the pinned-tooltip finding the citation pointed at, so the citation was dropped rather than moved. The sentence around it already states the finding."}],"links":["CUI-024"]},{"id":"CUI-028","title":"Patterns have no behavioural tests, only screenshots","type":"improvement","severity":"med","status":"closed","foundBy":"an independent reviewer agent, asked how the patterns should be tested","opened":"2026-09-06","resolved":"2026-09-06","stint":"add-ledger, 2026-09-06","evidence":{"commits":["64e86c3","6b1a31c"],"integrated":[],"verified":"Two halves, each checked against the defect it exists for. The clipping assertion in the visual gate is quiet on the current tree and, with the Panel fix reverted, fails by name: 'the explorer pattern hides content a pointer cannot reach - div[body] hides 1701px', which is the figure measured in CUI-018. The wiring suite is 5 passing tests, and removing noValidate from the Form demo fails the Form one. Full suite 624 passed across 62 files, up from 619 across 61. npm run check exit 0, visual:compare 94/94."},"resolution":null,"details":"The visual gate photographs each pattern after clicking expand-all. It therefore catches layout regressions and is blind to behaviour. Two defects found this week prove the gap: a panel that clipped content a wheel could not reach, and a form whose documented error states cannot happen. Neither produces a pixel difference, because absent content and an unsubmitted form both photograph as correct.\n\nThe recommended shape, from a reviewer who read the existing gates first, is to extend what is here rather than add a stack. Pattern suites live under `src/patterns/`, layout assertions in the existing Playwright browser project because jsdom computes no layout, and wiring assertions in jsdom. They import the real demos rather than restating the composition, so a test cannot pass while the thing the specification documents is broken. One configuration line is needed: an alias for the package name, which the demos import and the test projects cannot currently resolve.\n\nAssertions anchor on ARIA roles and accessible names first, then `data-component` and `data-part`, never the generated preview class names. The demos carry no hooks of their own, so every stable anchor comes from the library.\n\nThe first step is one predicate over every pattern: no element may hide content while its computed overflow cannot scroll. The reviewer ran it. It is green across the patterns today and reports `hides 1056px` when the panel clipping is forced back, so it adopts clean and is not a heuristic.","notes":[{"date":"2026-09-06","text":"Deliberately excluded: component behaviour already covered by its own suite, chart geometry, anything the pixel, size or style gates already own, and the preview shell."},{"date":"2026-09-06","text":"One risk named by the reviewer: importing the demos pulls `preview/src` into the typecheck program for the first time, which may surface pre-existing type errors there."},{"date":"2026-09-06","text":"The recommended shape was followed for the wiring half and abandoned for the layout half, because running it showed it could not work. A demo mounted in a host of its own does not reproduce the layout that makes clipping happen. Given a fixed height the master-detail SplitPane panes come out 175px and report clipping the real page does not have; given a free height nothing is bounded, and the suite passed with the Panel bug deliberately reinstated. A test that cannot fail on the defect it was written for is worse than no test, so the layout assertion moved to the Playwright pass that already drives the real page."},{"date":"2026-09-06","text":"The predicate needed narrowing after it fired on the real page. It flagged the document root, whose scrolling belongs to the window, and a CardGroup sibling collapsed to 2px by the solo behaviour, which shows no content and therefore hides none. Both exclusions are written down where they are made, and the Panel bug was reinstated afterwards to confirm the narrowing had not made it deaf."},{"date":"2026-09-06","text":"Two of the first assertions were wrong rather than the code: the pattern renders several tables so aria-current is not unique to one, and a sortable column header is a columnheader with tabindex and a key handler rather than a button. Both were corrected against what the components actually do. The typecheck risk named in the recommendation did not appear: tsc is clean with the preview sources now in its program."}],"links":["CUI-017","CUI-018","CUI-020"]},{"id":"CUI-029","title":"A Dropdown inside an errored FormGroup nests a second FormGroup and renders an empty alert","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while verifying the Form pattern fix for CUI-020","opened":"2026-09-06","resolved":"2026-09-06","stint":"FormGroup pass, 2026-09-06","evidence":{"commits":["c210ac2"],"integrated":[],"verified":"Reverting the change fails exactly the new test and nothing else: `npx vitest run src/components/FormGroup.test.tsx` exits 1 on `a Dropdown in an errored group paints its border and nests no second group`, and exits 0 with it, 17 tests passing. Measured in the built preview after a failed submit of the Form pattern, before the fix: 6 FormGroup elements for 5 fields, and 5 alerts of which one was empty, the empty one nested inside the Plan group. `npm run ci` exits 0 with every gate run, 626 tests, visual:compare 94/94 at 0 differing pixels, axe violations 0, so the change is visually inert."},"resolution":null,"details":"FormGroup forwards `error` to component children as a boolean, deliberately, so a design system control can paint its error border in sync with the message. Dropdown declares `error` as a string, the message to show.\n\nSo a Dropdown inside a FormGroup with an error receives `error={true}`, reads it as a message, takes its chrome branch and renders a second FormGroup inside the first. That inner group renders `\u003cspan role=\"alert\">{true}\u003c/span>`, and React renders nothing for `true`, so the page carries a live region that announces nothing.\n\nMeasured in the Form pattern after a failed submit: six FormGroup elements for five fields, and five alert elements of which one is empty. The empty one is the nested group around the plan Dropdown. A screen reader meets an alert with no text, and the DOM carries a duplicated field wrapper.\n\nThe fix is a judgement about which convention wins. Dropdown could treat a boolean error as paint the border and render no chrome, which keeps both props as documented. Or FormGroup could stop forwarding to children that declare a string error. The first is smaller and keeps each component's documented contract intact.","notes":[{"date":"2026-09-06","text":"Found because fixing CUI-020 made the error states reachable for the first time, so this had never been observable: no error ever rendered in that pattern. Anchors: FormGroup.tsx:77-78 forwards the boolean, Dropdown.tsx:31 declares the string, Dropdown.tsx:108 branches on truthiness."},{"date":"2026-09-06","text":"The repository owner chose the third option rather than either in the original record. FormGroup now forwards no private prop at all. Input and Dropdown both paint their error border from `aria-invalid`, which FormGroup already forwarded and which reaches an element child and a component child alike. Dropdown never receives a boolean `error`, so the nested group cannot recur, and Dropdown keeps its documented string prop for standalone use."}],"links":["CUI-020"]},{"id":"CUI-030","title":"Pattern captures never open a collapsed section, so half a sidebar is never photographed","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while updating the Explorer pattern for CUI-025","opened":"2026-09-06","resolved":"2026-09-06","stint":"visual gate pass, 2026-09-06","evidence":{"commits":["7a92288"],"integrated":[],"verified":"Verified with the experiment this record was filed on. Turning the Explorer demo's Dependencies section filterable used to change the page and produce 0 differing pixels. With the second frame it fails the gate: 3109 pixels in dark and 3122 in light, both on `pattern-explorer-scrolled.png`, while `pattern-explorer.png` still reports 0. That split is the defect and its fix in one measurement. The rule qualified 5 of the 9 pattern pages, and the baseline grew from 94 captures to 104. `npm run ci` exits 0 with every gate run, 633 tests, visual:compare 104/104 at 0 differing pixels, axe 0."},"resolution":null,"details":"`capturePatterns` clicks every expand-all control before it photographs a page, which expands the trees inside a section. It does not open a section that is collapsed, and SectionedTree keeps that state separately.\n\nSo the Explorer pattern's Dependencies section is never in a capture. Removing its filter box changed the rendered page and produced 0 differing pixels, confirmed by reverting the change and comparing both ways.\n\nThe fix is a few lines: click each section header whose control reports it collapsed, in the same place the expand-all clicks happen. It changes the baseline, so it wants its own pass rather than riding along with a content change.","notes":[{"date":"2026-09-06","text":"The same shape as the reason those captures expand trees at all: a pattern at rest hides the composition that is worth watching. This is the half of that argument the implementation missed."},{"date":"2026-09-06","text":"The cause in `details` is wrong, and the fix it proposes is a no-op. Neither section on the Explorer page is collapsed: measured in the built preview, both `project` and `deps` render a `data-part=\"body\"` at load. Teaching `capturePatterns` to click a collapsed section header was implemented and reverted, because it changed 0 of 94 captures."},{"date":"2026-09-06","text":"What actually hides the section is the expand-all pass the capture already does. Measured at the capture's own 1440 by 798, after clicking expand all: the Project Files section grows to 1398px and pushes Dependencies to y=1695, inside a sidebar scroller that is 408px tall over 1615px of content. The section is scrolled out of view rather than collapsed, and a screenshot cannot reach it.\n\n`assertNothingClipped` is right to stay quiet: the scroller does scroll, so a pointer can reach the content. This is a different gap, which is that the gate photographs one scroll position of a box that has several."},{"date":"2026-09-06","text":"The fix is now a judgement rather than the few lines this record promised. A second capture with the sidebar scrolled to its end is the most faithful option and adds a frame per pattern. Expanding less would keep everything in view and give up the reason the captures expand at all. Photographing the scroller at its full height means rendering a layout the application never shows, which is the trap the comment above `assertNothingClipped` already warns about."},{"date":"2026-09-06","text":"The second frame is taken only when running the scrollers to their end brings an element into view that the first frame did not already show whole. An earlier draft gated it on a hidden-pixel threshold of 100, which the repository owner rejected: the number encoded a guess rather than a fact, unlike the 2px rounding and 8px collapsed allowances in `assertNothingClipped` that each name something physical. The behavioural test needs no threshold, and it skipped the `form` page, which hides 22 pixels of padding and reveals nothing."},{"date":"2026-09-06","text":"Two boxes are still sampled rather than covered. The markdown-viewer page has a scroller hiding 5250px, so a frame at each end misses what lies between them. That is a limit of photographing a scroll position rather than a defect in this fix, and it wants a different technique if it ever matters."}],"links":["CUI-017","CUI-025"]},{"id":"CUI-031","title":"The gate fails on a clean install, because typecheck resolves the package name through dist","type":"defect","severity":"high","status":"closed","foundBy":"session agent, running npm ci and the gate in a fresh sandbox for the first time","opened":"2026-09-06","resolved":"2026-09-06","stint":"sandbox-verify, 2026-09-06","evidence":{"commits":["803fd74"],"integrated":[],"verified":"Reverting the fix restores the failure exactly. With `dist/` removed, `npm run typecheck` reports 77 errors and exits 2. With the paths mapping in place it reports 0 and exits 0. Five of the 77 are `Cannot find module \"@codesweep-ai/ui\"` and the rest follow from them. Moving `src/patterns/patterns.wiring.test.tsx` aside clears all 77 as well, which is what identifies it as the importer. `npm run check` now exits 0 on a tree that has never been built, the condition CI starts from. `docs:compile` still reads `dist/`: without it the gate fails with 51 `Cannot find module` errors, the same count as before the fix."},"resolution":null,"details":"`npm ci` followed by `npm run check` fails at typecheck on a checkout that has never been built. It reports 77 errors in three preview demo files. Five are `Cannot find module \"@codesweep-ai/ui\"`, and the rest are the implicit `any` parameters that follow from them.\n\n`src/patterns/patterns.wiring.test.tsx` imports three demos from `preview/src/pages/patterns/`, which pulls those demos into the `tsc` program. Each demo imports the package by its own name. Node resolves a self-reference through the `exports` map in `package.json`, and every entry there points into `dist/`. A tree that has never been built has no `dist/`.\n\nA working copy hides this. Any tree that has run `npm run build` once has a `dist/`, and `check` runs `typecheck` before `build`, so the gate reads output it only produces later in the same run.\n\nCI would fail the same way. The check job runs `npm ci` and then `npm run check` on both Node legs, with no build between them. Nothing on this branch has been pushed, so no run has reported it yet.\n\nThe preview and the tests both resolve that import to `src`, through the alias in `preview/vite.config.ts` and the one in `vitest.config.ts`. Only the typecheck reads the built package.","notes":[{"date":"2026-09-06","text":"The mapping in the root config would have reached `docs:compile` too, because its scratch config extends the root one. That scratch config now clears `paths` explicitly, so a documented example still compiles against `dist/` the way it renders. Removing that override would soften the type half of the gate. The render half resolves `dist/` at runtime and would still catch a broken build."}],"links":["CUI-028"]},{"id":"CUI-032","title":"SplitPane's keyboard resize clamps against the bound it is moving away from","type":"defect","severity":"high","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"SplitPane pass, 2026-09-06","evidence":{"commits":["7b6d87d"],"integrated":[],"verified":"Reverting the fix fails exactly the new test and nothing else. `npx vitest run src/components/SplitPane.test.tsx` exits 1 on `clamps the keyboard resize when the handle sizes the right pane`, and exits 0 with the fix in place. The test drives a SplitPane whose left pane is flex-fill. It holds ArrowLeft six times against a 320px maximum and reads `aria-valuenow` 320, then holds ArrowRight twenty times against a 200px minimum and reads 200. Unclamped those reach 360 and 120. `npm run ci` exits 0 reporting every gate ran, with 625 tests passing where 624 passed before, visual:compare 94/94 at 0 differing pixels, and axe violations 0."},"resolution":null,"details":"`resolvePane` returns `direction: -1` when the left pane is the flex-fill one, because the handle then sizes the pane on its right (`src/components/SplitPane.tsx:45`).\n\nThe arrow handlers do not account for that sign. `SplitPane.tsx:107` computes `Math.min(max, currentWidth + step * direction)` for ArrowRight, and `:108` computes `Math.max(min, currentWidth - step * direction)` for ArrowLeft. With `direction` at -1, each key is clamped against the bound it is moving away from. Holding ArrowLeft grows the pane past `maxWidth` without limit, and holding ArrowRight shrinks it below `minWidth`.\n\nThe arrows are also inverted against the key table at `components/SplitPane.md:96`, which gives ArrowLeft as decrease and ArrowRight as increase.\n\nPointer drag clamps correctly at `SplitPane.tsx:137`, so only the keyboard path is affected. That is the accessible path, which makes it the worse half to have broken.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"Fixed by clamping between both bounds, which is what pointer drag already did. The arrow keys were not inverted after all: they move the handle, and the width that changes belongs to whichever pane is fixed. The key table said the arrows change a width without saying whose, so it now says. Handled in one pass with the SplitPane items in CUI-044 and CUI-047."}],"links":[]},{"id":"CUI-033","title":"Toast's important option never escalates the live region to an alert","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"Toast pass, 2026-09-06","evidence":{"commits":["b9a339e"],"integrated":[],"verified":"Reverting the fix fails the new test with `Unable to find an accessible element with the role \"alert\"`, and it passes with the fix. `npm run ci` exits 0 with every gate run, 630 tests, visual:compare 94/94 at 0 differing pixels, and axe 0 rules matching more nodes than the baseline."},"resolution":null,"details":"`components/ToastContainer.md:77` says `important: true` gives a toast no auto-dismiss and `role=\"alert\"`. The same claim appears at `:63`.\n\n`src/components/Toast.tsx:41` derives the role from the variant alone, testing for `warning` or `error`. The word `important` appears nowhere in that file, and `:46` and `:47` set `role` and `aria-live` from that test.\n\nSo `toast.info(\"Deploy failed\", { important: true })` is announced politely rather than assertively. The auto-dismiss half of the promise does work, at `src/lib/toast.ts:39`.\n\nThe existing test pairs `important` with the `error` variant, which is already an alert, so it passes whether or not `important` is read.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"`important` now escalates the live region on its own, alongside the warning and error variants. The auto-dismiss half of the option already worked. The test that existed paired `important` with `error`, which is already an alert, so it could not have caught this."}],"links":[]},{"id":"CUI-034","title":"StreamingText fires onDone once when motion is reduced","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"StreamingText pass, 2026-09-06","evidence":{"commits":["5cd8a4d"],"integrated":[],"verified":"Reverting the fix fails exactly the new test: `npx vitest run src/components/StreamingText.test.tsx` exits 1 with `expected \"vi.fn()\" to be called 2 times, but got 1 times`, and exits 0 with the fix, 11 tests passing. `npm run check` exits 0."},"resolution":null,"details":"`components/StreamingText.md:75` says `onDone` fires exactly once per `text` value, after the last character is revealed.\n\n`src/components/StreamingText.tsx:55` returns from the effect early when `done` is set or `prefersReducedMotion()` is true. The reset of `firedDoneRef` sits below that return, at `:61`. The ref therefore stays true after the first message, and no later `text` value fires the callback again.\n\nA consumer chaining messages off `onDone` stalls after the first one, for every user who has asked for reduced motion.\n\n`:83` also guards on `text.length > 0`, so an empty `text` never fires it at all.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"The reset of the ref moved above the early return, so a new `text` starts un-fired whether or not it animates. The empty-text half of the report was closed in the specification rather than the code: an empty `text` reveals no characters, so there is no last character to fire after, and the document now says so."}],"links":[]},{"id":"CUI-035","title":"A hovered Tree row loses the selection tint it was given","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"Tree pass, 2026-09-06","evidence":{"commits":["00cc32a"],"integrated":[],"verified":"Reverting the fix fails the new test with `no hover rule reaches a selected row: expected undefined to be defined`, and it passes with the fix, 10 tests. `npm run ci` exits 0 with every gate run, 631 tests, visual:compare 94/94 at 0 differing pixels. The captures never photograph a hovered row, so the visual gate is silent on this either way, which is why the test asserts the rule rather than a colour."},"resolution":null,"details":"`components/Tree.md:162` documents selected and hovered together as `background: var(--color-accent-bg-hover)`, a stronger accent than selection alone.\n\n`src/styles/components/tree.css:205` paints the selected row `var(--color-accent-bg)` through a single class. `:353` paints any hovered row `var(--color-row-hover)` through a class and a pseudo-class, which has the higher specificity and wins.\n\nHovering a selected row therefore replaces the accent tint with plain grey. That is the opposite of what the specification describes.\n\n`--color-accent-bg-hover` is defined at `src/styles/tokens.css:99` and referenced nowhere in `tree.css`.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"Fixed by giving the hovered selection both classes, so it outranks the general row-hover rule. The same shape applies to a hovered search match, which carries `cs-component-tree-27` and the same resting accent. That was left alone: the specification documents the selected case only, and extending it is a decision rather than a correction."}],"links":[]},{"id":"CUI-036","title":"MarkdownMinimap never draws when its content mounts after it","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"MarkdownMinimap pass, 2026-09-06","evidence":{"commits":["114ebbe"],"integrated":[],"verified":"A browser test mounts the minimap first and the content second, which is the shape the record describes. Against the component as it stood, it painted 0 pixels of canvas after the content arrived and 600ms passed. With the element as the prop it paints 82610. The test is kept as a regression guard, and freezing the dependencies back to something that does not change when the content arrives fails it again with `expected 0 to be greater than 0`. `npm run ci` exits 0 with every gate run, 636 tests, visual:compare 104/104 at 0 differing pixels, axe 0, and docs:compile accepts the rewritten example."},"resolution":null,"details":"`components/MarkdownMinimap.md:97` says the initial draw timeout covers the case where the content mounts after the minimap.\n\nIt cannot. `src/components/MarkdownMinimap.tsx:98` returns from the effect when `contentRef.current` is empty, and the `setTimeout` that would schedule the draw sits below it at `:105`. The effect's dependencies are `[contentRef, drawMinimap]` at `:128`, and a ref object does not change identity when its `current` is populated later.\n\nSo the effect never runs a second time. A consumer who mounts the minimap before its content gets a permanently blank canvas, with no scroll listener and no resize observer attached.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"The owner chose the API change over the smaller fix, having asked for the right behaviour rather than the cheapest one. Both were built and measured first. Mirroring the element into state kept the prop and fixed the case in nine lines, but it works by re-checking on every render, so it depends on the component being called again after the element appears. That holds when one state change drives both, and not when a consumer memoises the minimap. Taking the element makes the arrival itself the trigger, so nothing has to notice."},{"date":"2026-09-06","text":"Breaking, and deliberately so at 0.2.0. Three call sites moved with it: MarkdownViewer, which now mirrors its scroller node into state alongside the ref it still reads, and two tests. A consumer changes `contentRef={ref}` to `content={element}` with `ref={setElement}` on the content, and the compiler names every site rather than failing silently. No other component in the library keys an effect on a ref prop, checked across `src/components/`."}],"links":[]},{"id":"CUI-037","title":"CheckboxGroup leaves All enabled when the filter matches nothing","type":"defect","severity":"low","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-07","stint":"CheckboxGroup pass, 2026-09-07","evidence":{"commits":["da73e73"],"integrated":[],"verified":"Reverting the fix fails the new test, `All and None are both disabled when the filter matches nothing`, and it passes with the fix, 16 tests. `npm run ci` exits 0 with every gate run, visual:compare 104/104 at 0 differing pixels, axe 0."},"resolution":null,"details":"`components/CheckboxGroup.md:214` says both the All and None buttons are disabled when the filter matches nothing.\n\n`src/components/CheckboxGroup.tsx:237` computes `allFilteredSelected` with a leading `filteredOptions.length > 0`, which is false for an empty result. That value reaches the button's `disabled` expression at `:106`, so All stays enabled.\n\nNone behaves as documented, because `:238` calls `every()` on an empty array and gets true.\n\nClicking the live All button does nothing. A reader is told both go inert, and one of them does not.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-07","text":"Fixed by removing the length guard rather than by adding one on the other side. `every` on an empty list is true, which is already what disables None when the filter matches nothing, so dropping the guard makes the pair behave the same way for the same reason."}],"links":[]},{"id":"CUI-038","title":"A disabled Input still repaints its border on hover","type":"defect","severity":"low","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"Input pass, 2026-09-06","evidence":{"commits":["a49538e"],"integrated":[],"verified":"Reverting the guard fails the new test: `npx vitest run src/components/Input.hover.test.tsx` exits 1 with `expected true to be false`, the disabled wrapper matching a rule that should not reach it, and exits 0 with the guard. `npm run ci` exits 0 with every gate run, 628 tests, visual:compare 94/94 at 0 differing pixels, axe violations 0."},"resolution":null,"details":"`components/Input.md:108` says a disabled Input suppresses hover effects.\n\n`src/styles/components/input.css:162` sets `border-color: var(--muted)` on the wrapper's `:hover` with no disabled guard. That class sits on the wrapper `\u003cdiv>` at `src/components/Input.tsx:72`, and the native `disabled` attribute on the inner control does not affect a wrapper.\n\nHovering a disabled field therefore still moves the border colour, so the disabled affordance is weaker than the specification promises.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"Guarded by class rather than by `:disabled`, because the rule is on the wrapper div and the native attribute sits on the control inside it. The test asserts the rule's reach rather than the painted colour: a real `:hover` needs a real cursor, and neither the provider pointer nor a synthetic event moves the computed border in a headless browser, so a colour assertion would have passed with or without the fix. That was caught by writing the enabled case as a control first."}],"links":[]},{"id":"CUI-039","title":"Two component sheets assign a font stack to font-weight","type":"defect","severity":"low","status":"closed","foundBy":"two independent reviewer agents, in separate batches, both reading the component stylesheets","opened":"2026-09-06","resolved":"2026-09-06","stint":"Input pass, 2026-09-06","evidence":{"commits":["0e60a5b"],"integrated":[],"verified":"The new integrity check names both lines when run against the sheets as they stood one commit earlier: `dropdown.css:91` and `input.css:102`, exit 1. It passes on the corrected tree. The corrected declarations change 0 of 94 captures in visual:compare, which is what shows `font-family: var(--font-family-sans)` matches the family `reset.css` was already supplying through `font-family: inherit`. `npm run ci` exits 0 with every gate run and 628 tests."},"resolution":null,"details":"`src/styles/components/input.css:102` and `src/styles/components/dropdown.css:91` both declare `font-weight: var(--font-family-sans)`. A font stack is not a valid `font-weight`, so a browser drops the declaration.\n\nNeither sheet sets `font-family` anywhere else. The rendered result still matches `components/Input.md:96` and `components/Dropdown.md:98`, because `src/styles/reset.css:97` gives form controls `font-family: inherit`.\n\nNothing looks wrong today. The rule written to assert the family is dead, and a change to the reset would take the family with it silently.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"Fixed rather than deleted, so the sheet asserts the family it documents. A change to the reset would otherwise have taken the family with it silently, which was the reason this was worth more than a tidy-up. The guard fails a font-family token on any property but `font-family` and the `font` shorthand, so the class of typo cannot return anywhere under src/styles/."}],"links":[]},{"id":"CUI-040","title":"Card documents a position: relative that no stylesheet sets","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"Card pass, 2026-09-06","evidence":{"commits":["783a5b2"],"integrated":[],"verified":"Reverting the rule fails the new test with `expected 'static' to be 'relative'`, and it passes with the rule, in browser mode because jsdom applies no stylesheet to a computed style. The change moves nothing: with the components page loaded, 3484 elements were measured before and after promoting all 13 cards to `position: relative`, and 0 changed their bounding rectangle. It does change text rasterisation inside two of them, so `code-block` and `mermaid-diagram` were re-recorded at 1.8170% and 1.7947%, and 0.5313% and 0.6410%. `npm run ci` exits 0 with every gate run, 632 tests, visual:compare 94/94 at 0 differing pixels, axe 0."},"resolution":null,"details":"`components/Card.md:60` gives the Card root `display: block` and `position: relative`.\n\n`src/styles/components/card.css` contains no `position` declaration at all. The root class sets overflow, radius, border and shadow only.\n\nA consumer who absolutely positions a badge or a menu inside a Card, on the strength of that line, gets it positioned against whichever ancestor does establish a containing block. That is usually the page rather than the card.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"Attempted and reverted, because the one-line fix is not visually inert. Adding `position: relative` to the Card root fails the visual gate at 90 of 94: `code-block` changes 1.79% and 1.82% of pixels, and `mermaid-diagram` 0.53% and 0.64%, in light and dark. The captures keep their dimensions, and no whole-pixel shift explains the difference: comparing the new render against the baseline at every offset from -2 to +2 in both axes, the smallest difference is at zero offset. So the text is rasterised differently rather than moved, which is what promoting the card to a containing block does to the subpixel positions of its descendants. Accepting the fix means re-recording four captures for a containing block nothing in the library currently uses. Correcting the specification instead costs nothing and leaves a consumer without the anchor. That is a decision for the repository owner."},{"date":"2026-09-06","text":"The owner approved the fix on condition it broke nothing, so the question became whether the failing pixels were geometry or rasterisation. Comparing the new render against the baseline at every offset from -2 to +2 in both axes put the smallest difference at zero offset, which rules out a shift, and the bounding-rectangle sweep settled it: nothing moves. The captures were re-recorded on that basis."}],"links":[]},{"id":"CUI-041","title":"AppShell's responsive header rules are not implemented","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-07","stint":"AppShell header pass, 2026-09-07","evidence":{"commits":["7da8315"],"integrated":[],"verified":"`npx vitest run --project browser src/components/AppShell.responsive.test.tsx`: 2 tests pass. At a 700px viewport the header inner computes `flex-direction: column` and `align-items: flex-start`, the nav list computes `flex-wrap: wrap`, and 12 nav items occupy more than one row with `scrollWidth` no greater than `clientWidth`. At 1440px both revert to `row` and `nowrap`. Removing the media query fails both tests, with `expected 'row' to be 'column'` and `expected 1 to be greater than 1`. `npm run ci` exits 0."},"resolution":null,"details":"`components/AppShell.md:131` opens a section headed `Responsive (max-width: 768px)` and promises the header inner switches to `flex-direction: column`, with nav links set to `flex-wrap: wrap`. The edge case at `:204` repeats it, saying many nav items wrap to the next line on mobile.\n\n`src/styles/components/app-shell.css` contains no `@media` block and no `flex-wrap` declaration. The only component stylesheet in the repository with a width media query is `src/styles/components/event-lanes.css:155`.\n\nA consumer planning a mobile header on that promise ships one whose nav overflows instead of stacking.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-07","text":"Closed by implementing the section rather than deleting it. The breakpoint is written `48rem`, which is 768px at the browser's default root size, because `lint:styles` disallows pixel units and because a rem breakpoint follows a reader who enlarges that size. `event-lanes.css` already used the rem form.\n\nThe visual gate cannot see this rule. It captures at one 1440px viewport, so the new browser test resizes the viewport itself and is the only thing holding the stylesheet to the document."}],"links":[]},{"id":"CUI-042","title":"Skeleton's specification sends a consumer to the wrong stylesheet","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"Skeleton pass, 2026-09-06","evidence":{"commits":["6ec7a39"],"integrated":[],"verified":"`grep -rn cs-skeleton src/styles/` returns only `src/styles/components/skeleton.css`, which `src/styles/components.css:29` imports, and `src/styles/base.css` imports `./reset.css` and nothing else. Both claims in the specification now name that file. `npm run check` exits 0."},"resolution":null,"details":"`components/Skeleton.md:73` says the `cs-skeleton` class is defined in `src/styles/base.css`, and `:51` says no separate import is needed when `base.css` is already imported.\n\nThe class is defined at `src/styles/components/skeleton.css:1` and reaches a consumer through `src/styles/components.css:29`. `src/styles/base.css` imports `reset.css` and nothing else.\n\nA consumer who follows the specification and imports `base.css` alone gets an unstyled, unanimated `\u003cspan>`, with no error and no warning.\n\nThat is the failure mode recorded in CUI-006, arriving through the documentation rather than through a guess.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"A documentation fix rather than a code one: the stylesheet is where it belongs, and the specification pointed somewhere else. Nothing gates a prose claim about which file defines a class, so this can drift again."}],"links":["CUI-006"]},{"id":"CUI-043","title":"MermaidDiagram's specification states the opposite security posture from the code","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"documentation passes, 2026-09-06","evidence":{"commits":["a3c8fd4"],"integrated":[],"verified":"`MermaidDiagram.tsx:142` sets `securityLevel: \"strict\"` with `htmlLabels: false`, and `MermaidDiagram.test.tsx:27` pins it. The specification said `loose` in both its frontmatter note and its Security section. `npm run check` exits 0, and `npm run catalog` regenerated CATALOG.md and catalog.json for the changed frontmatter."},"resolution":null,"details":"`components/MermaidDiagram.md:85` says the component initialises Mermaid with `securityLevel: \"loose\"`, and warns that the `chart` prop must therefore be trusted input. The frontmatter note at `:19` repeats it.\n\n`src/components/MermaidDiagram.tsx:142` sets `securityLevel: \"strict\"` with `htmlLabels: false`. A test pins strict at `src/components/MermaidDiagram.test.tsx:27`, and `components/MarkdownViewer.md:204` describes the same component as strict. The specification is the stale side.\n\nThe code is the safer of the two, so the risk is not the one the warning describes. The cost is the interaction contract at `:89`: a `click` directive cannot fire a callback under strict, so a consumer wiring one from the documentation gets a silent no-op.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"The code was the safe side, so this was a documentation fix rather than a security change. The interaction section is the part that mattered: it promised `click` directives that mermaid disables at `strict`, so a chart written from the document renders and does nothing. That mermaid disables click callbacks at `strict` is its documented behaviour rather than something measured here. Supporting them means moving to `loose` and accepting HTML in node labels, which is a decision for the owner."}],"links":[]},{"id":"CUI-044","title":"Component specifications describe styling no stylesheet applies","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-07","stint":"Table pass, 2026-09-07","evidence":{"commits":["bfc6163","92ce7e2","f866878","6f2c943"],"integrated":[],"verified":"All six bullets checked against the source, and the last two carry tests. Reverting the two Table rules fails both assertions in `src/components/Table.surface.test.tsx`, which reads the wrapper's computed background against `--card` and finds the hover rule that reaches a sortable header. `npm run ci` exits 0 with every gate run, visual:compare 104/104 at 0 differing pixels, axe 0."},"resolution":null,"details":"Six specifications document a visual treatment that no rule under `src/styles/` produces. Each was checked against the component's own sheet.\n\n- `components/Table.md:155` promises sortable headers turn `var(--color-accent)` on hover. `src/styles/components/table.css` has one `:hover` rule, at `:233`, and it is for rows.\n- `components/Table.md:100` gives the table `background: var(--card)`. `var(--card)` does not appear in `table.css`, so the table takes whatever is behind it.\n- `components/StatusBadge.md:60` gives the label `var(--font-weight-medium)`. The label carries `text-label-upper`, which is `var(--font-weight-semibold)` at `src/styles/utilities.css:4`.\n- `components/Panel.md:57` pins the title at `11px`. It resolves through `--font-size-label` to 12px, and `DESIGN_SYSTEM_SPEC.md:614` agrees with the code.\n- `components/Input.md:98` and `components/SearchInput.md:81` give the placeholder `var(--muted)`. Both sheets use `var(--color-neutral)`, which differs in both themes.\n- `components/SplitPane.md:64` describes the hit area as a `::before` extending 2px on each side. `src/styles/components/split-pane.css` has no `::before`, and the real child element is offset to one side instead.\n\nEach of these misleads someone matching their own markup to the library's.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"The SplitPane bullet is done, in bfc6163. `components/SplitPane.md` now describes the hit area as the child element it is, `0.5rem` wide and offset `-0.25rem`, rather than a `::before` extending evenly on both sides. The Table, StatusBadge, Panel and placeholder bullets are still open."},{"date":"2026-09-06","text":"The placeholder bullet needs a decision and was left alone during the Input pass. `components/Input.md:98` and `components/SearchInput.md:81` say `var(--muted)`, and both sheets use `var(--color-neutral)`. Changing the sheets repaints every placeholder in both themes and moves the baseline. Changing the documents blesses the colour that ships today. Neither is obviously right, so it is for the repository owner rather than a session agent."},{"date":"2026-09-06","text":"The placeholder bullet is done, in 92ce7e2. The owner chose to document the colour that ships rather than repaint every placeholder, so `components/Input.md` and `components/SearchInput.md` now name `var(--color-neutral)`. The Table, StatusBadge and Panel bullets are still open."},{"date":"2026-09-06","text":"The StatusBadge and Panel bullets are done, in f866878, on the same principle the owner set for the placeholder: name what ships. StatusBadge is semibold through the `text-label-upper` utility, and Panel's title is `--font-size-label` at 0.75rem rather than a hard-coded 11px.\n\nThe two Table bullets are left open, and they are a different shape. Both are absences rather than wrong values: no `:hover` rule for a sortable header, and no `var(--card)` background. Naming what ships would mean deleting two documented affordances, and adding them would repaint every table. Either way it is a product decision rather than a correction."},{"date":"2026-09-07","text":"The Table bullets closed on measurement that corrected the advice given with them. The background was presented as repainting three tables from the page grey to the card colour. It repaints nothing: toggling the rule on the rendered table changes 0 of its 976 by 381 pixels, because the header row paints `--color-bg-muted` and the body rows cover the rest, so the wrapper's own background is never exposed. The earlier figure came from measuring what sits behind the table rather than what is visible through it.\n\nThe owner kept it on the narrow argument: the wrapper already draws a border and a radius, so it is a surface, and one relying on its children to stay opaque is fragile where consumers restyle rows. The hover is not inert. A sortable header turns `var(--color-accent)` under a pointer, which no capture can photograph, so the test asserts the rule's reach instead."},{"date":"2026-09-07","text":"Correction to the note above: the card background is not inert. It repaints the table body from the page grey to `var(--card)`, measured at the pixel level as 243,244,246 becoming 255,255,255 across 358109 of `table.png`'s 371856 pixels. The earlier claim of 0 differing pixels came from running pixelmatch at the gate's own threshold, which tolerates a shift of that size, and reading its answer as equality. The reasoning for keeping the rule stands; the description of what it does was wrong."}],"links":[]},{"id":"CUI-045","title":"Component specifications name DOM attributes the components no longer emit","type":"defect","severity":"low","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"documentation passes, 2026-09-06","evidence":{"commits":["a4c0e11","a3c8fd4","55e5b8a"],"integrated":[],"verified":"Every attribute was checked in the source. `Dropdown.tsx:56` carries `data-component` on the wrapper and `:66` carries the empty-state `data-testid` on the select, the opposite of both documented claims. `title=` appears zero times in `Tooltip.tsx` and `ThemeToggle.tsx`. `MermaidDiagram.tsx:208` renders `md-mermaid-error__message` and `:221` renders `md-mermaid--sketch`, and `grep -c` finds neither in `markdown-content.css`. `npm run check` exits 0."},"resolution":null,"details":"Four specifications tell a reader to select on an attribute the component does not render.\n\n- `components/Dropdown.md:154` puts `data-component=\"Dropdown\"` on the root `\u003cselect>`. `src/components/Dropdown.tsx:56` puts it on the wrapper `\u003cdiv>`, and the select carries none. Anyone selecting it to read `.value` gets a div.\n- `components/Dropdown.md:64` puts `data-testid=\"dropdown-empty\"` on the wrapper. `Dropdown.tsx:66` puts it on the select.\n- `components/Card.md:116` and `components/ThemeToggle.md:101` both describe a `title` attribute. Neither component sets one, because the work recorded in CUI-016 moved every native tooltip onto the Tooltip component, which renders a bubble instead.\n- `components/MermaidDiagram.md:99` lists the classes the error branch emits and omits `md-mermaid-error__message`, which `MermaidDiagram.tsx:208` renders and `src/styles/markdown-content.css` does not define.\n\nThe compile gate passes all of these, because it asserts that a documented hook renders rather than that the description of it is right.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"All four were documentation fixes: the components are right and the specifications described an older shape. The two mermaid classes are documented as emitted with no rules of their own, which is a hook rather than a defect. Whether the error message should carry styling is a separate question nobody has asked."}],"links":["CUI-016"]},{"id":"CUI-046","title":"MarkdownViewer's specification has drifted from the component in four places","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"documentation passes, 2026-09-06","evidence":{"commits":["538856f"],"integrated":[],"verified":"Each of the four claims was checked against the source before rewriting. `MarkdownViewer.tsx:57`, `:60` and `:61` declare the three props the table omitted. `:684` gates the outline on `outline && !outlineCollapsed`, so it unmounts, while `:777` renders the minimap whenever `minimap` is set with `width: 0` when collapsed and `:764` renders its rail alongside. `:258` returns the empty block before any article. `npm run check` exits 0."},"resolution":null,"details":"- The props table at `components/MarkdownViewer.md:31` lists fifteen props and omits three the component accepts: `onImageSrc`, `onHeadingNavigate` and `initialHeading`, declared at `src/components/MarkdownViewer.tsx:57`, `:60` and `:61`. Three shipped capabilities are invisible to a reader.\n- `:106` says a pane and its rail are never in the DOM together. `MarkdownViewer.tsx:777` renders the minimap whenever `minimap` is set, styled to zero width, while `:764` renders the rail beside it when collapsed.\n- `:91` describes the outline collapsing by transitioning its width to zero. `MarkdownViewer.tsx:684` unmounts it instead. The width transition it describes is what the minimap does, so the two descriptions are swapped.\n- `:185` says empty content renders an empty article. `MarkdownViewer.tsx:258` returns an empty-state block before any article, which the same document describes correctly at `:55`.\n\nThe second one matters most. The specification invites querying `[data-part=\"minimap\"]` as proof the pane is showing, and that selector matches while it is collapsed.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"The two panes were described the wrong way round, so the width transition the document gave the outline is what the minimap does. The consequence worth naming is the selector: `[data-part=\"minimap\"]` matches while the pane is collapsed, and the document used to offer it as proof the pane was showing."}],"links":[]},{"id":"CUI-047","title":"Prop tables and interfaces disagree with the components they document","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"documentation passes, 2026-09-06","evidence":{"commits":["bfc6163","c210ac2","c254f73"],"integrated":[],"verified":"Each of the nine claims was read against the source before rewriting. `SplitPane.tsx:165` returns null for a collapsed pane, `SegmentedControl.tsx:15` carries the `Omit`, `FormGroup.tsx:15` declares `label` optional, `AppShell.tsx:35` defaults `titleHref` to null, `CardGroupContext.ts` carries `fill`, `MarkdownMinimap.tsx:70` floors every block at 2px, `code-block.css:10` applies flex to a class `CodeBlock.tsx:178` adds only under `fillHeight`, and `EventLanes.tsx:613` draws one stroked rectangle. `npm run check` exits 0."},"resolution":null,"details":"- `components/SegmentedControl.md:32` prints the props interface without the `Omit` the code carries at `src/components/SegmentedControl.tsx:15`. `Omit\u003c..., \"onChange\">` is load bearing, so a reader who copies the printed interface to wrap the component hits a type error the document does not warn about.\n- `components/FormGroup.md:29` declares `label` required. `src/components/FormGroup.tsx:15` declares it optional, and the comment above it documents the unlabelled composite-control case the specification never mentions.\n- `components/AppShell.md:43` says `titleHref` defaults to `/`. `src/components/AppShell.tsx:35` defaults it to `null` and renders an inert `\u003cspan>`. The document contradicts itself at `:44`.\n- `components/CardGroup.md:90` prints the context value as `maximizedId` and `toggle`. `src/components/CardGroupContext.ts` also carries `fill`.\n- `components/SplitPane.md:80` describes a collapsed pane as zero width with hidden overflow. `src/components/SplitPane.tsx:165` returns null, so its children and their state leave the DOM.\n- `components/MarkdownMinimap.md:49` gives content blocks a 1px minimum. `MarkdownMinimap.tsx:70` floors every block at 2px first, and the same document says 2px at `:99`.\n- `components/CodeBlock.md:58` gives the root `display: flex`. `src/styles/components/code-block.css:10` applies that to a class `CodeBlock.tsx:178` adds only in `fillHeight` mode.\n- `components/EventLanes.md:254` describes a two-tone viewport window. `src/components/EventLanes.tsx:613` draws a single stroked rectangle, and the comment above it records the removal.\n- `components/FormGroup.md:81` says `error` is forwarded to every child. `FormGroup.tsx:76` forwards it only to component children, never to a native element.","notes":[{"date":"2026-09-06","text":"Session agent confirmed every citation in this record against the tree at a374f2c before filing it."},{"date":"2026-09-06","text":"The SplitPane bullet is done, in bfc6163. The States table now says a collapsed pane is not rendered, and an edge case says what that costs: scroll position, focus and uncontrolled input inside it are discarded. The other eight bullets are still open."},{"date":"2026-09-06","text":"The FormGroup error-forwarding bullet is done, in c210ac2. FormGroup forwards no private prop now, so the Behavior table no longer claims one, and the question of whether it reaches a native child does not arise. The `label` bullet on the same component is still open, along with the other seven."},{"date":"2026-09-06","text":"The AppShell entry needed more than a value. Its advice about single-file artifacts was argued from a `/` default that does not exist, so the reasoning was rebuilt on the inert default that does, keeping the advice intact. The error-forwarding bullet was closed earlier by the work in CUI-029."}],"links":[]},{"id":"CUI-048","title":"AppShell's nav-link table contradicts the stylesheet and its own accessibility section","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-07","stint":"AppShell header pass, 2026-09-07","evidence":{"commits":["9f57f18"],"integrated":[],"verified":"`npx vitest run --project browser src/components/AppShell.nav.test.tsx`: 6 tests pass, one of them tabbing to a nav link with the browser's own keyboard and reading `outline-style: solid` with an `outline-color` equal to a `var(--color-accent)` probe. Removing the rule fails that test with `expected 'auto' to be 'solid'`, which is the browser default the table used to promise. Against `--color-header-bg` the ring measures 10.73:1 in the dark theme and 3.28:1 in the light one, where `--color-accent` is the darker `#0f766e`, so both clear the 3:1 WCAG 2.2 asks of a focus indicator. `npm run ci` exits 0 with every gate run, and the rule reaches the published build at `dist/styles/components/app-shell.css:191`."},"resolution":null,"details":"`components/AppShell.md:127` gives a hovered nav link `color: var(--color-text-inverse)` over `background: var(--color-nav-hover)`, and `:128` gives an active one `color: var(--color-accent)` over the same background.\n\n`src/styles/components/app-shell.css:97` paints the active background with `color-mix(in srgb, var(--color-accent) 22%, transparent)`, and `:159` gives idle links `var(--color-header-text-muted)`. The tokens named in the States table have no effect on nav links.\n\nThe same document states the real values at `:149`, so it contradicts itself and a reader cannot tell which half is current. A brand layer re-theming the header from the States table changes tokens that do nothing, and misses the ones that do.\n\nThe table also promises a focus ring at `:129`. `app-shell.css` contains no `:focus` or `:focus-visible` rule at all, so a keyboard user gets the browser's default outline rather than the documented treatment.","notes":[{"date":"2026-09-06","text":"Found by the same review that produced CUI-032 through CUI-047, and missed when those records were written. Filed here so the review's findings are complete. Session agent confirmed every citation against the tree at 0ef7ea4."},{"date":"2026-09-06","text":"The states table is corrected, in f4ea7c5. It now names `--color-header-text-muted` for an idle link and the accent `color-mix` for an active one, which is what `app-shell.css` paints and what the document's own accessibility section already said.\n\nThe focus half is left open. `app-shell.css` still has no `:focus` or `:focus-visible` rule, so the table now says a keyboard user gets the browser default. Whether the header should carry a focus ring of its own, and what it should look like, is a design decision rather than a correction."},{"date":"2026-09-07","text":"Closed. Nav links now take the focus ring six other component sheets already use, `outline: .125rem solid var(--color-accent)` at `.125rem` offset, so the header stops being the one place a keyboard user gets the browser default.\n\nThe accent was chosen over `--color-header-text` because it is the house ring and the header already paints its title in the accent. The light theme is the tight case at 3.28:1, since the header background stays dark in both themes while the accent darkens."}],"links":["CUI-041"]},{"id":"CUI-049","title":"Tooltip's disabled prop still clones the trigger and attaches handlers","type":"defect","severity":"med","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"Tooltip pass, 2026-09-06","evidence":{"commits":["b7fce72"],"integrated":[],"verified":"Reverting the fix fails the new test with `expected \"error\" to not be called at all, but actually been called 1 times`, which is React warning that a function component was given a ref. It passes with the fix, 14 tests. `npm run ci` exits 0 with every gate run, 633 tests, visual:compare 94/94 at 0 differing pixels."},"resolution":null,"details":"`components/Tooltip.md:113` says that with `disabled` set, the trigger renders exactly as passed, with no handlers attached.\n\n`src/components/Tooltip.tsx:157` calls `cloneElement` unconditionally. It replaces the child's ref and wraps `onMouseEnter`, `onMouseLeave`, `onFocus` and `onBlur`. `disabled` is read only inside `show()`, at `:116`.\n\nThe tooltip never opens when disabled, so the visible behaviour is right. What is wrong is the escape hatch. A consumer whose child cannot take a ref is told that `disabled` leaves it untouched, and it does not.","notes":[{"date":"2026-09-06","text":"Found by the same review that produced CUI-032 through CUI-047, and missed when those records were written. Filed here so the review's findings are complete. Session agent confirmed every citation against the tree at 0ef7ea4."},{"date":"2026-09-06","text":"The owner chose to fix the code rather than retract the promise, because the promise is the escape hatch for a trigger that cannot take a ref and the workaround it saves is a conditional render at every call site. A ref forwarded to the Tooltip itself is not attached while disabled either, since nothing is cloned to attach it to, and the specification now says so."}],"links":["CUI-016"]},{"id":"CUI-050","title":"Dropdown's chevron is a rendered icon, not the background image its specification describes","type":"defect","severity":"low","status":"closed","foundBy":"an independent reviewer agent, one of three asked whether each component specification still describes the component that exists","opened":"2026-09-06","resolved":"2026-09-06","stint":"documentation passes, 2026-09-06","evidence":{"commits":["a4c0e11"],"integrated":[],"verified":"`Dropdown.tsx:2` imports `ChevronDown` and `:100` renders it, and `background-image` appears zero times in `dropdown.css`. `npm run check` exits 0."},"resolution":null,"details":"`components/Dropdown.md:100` says the arrow is drawn with `appearance: none` and a custom background SVG or pseudo-element. `:101` specifies a right-aligned chevron using CSS `background-image` with an inline SVG data URI.\n\n`src/components/Dropdown.tsx:100` renders a lucide `ChevronDown` as a sibling of the select. `src/styles/components/dropdown.css` has no `background-image` rule anywhere, and absolutely positions the icon instead.\n\nA consumer hiding or restyling the arrow targets a background property that does not exist, and does not expect the extra SVG node the component puts in the DOM.","notes":[{"date":"2026-09-06","text":"Found by the same review that produced CUI-032 through CUI-047, and missed when those records were written. Filed here so the review's findings are complete. Session agent confirmed every citation against the tree at 0ef7ea4."},{"date":"2026-09-06","text":"Documented as the element it is, so a consumer restyling the arrow targets the node rather than a background property that was never there."}],"links":[]},{"id":"CUI-051","title":"A validation error pushes every field below it down the page","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner (host): \"when the border gets color red, the form fields shift down because of the error messages below them. thats distracting?\"","opened":"2026-09-06","resolved":"2026-09-06","stint":"FormGroup pass, 2026-09-06","evidence":{"commits":["cd5475e"],"integrated":[],"verified":"Measured in the built preview at 1280 by 900, submitting the Form pattern with every field empty. Before: Email moved 22px, Plan 22px, Notes 48px, and the form grew from 433px to 481px. After: every field moved 0px and the form height was 477px before and after the submit. A browser test carries the guarantee, because jsdom computes no layout: reverting the change fails `src/components/FormGroup.layout.test.tsx` with `expected 106 to be 84`, the same 22px. `npm run ci` exits 0 with every gate run and 627 tests."},"resolution":null,"details":"FormGroup renders its error message in flow, below the control. The message appears only once a field is invalid, so every field below it moves down at the moment the user submits.\n\nMeasured in the built preview at 1280 by 900, submitting the Form pattern with every field empty: the Email control moves down 22px, the Plan control 22px, and the Notes control 48px. The form grows from 433px to 481px.\n\nThe Email field is the exception, and it points at the fix. Its helper text is replaced by the error rather than joined by it, so that row does not change height. A field whose message slot is always occupied does not move.\n\nThe choice is a design decision rather than a defect to fix one way. Reserving a message line under every field removes the shift and makes every form permanently taller. Reserving it only after the first submit attempt removes the shift where a user would notice it, at the cost of a rule that depends on form state. Taking the message out of flow avoids both costs and risks it overlapping the field below.\n\nThis affects every consumer of FormGroup, not only the pattern it was noticed in.","notes":[{"date":"2026-09-06","text":"Only visible since CUI-020 made the Form pattern reach its error states. Reserving space would change what the visual gate photographs for every form, so the baseline moves with whichever option wins."},{"date":"2026-09-06","text":"The owner chose reserving the slot, with helper text swapped for the error where a field has one. FormGroup already swapped, so only the reserve was missing. It uses `min-height: 1lh` at the message font size, which is exactly the line the message will occupy rather than a guess at its computed line-height: a first attempt calculated the height from the tokens and left 3px of movement. The cost is one line of height per group, and a form at rest is 44px taller."},{"date":"2026-09-06","text":"The baseline was re-recorded for six captures, all of them measured. `checkbox-group` grows from 200x172 to 200x194 in both themes, because CheckboxGroup renders a FormGroup of its own. `pattern-form` changes 0.9629% and 0.9680%. `pattern-dashboard` changes 6 pixels and 4 pixels, where that same group sits in a column that scrolls, and it never failed the 0.1% threshold. A fresh compare against the fresh baseline reports 0 differing pixels across all 94, so the renders are byte-stable and those counts are the change rather than jitter."}],"links":["CUI-020"]},{"id":"CUI-052","title":"Re-recording the baseline rewrites captures whose pixels did not change","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while re-recording the baseline for CUI-040","opened":"2026-09-06","resolved":"2026-09-07","stint":"visual gate pass, 2026-09-07","evidence":{"commits":["348e80e","054f957"],"integrated":[],"verified":"Removing the Table's card background, which the gate previously reported as 0 differing pixels, now fail
