s it: `table.png` at 352273 pixels or 94.73%, `pattern-data-table.png` at 658876 or 57.34%, in both themes. The same run also fails on 7 and 10 pixel differences in the master-detail captures, which the old 250 pixel floor discarded. The tightened gate passes the current tree unchanged at 104/104 with 0 differing pixels, and `npm run ci` exits 0 with every gate run."},"resolution":null,"details":"`npm run visual:capture` rewrote 17 of the 94 captures for a change that affected two components. Measured against the committed versions, `code-block` changed 1.82% and 1.79% of its pixels and `mermaid-diagram` 0.53% and 0.64%. The other 13 differed by 0 pixels at the threshold the gate itself uses.\n\nRestoring those 13 leaves `visual:compare` at 94 of 94 with 0 differing pixels, so they carry nothing the gate can see. Running `visual:capture` again rewrites all 17 once more, so this is reproducible rather than one bad run.\n\nThe cost is review. CONTRIBUTING asks that an intentional visual change be reviewed in both themes, and 13 files of noise around 4 real ones makes that harder than it needs to be. Writing a capture only when it differs from the committed one would fix it.\n\nWhat has not been established is why the bytes differ when the pixels do not. It could be encoder nondeterminism or a colour delta below the comparison threshold, and the two want different fixes.","notes":[{"date":"2026-09-07","text":"The cause in `details` is wrong, and so is the word churn. There is no nondeterminism: two captures of the same commit produce 104 byte-identical images, measured across every file in both themes. Every capture the recorder rewrites is a change the code actually makes."},{"date":"2026-09-07","text":"What is really happening is that the comparison tolerates changes the recorder records, and by a wide margin. `visual:compare` reported 0 differing pixels for a `table.png` in which 358109 of 371856 pixels had moved about 12 per channel, the whole table body repainting from the page grey to its own card background. pixelmatch weighs a perceptual distance against a threshold of 0.1, roughly a tenth of the maximum, and a shift of 12 in 255 sits under it however many pixels it covers.\n\nSo the gate is blind to a uniform colour change of that size. A token repointed, a surface recoloured or a theme drifting would pass. That is a bigger question than the diff noise this record was filed about, and it is the one worth answering."},{"date":"2026-09-07","text":"This also cost something. Twice in this session the zero-diff files from a re-record were restored on the reasoning that they carried no change, which discarded real renderings and left the committed baseline disagreeing with the code. Twenty captures were stale by the time it was measured, and are re-recorded in 348e80e. Reading a tolerant comparison as proof of equality is what caused it, and it is the same mistake in both directions: it hid the drift and it hid the Table background's effect."},{"date":"2026-09-07","text":"Closed by making the comparison exact rather than by chasing the churn it was filed about. The threshold's blind spot was measured on synthetic surfaces: at pixelmatch 0.1 a uniform shift is ignored up to 26 in 255 on mid grey, and across the whole remaining range on a near-white surface, regardless of how many pixels carry it. The same case at threshold 0 counts 100% of them.\n\nThe ratio and the 250 pixel floor went too. Both existed to absorb noise, and the image produces none: 104 captures byte identical across two runs, and a third against the committed baseline."},{"date":"2026-09-07","text":"One risk is not settled by anything measured here. Determinism was established in this container on this machine, and CI runs the same image on a different one. If its renderer differs at all, every capture fails on the first run there. Nothing has been pushed, so it has not been tested. The fallback if that happens is a small pixel floor rather than a return to the perceptual threshold, which is the part that hid colour."}],"links":["CUI-040"]},{"id":"CUI-053","title":"The render image is pinned by tag, and a tag can be rebuilt under it","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, while verifying the repository owner's condition that CI pins the image the visual gate renders in","opened":"2026-09-07","resolved":"2026-09-07","stint":"render image pass, 2026-09-07","evidence":{"commits":["3f4f24f"],"integrated":[],"verified":"`npm run test:render-image`: 7 tests pass. End to end, replacing the recorded digest with a zeroed one makes `npm run visual:compare` exit 2 before it renders anything, printing \"mcr.microsoft.com/playwright:v1.62.1-noble is not the image the baseline was drawn by\" above both the recorded and the present digests. Deleting the record exits 2 pointing at `visual:capture`. Left alone, `npm run ci` exits 0 with the visual gate reporting 104/104 compared screenshots and 0 differing pixels."},"resolution":null,"details":"The visual gate renders inside a container image, and picks it by reading the installed package rather than a constant. `scripts/visual-container.mjs` builds the tag as `mcr.microsoft.com/playwright:v${version}-noble` from `playwright/package.json`, and `package-lock.json` pins `playwright` to 1.62.1. So `npm ci` on any machine resolves the same version, and the tag follows it. There is no second place to keep in step, which is the good half of this design: bumping the package moves the image with it and the two cannot drift apart.\n\nThe half that is missing is that a tag is mutable. `v1.62.1-noble` names whatever Microsoft last published under it, not a fixed set of bytes. Rebuilding that tag on a newer base, which vendors do for security updates, can change the font packages inside it. The digest here at the time of writing is sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e, and nothing in the repository records or checks it.\n\nThe consequence is worth being concrete about. The baseline is a set of pixels drawn by the Chromium and the fonts inside that image, and the comparison now fails on any difference at all. If the tag is rebuilt, a run pulls a different image, the text rasterises differently, and every one of the 104 captures fails at once. Nothing in the repository would explain why, because the version, the lockfile and the tag would all be unchanged. The likely reading of that failure is that something in the branch broke everything, which is the wrong place to look.\n\nTwo ways out, and they trade against each other. Pinning by digest, `mcr.microsoft.com/playwright@sha256:...`, makes an upstream rebuild fail the pull rather than the pixels, at the cost of two things to update on a playwright bump instead of one. Recording the digest and comparing it before rendering keeps the single source of truth and turns the same event into a clear message rather than 104 failures.\n\nNeither is urgent. This is a latent trap rather than a defect, filed so that whoever meets a wholesale capture failure recognises it in minutes rather than hunting through their own diff.","notes":[{"date":"2026-09-07","text":"Filed at the owner's request while settling CUI-052, which dropped the comparison to zero tolerance. That change is what turns an image rebuild from a quiet drift into a loud one, so this became worth writing down at the same time. The loudness is the improvement; the missing part is a message that names the cause."},{"date":"2026-09-07","text":"Closed by recording the digest and checking it, rather than by pinning the image to one. Pinning would make an upstream rebuild fail the pull, which is equally loud but reports a registry error rather than a cause, and it adds a second thing to update on a playwright bump. The recorded digest keeps the lockfile as the single source of truth.\n\nA tag can carry two digests, the manifest list's and the platform manifest's, and the two engines report different ones: podman reports both for this tag, docker one. So the record keeps every digest it was shown and a match is an intersection, which holds across engines and across architectures."}],"links":["CUI-052"]},{"id":"CUI-054","title":"CONTRIBUTING asks for a 72 column commit body, and no gate checks it","type":"improvement","severity":"low","status":"closed","foundBy":"repository owner (host), asking whether the branch's commit messages match CONTRIBUTING","opened":"2026-09-07","resolved":"2026-09-07","stint":"commit rules pass, 2026-09-07","evidence":{"commits":["f9c7a85","d95d6ed"],"integrated":[],"verified":"`npm run test:commits`: 6 tests pass over the wrap measurement. Across the whole branch the checker finds 29 of 119 commits over 72 columns and nothing else, which is what the audit that produced this record found independently. Landing a real commit with a 106 column body makes `npm run lint:commits` exit 1 naming the sha and the column count, and the `commit-msg` hook refuses the same message before the commit exists. `npm run ci` exits 0 reporting `commits: 2 commits since 58668d6, all wrapped at 72`, and `actionlint` passes on the workflow step that runs it."},"resolution":null,"details":"`CONTRIBUTING.md` says to wrap a commit body at 72 columns. Twenty-nine of this branch's 93 commits have a body line over it: 22 at 73 columns, four at 74, one at 76 and two at 77. Measured with `git log main..HEAD --format=%b`, ignoring the `Co-Authored-By:` trailer.\n\n`cs-lint oss` passes on every one of them. So the rule is documented and ungated, which is the class this branch was opened to find, in the commit messages rather than in the code.\n\nThe history is not worth rewriting for it. Nothing is pushed, so a rebase could reach all 29, but that rewrites most of a branch to move a line by one character. The useful fix reaches the next commit instead, either as an `oss` rule or as a check in `npm run ci`.\n\nOne caution for whoever writes it. The subject rule, the trailer rule and the body word and paragraph limits all pass today, so a checker that reports those as violations has a bug in it rather than a finding.","notes":[{"date":"2026-09-07","text":"Closed with a gate rather than a rewrite, and the reason is stronger than the one this record gave. It argued the history was not worth rewriting for a character. The real obstacle is that the ledger cites sixty of those commits by sha, seventy-one citations across fifty-four records, and a closed record has to cite a sha that exists. A rebase would dangle all of them.\n\nSo the rule is checked from a baseline commit forward. The whole Commits section is covered rather than the wrap alone, because the other rules were equally ungated and held only by care: subject length, capitalisation, trailing stop, category prefix, the kept trailer, and the body's paragraph and word limits.\n\nThe audit that produced this record reported two false positives, on prose lines beginning `context:` and `scrollbar:`. A trailer block is the last thing in a message and its keys are capitalised, and a test holds the checker to that."},{"date":"2026-09-07","text":"Two corrections to the first attempt, both from the owner asking how the gate was built.\n\nIt re-implemented rules that already run. `cs-lint oss` carries the subject rules in OSS-702, the session-link rule in OSS-701 and the body length rule in OSS-711, and it runs both inside `npm run check` and as its own CI job. Only the 72 column wrap is missing from it. The checker is now that one rule, 47 lines shorter, and the rest is left where it already was.\n\nIt also ran nowhere but a contributor's machine. `.github/workflows/ci.yml` never invokes `npm run ci`: it runs `npm run check` and one job per linter. A gate added to `ci.mjs` alone is invisible to the forge, and it quietly broke that file's own claim to mirror the workflow. The step now runs in the readiness job, beside the other history rules.\n\nThe durable home is an OSS rule in cs-lint, where every project in the family would get it. That binary lives in another repository, so this stays a local stand-in."}],"links":[]},{"id":"CUI-055","title":"The visual gate flakes on three pixels of corner antialiasing","type":"defect","severity":"low","status":"open","foundBy":"session agent, while re-recording the dashboard captures for CUI-024","opened":"2026-09-07","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`visual:compare` reported `dark/card-group.png` at 3 differing pixels on one run and at 0 on the next, with the working tree byte for byte the same. The three sit at (973, 378), (973, 379) and (972, 380), the bottom right corner of the last card, and each is one unit on one or two channels: `16,21,26` against `17,22,27`.\n\nIt is rare. Eleven runs of the same container on the same machine produced it once. It did not reproduce in five clean-tree runs, and appeared once in six runs with an unrelated change to the dashboard demo applied.\n\nThis matters because the comparison allows no difference at all, which CUI-052 justified on the ground that runs in this image are deterministic to the pixel. That was measured as 104 byte-identical captures across two runs, and eleven runs are enough to see that it is not quite true. A gate that fails once in ten runs for no reason teaches a reader to re-run it, which is the habit that lets a real failure through.\n\nWhat is not established is the cause. A one-unit shift at a rounded corner is where a rasteriser rounds, and whether that turns on compositing timing or on something in the page is unmeasured. The fallback CUI-052 already names is a small pixel floor rather than a return to the perceptual threshold, and a floor of a handful of pixels would absorb this while still failing on the 20 pixel change that the `wrap: true` fix in CUI-027 produced. Whether to spend that headroom is the open question.","notes":[{"date":"2026-09-07","text":"The same failure reproduces on `dark/interaction-split-pane-drag.png`, and far more often than the eleven runs this record started from. It is bistable rather than random. Two renderings alternate, and `npm run visual:compare` returned one or the other with the working tree unchanged.\n\nThe eight differing pixels sit at x=972 and x=973, on the top right and the bottom right corner, at one or two units per channel. That is the signature this record already describes for `card-group`, at the same x.\n\nRe-recording is the hazard worth naming. A `visual:capture` run recorded the minority rendering, after which the gate failed two runs in three. Restoring that one file from the previous commit put the majority rendering back, and it failed one run in four. A baseline refresh can land on the wrong side of the pair, and turn a rare flake into a near permanent failure."},{"date":"2026-09-07","text":"Better numbers, and they are worse than this record assumed. `dark/interaction-split-pane-drag.png` failed 8 of 14 comparison runs, with its baseline byte-identical to the committed one and the working tree unchanged between runs.\n\nThe rate does not depend on the pointer position added in CUI-062. Removing that line gave 4 failures in 6 runs, against 4 in 8 with it, so the pointer is not what decides it.\n\nThe eight pixels are the class this record already describes. They sit at x=972 and x=973, on the top right and the bottom right corner, at one or two units per channel.\n\nA capture that fails half its runs is not a rare flake. `npm run ci` on this branch passes on roughly every second attempt, which is the habit this record warns about arriving in full."},{"date":"2026-09-07","text":"The cause of the split pane instance is that the capture depended on what the run had done before it. A probe rendering the same element in the same image, hashing each result, produced three different images for one drag. A fresh page gave one, the modal round trip gave a second, and the tree interaction gave a third. Only the third varied between runs, and it was the one this capture was taking.\n\nThe geometry was never fractional, which was the first hypothesis. The element measured 974 by 190 at x=233 with a device pixel ratio of 1 on every trial.\n\nThe drag now runs on a page of its own, in 84ffb5c. That capture failed 8 comparison runs of 14 before the change and none of 10 after it. The same change let axe evaluate colour contrast on the components page, which the drag had been making it skip with a grid bounds error, so the rule count rises by one.\n\nWhat this does not settle is the `dark/card-group.png` instance the record opened with. That capture is taken in the component loop rather than after an interaction, and 30 plain element screenshots destabilised nothing across 8 trials. It has not reproduced in roughly 30 runs today, so the record stays open on an instance nobody can currently make happen."},{"date":"2026-09-07","text":"Two things would close this record, and choosing between them is a judgement rather than a measurement.\n\nThe first is reproducing `dark/card-group.png` and finding its cause. The second is deciding that an instance absent from about 30 runs is stale, and closing it as `wont-fix` with that reason.\n\nToday's evidence leans to the second. Across 8 clean runs, 880 capture comparisons produced no difference anywhere but the split pane. That is a reason to suspect the same history dependence rather than a separate cause. Suspicion is not a finding, so the record waits on someone's call rather than closing on mine."}],"links":["CUI-052","CUI-062"]},{"id":"CUI-056","title":"A tooltip near the right edge of the window is squeezed to one character per line","type":"defect","severity":"med","status":"closed","foundBy":"repository owner (host), reading the preview: the tooltip to expand a panel is very narrow and wrapped","opened":"2026-09-07","resolved":"2026-09-07","stint":"nav sidebar pass, 2026-09-07","evidence":{"commits":["3a8b97e"],"integrated":[],"verified":"`npx vitest run --project browser src/components/Tooltip.placement.test.tsx`: 4 tests pass. Measured before the fix, a Card's maximize control at x=1401 in a 1440px viewport gave a bubble 30px wide and 496px tall against 268x28 for the same string in the middle of the page. Three targeted reverts each fail the test that covers them: dropping `width: max-content` fails at `expected 30 to be 268`, dropping the horizontal correction fails at `expected -111.484375 to be greater than or equal to 7`, and dropping the flip leaves `data-side` at `top` against `bottom`. `npm run ci` exits 0 with the visual gate unchanged at 0 differing pixels."},"resolution":null,"details":"A tooltip is `position: fixed` and was positioned with `left` alone. A fixed box laid out from `left` gets only the space between that point and the right edge of the viewport, so its shrink-to-fit width is capped by whatever is left. A Card's maximize control sits 39px from the right edge on every page, and its 44 character tooltip measured 30px wide and 496px tall: one character per line, and mostly above the top of the screen.\n\n`components/Tooltip.md` said so, in the sense that it carried a paragraph headed \"No collision detection\" and told a consumer to choose `side` for the space available. What it did not say is that a trigger near an edge does not merely clip, it reshapes the bubble into a column of single letters. Nothing in the kit chooses `side` per position, and the components that place a control at the right of a header cannot.\n\nThe same bubble in the middle of the page measured 268x28, so the defect only appears where a control actually lives.","notes":[{"date":"2026-09-07","text":"Fixed rather than documented, because there is no `side` a consumer could have chosen: the bubble was reshaped by its position, not just moved. `width: max-content` takes the size out of the position, and the component measures itself once open, shifting to keep 8px clear horizontally and flipping to the other side of the trigger vertically.\n\nOne thing the first attempt got wrong is worth recording. The correction ran unguarded, and every rect is zero in an environment without layout, so a zero box read as off the left edge and the effect corrected it forever. Three Card tests failed with `Maximum update depth exceeded`. A measurement pass has to refuse to act on a measurement it did not get."}],"links":["CUI-016"]},{"id":"CUI-057","title":"Sizing a sidebar to its content has three answers, and nothing says which one applies","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["2de8103"],"integrated":[],"verified":"Section 7.11 of `DESIGN_SYSTEM_SPEC.md` carries the three cases in one table, and `Tree.md`, `Panel.md` and `SectionedTree.md` link to it rather than each restating a third. The numbers come from `src/components/Tree.sizing.test.tsx`, which measures a 200px scrolling column holding two lists of twenty rows: a bare tree reports 400px of scrollHeight at the default against 1160px with `scroll={false}`, a panel with `height=\"auto\"` reports 1272px either way, and SectionedTree reports 1250px. Those match the figures this record opened with. Flipping Tree's `scroll` default to false fails the first test, and the restore is byte-identical. `npm run ci` exits 0 at 2de8103."},"resolution":null,"details":"Building a nav sidebar meant asking one question: how do I stop this column scrolling inside itself so the page can scroll once? It has three different answers, and which one is right depends on what sits between the tree and the scroller.\n\nMeasured across six compositions in a 200px scrolling column, each holding two lists of 20 rows:\n\n- `Panel height=\"auto\"` wrapping a `Tree`: works, and `Tree scroll` changes nothing. Both settings gave 1272px of scrollHeight.\n- A bare `Tree`: needs `scroll={false}`. The default gave 400px of scrollHeight for 1160px of tree, with each tree clamped to 200px and its rows spilling out of a box nothing scrolls.\n- `SectionedTree`: needs neither. It gave 1368px either way, because it never hands a section a definite height.\n\nA consumer cannot tell these apart by reading. The reason is a CSS rule nobody has to know until it bites them: a percentage height resolves to auto against a parent whose height is indefinite, so a Panel sized to its content silently fixes the tree inside it.\n\nTwo smaller traps came with it. `Tree scroll` is named after `window.scroll`, so leaving it out of the destructuring made it a function rather than a boolean: TypeScript caught that in `SectionedTree` and would have let `if (scroll)` pass as always true in `Tree`. And the half-right version of the override fails quietly, at 780px of scrollHeight for 1160px of tree, with the missing rows reachable by `scrollIntoView` and by nothing a user does.\n\nThe fix is probably a decision table in one place rather than more API. `components/Tree.md` now says a tree inside a panel needs no `scroll` of its own, which is one third of it.","notes":[{"date":"2026-09-07","text":"One measurement in this record was not reproduced. The half-released override that reported 780px for 1160px of tree comes from overriding `max-height` and `overflow` by hand, rather than from any combination of props, so a test cannot reach it through the component. Section 7.11 states the hazard without the number instead of quoting a figure nothing checks.\n\nThe fix stayed documentation, at the owner's decision. Renaming `scroll` would fix the trap it shares with `window.scroll` and break every consumer, so the table records the trap and the prop keeps its name."}],"links":["CUI-011","CUI-014"]},{"id":"CUI-058","title":"Nothing says who supplies the padding around a CardGroup, so a page bleeds to the window edge","type":"defect","severity":"low","status":"closed","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["397f03f"],"integrated":[],"verified":"`components/CardGroup.md` now says the inset belongs to the page container rather than to the group, and gives the reason: a page built from a table needs the same inset, and two nested groups would otherwise inset twice. Its compiling example composes the group inside a `Page`, and `npm run docs:compile` type-checks that example against the published entry point. `npm run ci` exits 0 at 397f03f."},"resolution":null,"details":"The first version of the nav sidebar page ran from the left edge of the window to the right, with no inset and no rounded corners, so its cards did not read as cards. Every other pattern page insets by `var(--space-4)`.\n\nThe reason is that the padding comes from the demo's own root element. `preview/src/pages/patterns/ExplorerDemo.tsx` puts it there, and so does the dashboard's. Neither `Card` nor `CardGroup` supplies it, and neither specification mentions it.\n\nSo the composition a consumer copies out of `components/CardGroup.md` produces a page that looks wrong, and the fix is a property on an element that is not part of the kit. The repository owner spotted it immediately and could not say what the difference was, which is the point: nothing names it.\n\nEither `CardGroup` should own the inset, or the specification should say the consumer does and show it. The first is a visual change to every existing page, so this is a decision rather than a correction.","notes":[{"date":"2026-09-07","text":"The decision went to neither option this record offers. The inset belongs to a page container rather than to `CardGroup`, because five of the eleven pattern demos use `CardGroup` and a page built from a table or a form bleeds the same way. Section 2 of `DESIGN_SYSTEM_SPEC.md` already names that container as the `page` layout mode and ships nothing for it, which is filed as CUI-061. This record is one instance of that gap. It closes when the container lands and `components/CardGroup.md` says who supplies the inset."}],"links":["CUI-061"]},{"id":"CUI-059","title":"A bounded ancestor loses content silently, and only this repository can see it","type":"improvement","severity":"med","status":"open","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The nav sidebar page failed `visual:capture` with `the nav-sidebar pattern hides content a pointer cannot reach — div hides 403px`. The element was the preview's own wrapper, which is `overflow: hidden` and bounded, and the fix was for the demo to own a scroller. Finding out which element it was took instrumenting the gate to print the class name, because the message names a `div`.\n\nA consumer gets no message at all. They embed a component in their own bounded layout, the content overflows an ancestor that clips without scrolling, and the rows below the fold are reachable by `scrollIntoView` and by nothing a user does. That is the same failure CUI-011 describes and the same one that hid 1701px of a tree in this repository's own Explorer.\n\n`scripts/visual-baseline.mjs` has the check and it is nine lines: walk the tree, find boxes whose `scrollHeight` exceeds their `clientHeight` while `overflow-y` is neither visible nor scrollable, and report them. `src/lib/stylesheetWarning.ts` already shows there is a place to put a development-only warning that ships.\n\nTwo things to settle before writing it. It has to measure after layout rather than at render, and it must not run in production, which is the trap the stylesheet warning met in CUI-006, where a guard on `import.meta.env.DEV` compiled to an empty function in the published build while every test passed.","notes":[],"links":["CUI-006","CUI-011"]},{"id":"CUI-060","title":"SectionedTree renders two expand-all controls with the same label and configures only one","type":"defect","severity":"low","status":"open","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`SectionedTree` renders a control above the sections reading `Collapse all`, and gives each section's `Tree` another that reads `Collapse all` too. `expandAllControl` turns off the second kind and not the first, and neither the prop's name nor `components/SectionedTree.md` says so.\n\nTwo consequences, both met while building the nav sidebar pattern. A reader looking at the rendered page cannot tell which control `expandAllControl` governs. And a test asserting `queryAllByRole(\"button\", { name: /expand all/i })` is empty passes whether the prop works or not, because the surviving control reads `Collapse all` while the sections are open. That assertion was written in this session and had to be replaced with a count.\n\nThe sections control also has no prop of its own, so a sidebar that does not want it cannot remove it.\n\nThe smallest honest fix is to name them differently in the DOM, through distinct accessible names or a `data-part`, and to say in the specification which one `expandAllControl` reaches. Giving the sections control its own prop is the larger version.","notes":[],"links":["CUI-004"]},{"id":"CUI-061","title":"The page layout mode is specified with padding, and nothing implements it","type":"defect","severity":"med","status":"closed","foundBy":"session agent, laying out the options for CUI-058 at the owner's request","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["aa08dac","31cefa3"],"integrated":[],"verified":"`Page` exports from `src/index.ts` and `components/Page.md` specifies it, so section 2's table names something the package ships. 17 tests cover the inset, the width and the scroll, and each rule was verified by reverting it: five reverts produced five failures, and the restore was byte-identical. The preview's four pages take all three from it in 31cefa3, after which `npm run visual:compare` reported 105 of 110 captures byte-identical. The four that moved are the `Page` demo and the two `modal` captures that photograph it; the fifth is CUI-055. `npm run ci` exits 0 at 397f03f."},"resolution":null,"details":"Section 2 of `DESIGN_SYSTEM_SPEC.md` lists three layout modes a feature may use inside the shell. The row for `page` reads \"Centered max-width container with padding\". Nothing in the package provides one. There is no component, no class and no token for a page container.\n\nThe sentence below that table hands the job to the consumer, and it covers width alone: \"Each page's content area is responsible for applying its own width constraints\". The padding the table promises is never assigned to anyone.\n\nThe preview shows what follows. Sixteen selectors in `preview/src/preview.css` set a `--space-4` padding on a pattern demo's root. Several demos carry it at two depths at once, `explorer-demo-11` alongside `explorer-demo-19`, and `master-detail-demo-17` alongside `master-detail-demo-190`. A comment in that file explains to the next reader that this padding is what makes the pages read as cards.\n\nThree properties belong to a page container, and none of them has an owner. The inset from the window edge, the maximum width, and which element scrolls. The third is the expensive one: when no ancestor owns the scroll, content is clipped and unreachable, which is the failure the hidden Explorer tree recorded in CUI-011.\n\nOne more measurement bears on the fix. `scrollbar-gutter: stable` reserves the scrollbar's space so nothing shifts when it appears. It is used once in the repository, at line 62 of `src/styles/components/event-lanes.css`, and is named in no specification. A container that owns the scroll should carry it, and the design system should say so.","notes":[{"date":"2026-09-07","text":"One approach was tried and removed, because a later reader would otherwise try it again. The cap was first a centred box inside the page, which is the obvious way to keep the scrollbar at the window edge. With that box in place the visual gate lost six captures: `pattern-chart-scrolled`, `pattern-dashboard-scrolled` and `pattern-markdown-viewer-scrolled` in both themes.\n\nThe box gave the pages inside it a height to resolve against that no longer bounded them, so a page laid out with `height: 100%` grew to its content and the demo area inside it stopped scrolling. That is the class of failure CUI-057 records. The cap is side padding that grows instead, which leaves the children as the page's own children.\n\nThe gate caught this through its manifest check rather than through any pixel comparison. A unit test written for it afterwards could not fail, because reinstating a wrapper in isolation still resolved the height."}],"links":["CUI-058","CUI-057","CUI-059","CUI-011"]},{"id":"CUI-062","title":"The visual gate photographs whatever the mouse was last left over","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while adding a Page section to the components page","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["42ba5b4"],"integrated":[],"verified":"Measured against the baseline at aa08dac with one working tree: `interaction-tree-arrow-navigation.png` differed by 7485 pixels in the light theme and 7483 in the dark before the fix, and by 32 and 30 after it. Two `npm run visual:capture` runs with nothing changed between them produced byte-identical files, so the difference was the pointer rather than noise. `npm run ci` exits 0 at 645a59e."},"resolution":null,"details":"`scripts/visual-baseline.mjs` clicks Open Modal to photograph the dialog, and Playwright leaves the real pointer where it clicked. Every capture taken after that point photographs whatever then sits under it.\n\nAdding one section to the components page moved a `Tree` row under that pointer. `interaction-tree-arrow-navigation.png` then differed by 7541 pixels, and none of it was a Tree change. The row had gained `--color-row-hover`, which is `rgba(0, 0, 0, 0.04)` in the light theme. That shifts a light row by 4 to 15 units per channel, which is the magnitude the diff measured.\n\nThe gate allows no difference at all, so a capture like that has to be re-recorded before a run passes. A reviewer reading the diff sees a Tree that moved. The cause is a pointer nobody moved away.\n\nParking the pointer at the top left corner before the tree interaction drops the same capture to 32 differing pixels, which is antialiasing from the section added above it.","notes":[],"links":["CUI-055"]}],"drafts":[],"queue":{"recommendedBy":"session agent, after the sizing table landed","updated":"2026-09-07","items":[{"id":"CUI-059","why":"A consumer loses content to a clipping ancestor with no message at all; the check already exists here."},{"id":"CUI-060","why":"Two controls with one label, and a prop that reaches one of them."},{"id":"CUI-055","why":"What blocked is fixed; what is left is one capture nobody has reproduced since, so it waits."}]},"description":"@codesweep-ai/ui is a library of React components and design tokens for agent and LLM interfaces. This ledger tracks its defects, improvements and ideas.","commitUrlTemplate":null,"derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"CUI-001":"2026-09-06","CUI-002":"2026-09-06","CUI-003":"2026-09-06","CUI-004":"2026-09-06","CUI-005":"2026-09-06","CUI-006":"2026-09-06","CUI-007":"2026-09-06","CUI   function enrich(r, isDraft) {
    r._draft = !!isDraft;
    r._idea = !isDraft && r.type === 'feature-idea' && r.status === 'open';
    r._terminal = !!TERMINAL[r.status];
    r._last = DERIVED.lastActivity[keyOf(r)] || '';
    r._age = r._last ? Math.floor((TODAY - new Date(r._last + 'T00:00:00')) / 86400000) : 0;
    r._stale = STALE > 0 && !r._terminal && r._age > STALE;
  }
  recs.forEach(function (r) { enrich(r, false); });
  drafts.forEach(function (d) { enrich(d, true); });
  var byKey = {};
  recs.concat(drafts).forEach(function (r) { byKey[keyOf(r)] = r; });

  var QUEUE = (DATA.queue && Array.isArray(DATA.queue.items)) ? DATA.queue : null;
  var qRank = {};
  if (QUEUE) QUEUE.items.forEach(function (it, i) {
    if (it && it.id && !(it.id in qRank)) qRank[it.id] = { rank: i + 1, why: it.why || '' };
  });

  // Since-last-visit: read the previous visit date, stamp today's. Client-side
  // only — the rendered HTML stays a deterministic function of the records.
  // Key is namespaced BY PROJECT: localStorage is per-origin, and two ledgers
  // served from one host must not share a visit stamp. Theme stays shared
  // deliberately — one person, one preference.
  var VISIT_KEY = 'ledger-last-visit:' + (DATA.project || '');
  var prevVisit = null;
  try {
    prevVisit = localStorage.getItem(VISIT_KEY);
    localStorage.setItem(VISIT_KEY,
      new Date(TODAY.getTime() - TODAY.getTimezoneOffset() * 60000).toISOString().slice(0, 10));
  } catch (e) { /* file:// may block storage */ }
  var newCount = 0;
  recs.concat(drafts).forEach(function (r) {
    r._new = !!(prevVisit && r._last && r._last > prevVisit);
    if (r._new) newCount++;
  });

  var state = {
    view: (function () {
      var m = /[?&]view=(list|board|activity|brief)\b/.exec(location.search);
      return m ? m[1] : 'brief';
    })(),
    newOnly: false, q: '', status: 'all',
    types: { 'defect': 1, 'improvement': 1, 'feature-idea': 1 },
    sevs: { 'critical': 1, 'high': 1, 'med': 1, 'low': 1 },
    staleOnly: false, groupBy: 'status', sort: 'id',
    collapsed: { 'closed': 1, 'retired': 1, 'bl-done': 1 }
  };

  function sevHtml(s) {
    var lbl = s === 'critical' ? 'crit' : s;
    return '<span class="sev sev-' + s + '" title="severity: ' + s + '"><i></i>' + lbl + '</span>';
  }
  function tagHtml(t) {
    return '<span class="tag tag-' + t + '">' + (t === 'feature-idea' ? 'idea' : t) + '</span>';
  }

  // ---- sparkline (found vs fixed, cumulative)
  function sparkline() {
    var el = $('#spark');
    if (!el) return;
    var perDay = DERIVED.daily, d0 = DERIVED.firstEventDate;
    if (!d0) { el.innerHTML = ''; return; }
    var today = new Date(TODAY.getTime() - TODAY.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (today < d0) today = d0;
    var days = [];
    var t = new Date(d0 + 'T00:00:00Z').getTime();
    var end = new Date(today + 'T00:00:00Z').getTime();
    for (; t <= end; t += 86400000) days.push(new Date(t).toISOString().slice(0, 10));
    var BW = 8, BARW = 6, H = 46, P = 3;
    var max = 1;
    days.forEach(function (d) { var c = perDay[d]; if (c && c.f + c.x > max) max = c.f + c.x; });
    var W = days.length * BW;
    var unit = (H - 2 * P) / max;
    var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="daily found and resolved, ending today">';
    var pts = [];
    days.forEach(function (d, i) {
      var c = perDay[d] || { f: 0, x: 0 };
      pts.push({ date: d, f: c.f, x: c.x });
      var y = H - P;
      var fh = c.f * unit, xh = c.x * unit;
      if (fh > 0) { svg += '<rect class="barf" x="' + (i * BW + 1) + '" y="' + (y - fh) + '" width="' + BARW + '" height="' + fh + '"></rect>'; y -= fh; }
      if (xh > 0) { svg += '<rect class="barx" x="' + (i * BW + 1) + '" y="' + (y - xh) + '" width="' + BARW + '" height="' + xh + '"></rect>'; }
    });
    svg += '<line class="todayl" x1="' + (W - 1) + '" x2="' + (W - 1) + '" y1="0" y2="' + H + '"></line>';
    svg += '<line class="basel" x1="0" x2="' + W + '" y1="' + (H - P + 0.5) + '" y2="' + (H - P + 0.5) + '"></line></svg>';
    el.innerHTML = svg;
    el.scrollLeft = el.scrollWidth;
    var tip = $('#ctip');
    var svgEl = el.querySelector('svg');
    svgEl.addEventListener('mousemove', function (ev) {
      var rect = svgEl.getBoundingClientRect();
      var i = Math.max(0, Math.min(days.length - 1, Math.floor((ev.clientX - rect.left) / BW)));
      var pt = pts[i];
      tip.style.display = 'block';
      tip.style.left = (ev.clientX + 12) + 'px';
      tip.style.top = (ev.clientY - 12) + 'px';
      tip.innerHTML = '<b>' + pt.date + '</b><br>' + pt.f + ' found · ' + pt.x + ' resolved';
    });
    svgEl.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
  }

  // ---- filtering / grouping
  function pass(r, ignoreStatus) {
    if (!ignoreStatus && state.status !== 'all') {
      if (state.status === 'open' && !(r.status === 'open' && !r._idea && !r._draft)) return false;
      if (state.status === 'in-progress' && r.status !== 'in-progress') return false;
      if (state.status === 'closed' && r.status !== 'closed') return false;
      if (state.status === 'ideas' && !r._idea) return false;
      if (state.status === 'drafts' && !r._draft) return false;
      if (state.status === 'retired' && !(r.status === 'wont-fix' || r.status === 'moved-to-roadmap')) return false;
    }
    if (!state.types[r.type]) return false;
    if (!state.sevs[r.severity]) return false;
    if (state.staleOnly && !r._stale) return false;
    if (state.newOnly && !r._new) return false;
    if (state.q) {
      var hay = keyOf(r) + ' ' + (r.title || '') + ' ' + (r.details || '') + ' ' + (r.foundBy || '');
      (r.notes || []).forEach(function (n) { hay += ' ' + n.text; });
      if (hay.toLowerCase().indexOf(state.q.toLowerCase()) < 0) return false;
    }
    return true;
  }

  function groupsFor(items) {
    var gs = [];
    if (state.groupBy === 'status') {
      [
        { key: 'in-progress', label: 'In progress', f: function (r) { return r.status === 'in-progress'; } },
        { key: 'open', label: 'Open', f: function (r) { return r.status === 'open' && !r._idea && !r._draft; } },
        { key: 'drafts', label: 'Drafts — unfiled (member branches)', f: function (r) { return r._draft; }, cls: 'ideas' },
        { key: 'ideas', label: 'Ideas / roadmap', f: function (r) { return r._idea; }, cls: 'ideas' },
        { key: 'closed', label: 'Closed', f: function (r) { return r.status === 'closed'; } },
        { key: 'retired', label: 'Retired (wont-fix · moved-to-roadmap)', f: function (r) { return r.status === 'wont-fix' || r.status === 'moved-to-roadmap'; } }
      ].forEach(function (b) {
        var it = items.filter(b.f);
        if (it.length) gs.push({ key: b.key, label: b.label, items: it, cls: b.cls || '' });
      });
    } else if (state.groupBy === 'stint') {
      var m = {};
      items.forEach(function (r) { var k = r.stint || 'unassigned'; (m[k] = m[k] || []).push(r); });
      Object.keys(m).sort().forEach(function (k) {
        gs.push({ key: 'st-' + k, label: k === 'unassigned' ? 'No stint' : 'Stint ' + k, items: m[k], cls: '' });
      });
    } else {
      ['defect', 'improvement', 'feature-idea'].forEach(function (t) {
        var it = items.filter(function (r) { return r.type === t; });
        if (it.length) gs.push({ key: 't-' + t, label: t, items: it, cls: t === 'feature-idea' ? 'ideas' : '' });
      });
    }
    return gs;
  }

  var SEVORD = { critical: 0, high: 1, med: 2, low: 3 };
  function cmp(a, b) {
    if (state.sort === 'sev') { var d = SEVORD[a.severity] - SEVORD[b.severity]; if (d) return d; }
    if (state.sort === 'date' && a._last !== b._last) return a._last < b._last ? 1 : -1;
    var ka = keyOf(a), kb = keyOf(b);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  }

  function staleHtml(r) {
    return r._stale ? '<span class="stale" title="no activity for ' + r._age + ' days">stale ' + r._age + 'd</span>' : '';
  }


  function detailHtml(r) {
    var h = '<div class="detail">';
    if (r.details) h += '<div class="dlbl">details</div><div class="prose">' + mdToHtml(r.details) + '</div>';
    if (r.notes && r.notes.length) {
      h += '<div class="dlbl">notes</div>';
      r.notes.forEach(function (n) {
        h += '<div class="note"><div class="d">' + esc(n.date) + '</div><div class="prose">' + mdToHtml(n.text) + '</div></div>';
      });
    }
    if (r.resolution) h += '<div class="dlbl">resolution</div><div class="prose">' + mdToHtml(r.resolution) + '</div>';
    var ev = r.evidence || {};
    // commitUrlTemplate (ledger.json, optional): shas become links; absent
    // template keeps plain mono text. Template is check-validated (http(s),
    // contains {sha}).
    var shas = function (list) {
      if (!DATA.commitUrlTemplate) return '<span class="mono">' + esc(list.join(', ')) + '</span>';
      return list.map(function (sha) {
        return '<a class="mono shalink" href="' + esc(DATA.commitUrlTemplate.replace('{sha}', sha)) + '">' + esc(sha) + '</a>';
      }).join(', ');
    };
    if ((ev.commits && ev.commits.length) || (ev.integrated && ev.integrated.length) || ev.verified) {
      h += '<div class="dlbl">evidence</div><div class="evd">';
      if (ev.commits && ev.commits.length) h += '<div><b>commits</b> ' + shas(ev.commits) + '</div>';
      if (ev.integrated && ev.integrated.length) h += '<div><b>integrated</b> ' + shas(ev.integrated) + '</div>';
      if (ev.verified) h += '<div class="prose"><b>verified</b> — ' + mdToHtml(ev.verified) + '</div>';
      h += '</div>';
    }
    if (r.links && r.links.length) {
      h += '<div class="dlbl">links</div><div class="linksrow">';
      r.links.forEach(function (l) { h += '<button class="lnk" data-link="' + esc(l) + '">' + esc(l) + '</button>'; });
      h += '</div>';
    }
    h += '<div class="dmeta">opened ' + esc(r.opened) + ' · status ' + esc(r.status) +
      (r.resolved ? ' · resolved ' + esc(r.resolved) : '') + ' · last activity ' + esc(r._last) + '</div>';
    return h + '</div>';
  }

  function bcardHtml(r, rank, why) {
    var k = keyOf(r);
    var rk = rank || (r.id && qRank[r.id] && !r._terminal ? qRank[r.id].rank : 0);
    var h = '<div class="bcard' + (r._idea ? ' idea' : '') + '" data-open="' + esc(k) + '">';
    h += '<div class="bhead">' + (rk ? '<span class="rank">' + rk + '</span>' : '') +
      '<span class="idm">' + esc(r.id || 'draft') + '</span>' +
      (r._idea ? '' : sevHtml(r.severity)) + tagHtml(r.type) +
      (r.status === 'in-progress' ? '<span class="ip">in progress</span>' : '') +
      (r._new ? '<span class="newb">new</span>' : '') + '</div>';
    h += '<div class="bttl">' + esc(r.title) + '</div>';
    if (why) h += '<div class="bwhy">' + esc(why) + '</div>';
    var meta = [];
    if (r._draft) meta.push(esc(r.member));
    if (r.status === 'wont-fix' || r.status === 'moved-to-roadmap') meta.push(esc(r.status));
    if (r.stint) meta.push(esc(r.stint));
    if (r._stale) meta.push('stale ' + r._age + 'd');
    if (r._terminal) meta.push('&#10003; ' + esc(r.resolved || ''));
    if (meta.length) h += '<div class="bmeta">' + meta.join(' &middot; ') + '</div>';
    return h + '</div>';
  }

  function buildLanes() {
    var items = recs.concat(drafts).filter(function (r) { return pass(r, true); });
    var lanes = [];
    var resolvedDesc = function (a, b) {
      var ar = a.resolved || '', br = b.resolved || '';
      if (ar !== br) return ar < br ? 1 : -1;
      var ka = keyOf(a), kb = keyOf(b);
      return ka < kb ? 1 : -1;
    };
    var statusPass = function (r) {
      if (state.status === 'all') return true;
      if (state.status === 'open') return r.status === 'open' && !r._idea && !r._draft;
      if (state.status === 'in-progress') return r.status === 'in-progress';
      if (state.status === 'closed') return r.status === 'closed';
      if (state.status === 'ideas') return r._idea;
      if (state.status === 'drafts') return r._draft;
      if (state.status === 'retired') return r.status === 'wont-fix' || r.status === 'moved-to-roadmap';
      return true;
    };
    var laneOf = function (key, label, cls, f, sorter) {
      var rs = items.filter(function (r) { return f(r) && statusPass(r); });
      rs.sort(sorter || cmp);
      return { key: key, label: label, cls: cls, cards: rs.map(function (r) { return bcardHtml(r); }) };
    };
    // Lane EXISTENCE is a function of the dataset only — filters change cards
    // within lanes but never add/remove a lane, so columns keep their place.
    // In-progress lives at the top of Open; retired folds into Closed.
    var inprogFirst = function (a, b) {
      var ai = a.status === 'in-progress' ? 0 : 1, bi = b.status === 'in-progress' ? 0 : 1;
      if (ai !== bi) return ai - bi;
      return cmp(a, b);
    };
    lanes.push(laneOf('open', 'Open', '', function (r) {
      return (r.status === 'open' || r.status === 'in-progress') && !r._idea && !r._draft;
    }, inprogFirst));
    if (drafts.length)
      lanes.push(laneOf('drafts', 'Drafts', 'ideas', function (r) { return r._draft; }));
    if (recs.some(function (r) { return r._idea; }))
      lanes.push(laneOf('ideas', 'Ideas', 'ideas', function (r) { return r._idea; }));
    lanes.push(laneOf('done', 'Closed / retired', '', function (r) { return r._terminal; }, resolvedDesc));
    if (state.status !== 'all') {
      lanes.forEach(function (ln) { if (!ln.cards.length) ln.cls = (ln.cls || '') + ' dim'; });
    }
    return lanes;
  }

  function laneSectionHtml(ln) {
    var col = state.collapsed['bl-' + ln.key];
    var h = '<div class="lane ' + (ln.cls || '') + '"><header class="coll" data-g="bl-' + esc(ln.key) + '"><span>' +
      (col ? '&#9656; ' : '&#9662; ') + esc(ln.label) + '</span><span class="cnt">' +
      ln.cards.length + '</span></header>';
    if (ln.note && !col) h += '<div class="lanenote">' + ln.note + '</div>';
    if (!col) h += '<div class="cards">' + (ln.cards.length ? ln.cards.join('') : '<div class="laneempty">none</div>') + '</div>';
    return h + '</div>';
  }

  function renderBoard() {
    // narrow (default): stacked status sections — the status chip is the only
    // status instrument; the queue lives in the brief (rank badges remain on
    // cards). Filtered-empty sections drop, mirroring the list's groups.
    var sections = buildLanes().filter(function (ln) { return ln.cards.length; });
    if (!sections.length) {
      $('#groups').innerHTML = '<div class="empty">No records match the current filters.<br><button class="lnk" id="resetBtn">reset filters</button></div>';
      return;
    }
    var h2 = '<div class="stack">';
    sections.forEach(function (ln) { h2 += laneSectionHtml(ln); });
    h2 += '</div>';
    $('#groups').innerHTML = h2;
  }



  function activityEvents(items) {
    var allowed = {};
    items.forEach(function (r) { allowed[keyOf(r)] = 1; });
    var evs = [];
    DERIVED.events.forEach(function (e) {
      if (allowed[e.k]) evs.push({ d: e.d, kind: e.kind, r: byKey[e.k], k: e.k, x: e.x });
    });
    return evs;
  }

  function renderActivity() {
    var items = recs.concat(drafts).filter(function (r) { return pass(r, false); });
    var evs = activityEvents(items);
    var CAP = 100;
    var shown = evs.slice(0, CAP);
    var h = '<section class="grp"><header><span>&#9662; Activity — newest first</span><span class="cnt">' +
      (evs.length > CAP ? CAP + ' of ' + evs.length : evs.length) + '</span></header><div class="grpbody">';
    var curDate = null;
    shown.forEach(function (e) {
      if (e.d !== curDate) { curDate = e.d; h += '<div class="actdate">' + esc(e.d) + '</div>'; }
      h += '<div class="actrow" data-open="' + esc(e.k) + '">' +
        '<span class="actk actk-' + e.kind + '">' + esc(e.kind === 'moved-to-roadmap' ? 'roadmap' : e.kind === 'wont-fix' ? 'wontfix' : e.kind) + '</span>' +
        '<span class="idm">' + esc(e.r.id || 'draft') + '</span>' +
        (prevVisit && e.d > prevVisit ? '<span class="newb">new</span>' : '') +
        '<span class="ttl">' + esc(e.r.title) + '</span>' +
        '</div>';
    });
    h += '</div>';
    if (evs.length > CAP) {
      h += '<div class="lanenote">' + (evs.length - CAP) +
        ' older events not shown — narrow the filters, or read the records directly</div>';
    }
    h += '</section>';
    if (!evs.length) {
      h = '<div class="empty">No activity matches the current filters.<br><button class="lnk" id="resetBtn">reset filters</button></div>';
    }
    $('#groups').innerHTML = h;
  }

  function renderBrief() {
    var resolvedN = 0;
    recs.forEach(function (r) { if (r._terminal) resolvedN++; });
    var h = '<div class="brief">';
    h += '<div class="bblock btrend"><div class="bhead2"><span>trend · daily</span><span class="cnt">' +
      '<span class="lg"><i class="swf"></i>' + recs.length + ' found</span> ' +
      '<span class="lg"><i class="swx"></i>' + resolvedN + ' resolved</span> ' +
      '</span></div><div id="spark" class="barwrap"></div></div>';

    var tops = [];
    if (QUEUE) {
      for (var j = 0; j < QUEUE.items.length; j++) {
        var it = QUEUE.items[j];
        if (!it || !it.id) continue;
        for (var k2 = 0; k2 < recs.length; k2++) {
          if (recs[k2].id === it.id && !recs[k2]._terminal) { tops.push({ it: it, r: recs[k2] }); break; }
        }
      }
    }
    var shown = tops.slice(0, 3);
    var qhead = '';
    if (QUEUE && QUEUE.updated) {
      qhead = '<span class="cnt">queue · ' + shown.length + ' of ' + tops.length + ' · as of ' + esc(QUEUE.updated);
      var newer = DERIVED.queuePredates;
      if (newer > 0) qhead += '<span class="qstale"> · predates ' + newer + ' newer event' + (newer > 1 ? 's' : '') + '</span>';
      qhead += '</span>';
    }
    h += '<div class="bblock"><div class="bhead2"><span>up next</span>' + qhead + '</div>';
    if (shown.length) {
      shown.forEach(function (t, ti) {
        h += '<div class="qrow' + (ti === 0 ? ' qfirst' : '') + '" data-open="' + esc(t.r.id) + '"><div class="qrowhead">' +
          '<span class="rank">' + qRank[t.r.id].rank + '</span>' +
          '<span class="idm">' + esc(t.r.id) + '</span>' + (t.r._idea ? '' : sevHtml(t.r.severity)) + tagHtml(t.r.type) + '</div>' +
          '<div class="qttl">' + esc(t.r.title) + '</div>' +
          '<div class="bwhy">' + esc(t.it.why || '') + '</div></div>';
      });
    } else {
      h += '<div class="laneempty">no live queue recommendation — see the board</div>';
    }
    h += '</div>';

    var needs = [];
    DERIVED.draftsAwaiting.forEach(function (dd) { needs.push({ k: dd.k, label: 'draft awaiting an id: ' + dd.title }); });
    recs.forEach(function (r) {
      if (r.status === 'in-progress' && r._stale) needs.push({ k: r.id, label: r.id + ' — in progress but stale ' + r._age + 'd' });
    });
    DERIVED.unqueuedCriticals.forEach(function (id) { needs.push({ k: id, label: id + ' — critical but not in the queue' }); });
    h += '<div class="bblock"><div class="bhead2"><span>needs you</span></div>';
    if (needs.length) {
      needs.slice(0, 5).forEach(function (n) {
        h += '<div class="actrow" data-open="' + esc(n.k) + '"><span class="ttl">' + esc(n.label) + '</span></div>';
      });
    } else {
      h += '<div class="laneempty">nothing — the agents have it</div>';
    }
    h += '</div>';

    h += '<div class="bviews"><button class="chip" data-goview="board">board</button>' +
      '<button class="chip" data-goview="list">list</button>' +
      '<button class="chip" data-goview="activity">activity</button></div>';
    h += '</div>';
    $('#groups').innerHTML = h;
    sparkline();
  }

  function renderList() {
    if (state.view === 'brief') { renderBrief(); return; }
    if (state.view === 'board') { renderBoard(); return; }
    if (state.view === 'activity') { renderActivity(); return; }
    var items = recs.concat(drafts).filter(function (r) { return pass(r, false); });
    var h = '';
    var resolvedDescL = function (a, b) {
      var ar = a.resolved || '', br = b.resolved || '';
      if (ar !== br) return ar < br ? 1 : -1;
      var ka = keyOf(a), kb = keyOf(b);
      return ka < kb ? 1 : -1;
    };
    groupsFor(items).forEach(function (g) {
      if ((g.key === 'closed' || g.key === 'retired') && state.sort === 'id') g.items.sort(resolvedDescL);
      else g.items.sort(cmp);
      var col = state.collapsed[g.key];
      h += '<section class="grp ' + (g.cls || '') + '"><header data-g="' + g.key + '"><span>' +
        (col ? '&#9656;' : '&#9662;') + ' ' + esc(g.label) + '</span><span class="cnt">' + g.items.length + '</span></header>';
      if (!col) {
        h += '<div class="cards listcards">';
        g.items.forEach(function (r) { h += bcardHtml(r); });
        h += '</div>';
      }
      h += '</section>';
    });
    if (!items.length) {
      h = '<div class="empty">No records match the current filters.<br><button class="lnk" id="resetBtn">reset filters</button></div>';
    }
    $('#groups').innerHTML = h;
  }

  function resetFilters() {
    state.q = ''; state.status = 'all'; state.staleOnly = false; state.newOnly = false;
    state.types = { 'defect': 1, 'improvement': 1, 'feature-idea': 1 };
    state.sevs = { 'critical': 1, 'high': 1, 'med': 1, 'low': 1 };
    $('#q').value = '';
    syncControls();
  }


  function syncControls() {
    $('#staleBtn').classList.toggle('on', state.staleOnly);
    $('#newBtn').classList.toggle('on', state.newOnly);
    var af = 0;
    if (state.status !== 'all') af++;
    if (!(state.types.defect && state.types.improvement && state.types['feature-idea'])) af++;
    if (!(state.sevs.critical && state.sevs.high && state.sevs.med && state.sevs.low)) af++;
    if (state.staleOnly) af++;
    $('#cycStatus').textContent = 'status · ' + (STATUS_FACES[state.status] || state.status);
    var ti = cycleIndex(TYPE_CYCLE, state.types, TYPE_KEYS);
    $('#cycType').textContent = 'type · ' + (ti >= 0 ? TYPE_CYCLE[ti].face : 'custom');
    var si = cycleIndex(SEV_CYCLE, state.sevs, SEV_KEYS);
    $('#cycSev').textContent = 'sev · ' + (si >= 0 ? SEV_CYCLE[si].face : 'custom');
    $('#cycStatus').classList.toggle('hasactive', state.status !== 'all');
    $('#cycType').classList.toggle('hasactive', ti !== 0);
    $('#cycSev').classList.toggle('hasactive', si !== 0);
    $('#resetChip').disabled = af === 0;
    $('#cycGroup').textContent = 'group · ' + GROUP_FACES[state.groupBy];
    $('#cycSort').textContent = 'sort · ' + SORT_FACES[state.sort];
    $('#cycGroup').classList.toggle('hasactive', state.groupBy !== 'status');
    $('#cycSort').classList.toggle('hasactive', state.sort !== 'id');
    renderList();
  }

  function showModal(k) {
    clearIntroSkin();
    var all = recs.concat(drafts);
    var r = null;
    for (var j = 0; j < all.length; j++) if (keyOf(all[j]) === k) { r = all[j]; break; }
    if (!r) return;
    var h = '<div class="mhead"><span class="idm">' + esc(r.id || 'draft') + '</span>' +
      (r._idea ? '' : sevHtml(r.severity)) + tagHtml(r.type) +
      (r._draft ? '<span class="tag">' + esc(r.member) + '</span>' : '') +
      (r.stint ? '<span class="wo">' + esc(r.stint) + '</span>' : '') + staleHtml(r) +
      '<span class="mmeta">' + (r._terminal ? '&#10003; ' + esc(r.resolved || '') : esc(r.foundBy || '')) + '</span></div>';
    h += '<div class="mttl">' + esc(r.title) + '</div>';
    h += detailHtml(r);
    $('#modalbody').innerHTML = h;
    var m = $('#modal');
    m.hidden = false;
    m.scrollTop = 0;
    var mc = m.querySelector('.modalcard');
    if (mc) mc.scrollTop = 0;
    if (r.id) { try { history.replaceState(null, '', '#' + r.id); } catch (e) { /* file:// */ } }
  }
  function closeModal() {
    clearIntroSkin();
    $('#modal').hidden = true;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file:// */ }
  }

  function updateView() {
    document.getElementById('viewBrief').classList.toggle('on', state.view === 'brief');
    document.getElementById('viewList').classList.toggle('on', state.view === 'list');
    document.getElementById('viewBoard').classList.toggle('on', state.view === 'board');
    document.getElementById('viewActivity').classList.toggle('on', state.view === 'activity');
    document.querySelector('.filterbar').classList.toggle('boardmode', state.view !== 'list');
    document.body.classList.toggle('briefmode', state.view === 'brief');
  }

  // ---- wiring
  $('#groups').addEventListener('click', function (ev) {
    var gv = ev.target.closest('[data-goview]');
    if (gv) { state.view = gv.getAttribute('data-goview'); updateView(); renderList(); return; }
    var bc = ev.target.closest('.bcard,.actrow,.qrow');
    if (bc) { showModal(bc.getAttribute('data-open')); return; }
    var lnk = ev.target.closest('.lnk');
    if (lnk && lnk.id === 'resetBtn') { resetFilters(); return; }
    if (lnk && lnk.getAttribute('data-link')) { showModal(lnk.getAttribute('data-link')); return; }
    var gh = ev.target.closest('header[data-g]');
    if (gh) {
      var g = gh.getAttribute('data-g');
      if (state.collapsed[g]) delete state.collapsed[g]; else state.collapsed[g] = 1;
      renderList();
    }
  });
  $('#viewBrief').addEventListener('click', function () { state.view = 'brief'; updateView(); renderList(); });
  $('#viewList').addEventListener('click', function () { state.view = 'list'; updateView(); renderList(); });
  $('#viewBoard').addEventListener('click', function () { state.view = 'board'; updateView(); renderList(); });
  $('#viewActivity').addEventListener('click', function () { state.view = 'activity'; updateView(); renderList(); });
  var newBtn = $('#newBtn');
  if (newCount > 0) {
    newBtn.hidden = false;
    newBtn.textContent = 'new since last visit (' + newCount + ')';
  }
  newBtn.addEventListener('click', function () { state.newOnly = !state.newOnly; syncControls(); });
  function introHtml() {
    var ent = function (term, def) {
      return '<div class="gent"><div class="gterm">' + term + '</div><div class="gdef">' + def + '</div></div>';
    };
    return '<div class="introbody"><div class="dlbl">how to read this ledger</div>' +
      '<p class="introdesc">A ledger is a repo&#39;s issue tracker kept as files inside the repo: records — one JSON file per defect, improvement, or idea — written mostly by AI agents as they work, and read by the humans directing them. This page is a view of those files.</p>' +
      '<div class="dlbl gband">views</div>' +
      ent('brief', 'the gist: the opened-vs-resolved trend, the queue&#39;s top picks (see &#8220;up next&#8221;) with their rationales, and what needs a human.') +
      ent('board', 'current state by status; queued records carry their rank badge.') +
      ent('list', 'every record, groupable (status &#183; stint &#183; type) and sortable.') +
      ent('activity', 'what happened, newest first. Derived, not logged: one row per dated fact (opened, each note, resolved), so the same id appears once per event.') +
      '<div class="dlbl gband">concepts</div>' +
      ent('record', 'one tracked issue: a type (defect &#183; improvement &#183; idea), a severity (low &#8594; critical), a status (open &#8594; in-progress &#8594; closed / wont-fix / roadmap), and evidence when closed.') +
      ent('up next', 'the queue: a person or agent&#39;s take on what to fix next, each pick with its why. The &#8220;as of&#8221; date is when that judgment was made; the brief flags when it predates newer events.') +
      ent('needs you', 'derived, never authored: the things stuck until a human weighs in — drafts awaiting an id, in-progress records gone quiet (abandoned or alive — your call), open criticals no queue pick covers. The queue is the agents&#39; to-do list; this is yours. It can only be empty, never stale, and empty is the good state.') +
      ent('note', 'a dated update appended to a record; history accretes, never rewrites.') +
      ent('stint', 'the named burst of work a record was picked up in — a branch, an agent run, a working session. Set when work starts, so in-flight work is visible.') +
      ent('stale', 'computed in your browser: no activity on a record for the repo&#39;s configured window.') +
      ent('new', 'new since this browser&#39;s last visit; a first visit marks nothing.') +
      '<div class="dlbl gband">sources</div>' +
      ent('ledger.json', 'project config: name, description, the staleness window.') +
      ent('issues/&lt;id&gt;.json', 'one record per issue — the ledger itself.') +
      ent('drafts/&lt;member&gt;/', 'observations from agents working in parallel, awaiting an id — ids are assigned at integration.') +
      ent('queue.json', 'the fix-next recommendation behind &#8220;up next&#8221;; its author is named inside it.') +
      '<p class="introfoot">All the views in the ledger are generated from exactly these files and never edited by hand. The files themselves are written by whoever does the work — usually agents, following the repo&#39;s operating manual (ledger/AGENTS.md). ' +
      'Click any card or row for the full story: narrative, dated notes, and closure evidence (commits + how it was verified).</p>' +
      '</div>';
  }
  function showIntroModal() {
    $('#modalbody').innerHTML = introHtml();
    var m = $('#modal');
    m.hidden = false;
    var mc = m.querySelector('.modalcard');
    if (mc) { mc.classList.add('intro'); mc.scrollTop = 0; }
  }
  function clearIntroSkin() {
    var mc = $('#modal .modalcard');
    if (mc) mc.classList.remove('intro');
  }
  $('#helpBtn').addEventListener('click', showIntroModal);
  if (prevVisit === null && state.view !== 'brief') showIntroModal();

  $('#modal').addEventListener('click', function (ev) {
    if (ev.target.id === 'modal' || ev.target.closest('#modalx')) { closeModal(); return; }
    var lnk = ev.target.closest('.lnk');
    if (lnk && lnk.getAttribute('data-link')) showModal(lnk.getAttribute('data-link'));
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
  });
  $('#staleBtn').addEventListener('click', function () { state.staleOnly = !state.staleOnly; syncControls(); });
  // narrow-mode cycling filter chips: curated states, fixed footprint
  var TYPE_KEYS = ['defect', 'improvement', 'feature-idea'];
  var SEV_KEYS = ['critical', 'high', 'med', 'low'];
  var TYPE_CYCLE = [
    { face: 'all', set: { defect: 1, improvement: 1, 'feature-idea': 1 } },
    { face: 'defects', set: { defect: 1 } },
    { face: 'improv', set: { improvement: 1 } },
    { face: 'ideas', set: { 'feature-idea': 1 } }
  ];
  var SEV_CYCLE = [
    { face: 'all', set: { critical: 1, high: 1, med: 1, low: 1 } },
    { face: 'crit', set: { critical: 1 } },
    { face: 'high+', set: { critical: 1, high: 1 } },
    { face: 'med+', set: { critical: 1, high: 1, med: 1 } }
  ];
  function cycleIndex(cycle, cur, keys) {
    for (var i = 0; i < cycle.length; i++) {
      var ok = true;
      keys.forEach(function (k) { if (!!cycle[i].set[k] !== !!cur[k]) ok = false; });
      if (ok) return i;
    }
    return -1;
  }
  var STATUS_FACES = { all: 'all', open: 'open', 'in-progress': 'in prog', closed: 'closed', ideas: 'ideas', retired: 'retired', drafts: 'drafts' };
  function statusCycleList() {
    var c = { open: 0, 'in-progress': 0, closed: 0, ideas: 0, retired: 0, drafts: drafts.length };
    recs.forEach(function (r) {
      if (r._idea) c.ideas++;
      else if (r.status === 'open') c.open++;
      else if (r.status === 'in-progress') c['in-progress']++;
      else if (r.status === 'closed') c.closed++;
      else c.retired++;
    });
    return ['all', 'open', 'in-progress', 'closed', 'ideas', 'retired', 'drafts'].filter(function (s) {
      return s === 'all' || c[s] > 0;
    });
  }
  $('#cycStatus').addEventListener('click', function () {
    var list = statusCycleList();
    state.status = list[(list.indexOf(state.status) + 1) % list.length];
    syncControls();
  });
  $('#cycType').addEventListener('click', function () {
    var next = TYPE_CYCLE[(cycleIndex(TYPE_CYCLE, state.types, TYPE_KEYS) + 1) % TYPE_CYCLE.length];
    state.types = Object.assign({}, next.set);
    syncControls();
  });
  $('#cycSev').addEventListener('click', function () {
    var next = SEV_CYCLE[(cycleIndex(SEV_CYCLE, state.sevs, SEV_KEYS) + 1) % SEV_CYCLE.length];
    state.sevs = Object.assign({}, next.set);
    syncControls();
  });
  $('#resetChip').addEventListener('click', function () { resetFilters(); });
  var GROUP_CYCLE = ['status', 'stint', 'type'];
  var GROUP_FACES = { status: 'status', stint: 'stint', type: 'type' };
  var SORT_CYCLE = ['id', 'date', 'sev'];
  var SORT_FACES = { id: 'id', date: 'activity', sev: 'severity' };
  $('#cycGroup').addEventListener('click', function () {
    state.groupBy = GROUP_CYCLE[(GROUP_CYCLE.indexOf(state.groupBy) + 1) % GROUP_CYCLE.length];
    syncControls();
  });
  $('#cycSort').addEventListener('click', function () {
    state.sort = SORT_CYCLE[(SORT_CYCLE.indexOf(state.sort) + 1) % SORT_CYCLE.length];
    syncControls();
  });
  $('#q').addEventListener('input', function (ev) { state.q = ev.target.value; renderList(); });

  var themeBtn = $('#themeBtn');
  function themeLabel() {
    var cur = document.documentElement.getAttribute('data-theme');
    themeBtn.innerHTML = cur === 'dark' ? '&#9788; light' : '&#9789; dark';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ledger-theme', next); } catch (e) { /* file:// */ }
    themeLabel();
  });
  themeLabel();

  var hashTarget = null;
  if (location.hash) {
    var target = decodeURIComponent(location.hash.slice(1));
    var all = recs.concat(drafts);
    for (var j = 0; j < all.length; j++) {
      if (keyOf(all[j]) === target) { hashTarget = target; break; }
    }
  }
  updateView();
  renderList();
  if (hashTarget) showModal(hashTarget);
})();
</script>
</body>
</html>
