fails it: `table.png` at 352273 pixels or 94.73%, `pattern-data-table.png` at 658876 or 57.34%, in both themes. The same run also fails on 7 and 10 pixel differences in the master-detail captures, which the old 250 pixel floor discarded. The tightened gate passes the current tree unchanged at 104/104 with 0 differing pixels, and `npm run ci` exits 0 with every gate run."},"resolution":null,"details":"`npm run visual:capture` rewrote 17 of the 94 captures for a change that affected two components. Measured against the committed versions, `code-block` changed 1.82% and 1.79% of its pixels and `mermaid-diagram` 0.53% and 0.64%. The other 13 differed by 0 pixels at the threshold the gate itself uses.\n\nRestoring those 13 leaves `visual:compare` at 94 of 94 with 0 differing pixels, so they carry nothing the gate can see. Running `visual:capture` again rewrites all 17 once more, so this is reproducible rather than one bad run.\n\nThe cost is review. CONTRIBUTING asks that an intentional visual change be reviewed in both themes, and 13 files of noise around 4 real ones makes that harder than it needs to be. Writing a capture only when it differs from the committed one would fix it.\n\nWhat has not been established is why the bytes differ when the pixels do not. It could be encoder nondeterminism or a colour delta below the comparison threshold, and the two want different fixes.","notes":[{"date":"2026-09-07","text":"The cause in `details` is wrong, and so is the word churn. There is no nondeterminism: two captures of the same commit produce 104 byte-identical images, measured across every file in both themes. Every capture the recorder rewrites is a change the code actually makes."},{"date":"2026-09-07","text":"What is really happening is that the comparison tolerates changes the recorder records, and by a wide margin. `visual:compare` reported 0 differing pixels for a `table.png` in which 358109 of 371856 pixels had moved about 12 per channel, the whole table body repainting from the page grey to its own card background. pixelmatch weighs a perceptual distance against a threshold of 0.1, roughly a tenth of the maximum, and a shift of 12 in 255 sits under it however many pixels it covers.\n\nSo the gate is blind to a uniform colour change of that size. A token repointed, a surface recoloured or a theme drifting would pass. That is a bigger question than the diff noise this record was filed about, and it is the one worth answering."},{"date":"2026-09-07","text":"This also cost something. Twice in this session the zero-diff files from a re-record were restored on the reasoning that they carried no change, which discarded real renderings and left the committed baseline disagreeing with the code. Twenty captures were stale by the time it was measured, and are re-recorded in 348e80e. Reading a tolerant comparison as proof of equality is what caused it, and it is the same mistake in both directions: it hid the drift and it hid the Table background's effect."},{"date":"2026-09-07","text":"Closed by making the comparison exact rather than by chasing the churn it was filed about. The threshold's blind spot was measured on synthetic surfaces: at pixelmatch 0.1 a uniform shift is ignored up to 26 in 255 on mid grey, and across the whole remaining range on a near-white surface, regardless of how many pixels carry it. The same case at threshold 0 counts 100% of them.\n\nThe ratio and the 250 pixel floor went too. Both existed to absorb noise, and the image produces none: 104 captures byte identical across two runs, and a third against the committed baseline."},{"date":"2026-09-07","text":"One risk is not settled by anything measured here. Determinism was established in this container on this machine, and CI runs the same image on a different one. If its renderer differs at all, every capture fails on the first run there. Nothing has been pushed, so it has not been tested. The fallback if that happens is a small pixel floor rather than a return to the perceptual threshold, which is the part that hid colour."}],"links":["CUI-040"]},{"id":"CUI-053","title":"The render image is pinned by tag, and a tag can be rebuilt under it","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, while verifying the repository owner's condition that CI pins the image the visual gate renders in","opened":"2026-09-07","resolved":"2026-09-07","stint":"render image pass, 2026-09-07","evidence":{"commits":["3f4f24f"],"integrated":[],"verified":"`npm run test:render-image`: 7 tests pass. End to end, replacing the recorded digest with a zeroed one makes `npm run visual:compare` exit 2 before it renders anything, printing \"mcr.microsoft.com/playwright:v1.62.1-noble is not the image the baseline was drawn by\" above both the recorded and the present digests. Deleting the record exits 2 pointing at `visual:capture`. Left alone, `npm run ci` exits 0 with the visual gate reporting 104/104 compared screenshots and 0 differing pixels."},"resolution":null,"details":"The visual gate renders inside a container image, and picks it by reading the installed package rather than a constant. `scripts/visual-container.mjs` builds the tag as `mcr.microsoft.com/playwright:v${version}-noble` from `playwright/package.json`, and `package-lock.json` pins `playwright` to 1.62.1. So `npm ci` on any machine resolves the same version, and the tag follows it. There is no second place to keep in step, which is the good half of this design: bumping the package moves the image with it and the two cannot drift apart.\n\nThe half that is missing is that a tag is mutable. `v1.62.1-noble` names whatever Microsoft last published under it, not a fixed set of bytes. Rebuilding that tag on a newer base, which vendors do for security updates, can change the font packages inside it. The digest here at the time of writing is sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e, and nothing in the repository records or checks it.\n\nThe consequence is worth being concrete about. The baseline is a set of pixels drawn by the Chromium and the fonts inside that image, and the comparison now fails on any difference at all. If the tag is rebuilt, a run pulls a different image, the text rasterises differently, and every one of the 104 captures fails at once. Nothing in the repository would explain why, because the version, the lockfile and the tag would all be unchanged. The likely reading of that failure is that something in the branch broke everything, which is the wrong place to look.\n\nTwo ways out, and they trade against each other. Pinning by digest, `mcr.microsoft.com/playwright@sha256:...`, makes an upstream rebuild fail the pull rather than the pixels, at the cost of two things to update on a playwright bump instead of one. Recording the digest and comparing it before rendering keeps the single source of truth and turns the same event into a clear message rather than 104 failures.\n\nNeither is urgent. This is a latent trap rather than a defect, filed so that whoever meets a wholesale capture failure recognises it in minutes rather than hunting through their own diff.","notes":[{"date":"2026-09-07","text":"Filed at the owner's request while settling CUI-052, which dropped the comparison to zero tolerance. That change is what turns an image rebuild from a quiet drift into a loud one, so this became worth writing down at the same time. The loudness is the improvement; the missing part is a message that names the cause."},{"date":"2026-09-07","text":"Closed by recording the digest and checking it, rather than by pinning the image to one. Pinning would make an upstream rebuild fail the pull, which is equally loud but reports a registry error rather than a cause, and it adds a second thing to update on a playwright bump. The recorded digest keeps the lockfile as the single source of truth.\n\nA tag can carry two digests, the manifest list's and the platform manifest's, and the two engines report different ones: podman reports both for this tag, docker one. So the record keeps every digest it was shown and a match is an intersection, which holds across engines and across architectures."}],"links":["CUI-052"]},{"id":"CUI-054","title":"CONTRIBUTING asks for a 72 column commit body, and no gate checks it","type":"improvement","severity":"low","status":"closed","foundBy":"repository owner (host), asking whether the branch's commit messages match CONTRIBUTING","opened":"2026-09-07","resolved":"2026-09-07","stint":"commit rules pass, 2026-09-07","evidence":{"commits":["f9c7a85","d95d6ed"],"integrated":[],"verified":"`npm run test:commits`: 6 tests pass over the wrap measurement. Across the whole branch the checker finds 29 of 119 commits over 72 columns and nothing else, which is what the audit that produced this record found independently. Landing a real commit with a 106 column body makes `npm run lint:commits` exit 1 naming the sha and the column count, and the `commit-msg` hook refuses the same message before the commit exists. `npm run ci` exits 0 reporting `commits: 2 commits since 58668d6, all wrapped at 72`, and `actionlint` passes on the workflow step that runs it."},"resolution":null,"details":"`CONTRIBUTING.md` says to wrap a commit body at 72 columns. Twenty-nine of this branch's 93 commits have a body line over it: 22 at 73 columns, four at 74, one at 76 and two at 77. Measured with `git log main..HEAD --format=%b`, ignoring the `Co-Authored-By:` trailer.\n\n`cs-lint oss` passes on every one of them. So the rule is documented and ungated, which is the class this branch was opened to find, in the commit messages rather than in the code.\n\nThe history is not worth rewriting for it. Nothing is pushed, so a rebase could reach all 29, but that rewrites most of a branch to move a line by one character. The useful fix reaches the next commit instead, either as an `oss` rule or as a check in `npm run ci`.\n\nOne caution for whoever writes it. The subject rule, the trailer rule and the body word and paragraph limits all pass today, so a checker that reports those as violations has a bug in it rather than a finding.","notes":[{"date":"2026-09-07","text":"Closed with a gate rather than a rewrite, and the reason is stronger than the one this record gave. It argued the history was not worth rewriting for a character. The real obstacle is that the ledger cites sixty of those commits by sha, seventy-one citations across fifty-four records, and a closed record has to cite a sha that exists. A rebase would dangle all of them.\n\nSo the rule is checked from a baseline commit forward. The whole Commits section is covered rather than the wrap alone, because the other rules were equally ungated and held only by care: subject length, capitalisation, trailing stop, category prefix, the kept trailer, and the body's paragraph and word limits.\n\nThe audit that produced this record reported two false positives, on prose lines beginning `context:` and `scrollbar:`. A trailer block is the last thing in a message and its keys are capitalised, and a test holds the checker to that."},{"date":"2026-09-07","text":"Two corrections to the first attempt, both from the owner asking how the gate was built.\n\nIt re-implemented rules that already run. `cs-lint oss` carries the subject rules in OSS-702, the session-link rule in OSS-701 and the body length rule in OSS-711, and it runs both inside `npm run check` and as its own CI job. Only the 72 column wrap is missing from it. The checker is now that one rule, 47 lines shorter, and the rest is left where it already was.\n\nIt also ran nowhere but a contributor's machine. `.github/workflows/ci.yml` never invokes `npm run ci`: it runs `npm run check` and one job per linter. A gate added to `ci.mjs` alone is invisible to the forge, and it quietly broke that file's own claim to mirror the workflow. The step now runs in the readiness job, beside the other history rules.\n\nThe durable home is an OSS rule in cs-lint, where every project in the family would get it. That binary lives in another repository, so this stays a local stand-in."}],"links":[]},{"id":"CUI-055","title":"The visual gate flakes on three pixels of corner antialiasing","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while re-recording the dashboard captures for CUI-024","opened":"2026-09-07","resolved":"2026-09-08","stint":"visual gate flake, 2026-09-08","evidence":{"commits":["ee23996"],"integrated":[],"verified":"At least 19 `npm run visual:compare` runs today reported `112/112 compared screenshots passed`, with no occurrence of this failure. Every `FAIL dark/card-group.png` logged today is the same deterministic 68 pixels the fix itself moves, not the flake. Under full CPU saturation, which previously failed the gate on 2 of 4 runs, 8 consecutive runs produced byte identical captures for `card-group`, `search-input`, `button` and `tree`. If the one-in-six rate this record was filed with still held, 19 clean runs would occur about 3 percent of the time. The symptom was never observed stopping, because it never reproduced today."},"resolution":null,"details":"`visual:compare` reported `dark/card-group.png` at 3 differing pixels on one run and at 0 on the next, with the working tree byte for byte the same. The three sit at (973, 378), (973, 379) and (972, 380), the bottom right corner of the last card, and each is one unit on one or two channels: `16,21,26` against `17,22,27`.\n\nIt is rare. Eleven runs of the same container on the same machine produced it once. It did not reproduce in five clean-tree runs, and appeared once in six runs with an unrelated change to the dashboard demo applied.\n\nThis matters because the comparison allows no difference at all, which CUI-052 justified on the ground that runs in this image are deterministic to the pixel. That was measured as 104 byte-identical captures across two runs, and eleven runs are enough to see that it is not quite true. A gate that fails once in ten runs for no reason teaches a reader to re-run it, which is the habit that lets a real failure through.\n\nWhat is not established is the cause. A one-unit shift at a rounded corner is where a rasteriser rounds, and whether that turns on compositing timing or on something in the page is unmeasured. The fallback CUI-052 already names is a small pixel floor rather than a return to the perceptual threshold, and a floor of a handful of pixels would absorb this while still failing on the 20 pixel change that the `wrap: true` fix in CUI-027 produced. Whether to spend that headroom is the open question.","notes":[{"date":"2026-09-07","text":"The same failure reproduces on `dark/interaction-split-pane-drag.png`, and far more often than the eleven runs this record started from. It is bistable rather than random. Two renderings alternate, and `npm run visual:compare` returned one or the other with the working tree unchanged.\n\nThe eight differing pixels sit at x=972 and x=973, on the top right and the bottom right corner, at one or two units per channel. That is the signature this record already describes for `card-group`, at the same x.\n\nRe-recording is the hazard worth naming. A `visual:capture` run recorded the minority rendering, after which the gate failed two runs in three. Restoring that one file from the previous commit put the majority rendering back, and it failed one run in four. A baseline refresh can land on the wrong side of the pair, and turn a rare flake into a near permanent failure."},{"date":"2026-09-07","text":"Better numbers, and they are worse than this record assumed. `dark/interaction-split-pane-drag.png` failed 8 of 14 comparison runs, with its baseline byte-identical to the committed one and the working tree unchanged between runs.\n\nThe rate does not depend on the pointer position added in CUI-062. Removing that line gave 4 failures in 6 runs, against 4 in 8 with it, so the pointer is not what decides it.\n\nThe eight pixels are the class this record already describes. They sit at x=972 and x=973, on the top right and the bottom right corner, at one or two units per channel.\n\nA capture that fails half its runs is not a rare flake. `npm run ci` on this branch passes on roughly every second attempt, which is the habit this record warns about arriving in full."},{"date":"2026-09-07","text":"The cause of the split pane instance is that the capture depended on what the run had done before it. A probe rendering the same element in the same image, hashing each result, produced three different images for one drag. A fresh page gave one, the modal round trip gave a second, and the tree interaction gave a third. Only the third varied between runs, and it was the one this capture was taking.\n\nThe geometry was never fractional, which was the first hypothesis. The element measured 974 by 190 at x=233 with a device pixel ratio of 1 on every trial.\n\nThe drag now runs on a page of its own, in 84ffb5c. That capture failed 8 comparison runs of 14 before the change and none of 10 after it. The same change let axe evaluate colour contrast on the components page, which the drag had been making it skip with a grid bounds error, so the rule count rises by one.\n\nWhat this does not settle is the `dark/card-group.png` instance the record opened with. That capture is taken in the component loop rather than after an interaction, and 30 plain element screenshots destabilised nothing across 8 trials. It has not reproduced in roughly 30 runs today, so the record stays open on an instance nobody can currently make happen."},{"date":"2026-09-07","text":"Two things would close this record, and choosing between them is a judgement rather than a measurement.\n\nThe first is reproducing `dark/card-group.png` and finding its cause. The second is deciding that an instance absent from about 30 runs is stale, and closing it as `wont-fix` with that reason.\n\nToday's evidence leans to the second. Across 8 clean runs, 880 capture comparisons produced no difference anywhere but the split pane. That is a reason to suspect the same history dependence rather than a separate cause. Suspicion is not a finding, so the record waits on someone's call rather than closing on mine."},{"date":"2026-09-08","text":"`dark/card-group.png`, the instance this record opened with, reproduced. One `npm run ci` run failed on it, and five `npm run visual:compare` runs immediately afterwards passed with the working tree unchanged. Nothing in that range touches `CardGroup`.\n\nOne failure in six here, against none in roughly thirty runs earlier the same day. Taken together that is close to the one in eleven this record was filed with, and it is a different rate from the split pane instance, which was a coin flip until it was fixed.\n\nThis bears on the closing condition recorded above. The second option there was to decide that an instance absent from about thirty runs had gone stale. It has not: it is rare rather than gone, and calling it stale would now be wrong. The choice is between finding the cause and accepting a gate that fails roughly one run in six.\n\nThe fix that settled the split pane instance does not reach this one. That capture was photographing the residue of earlier interactions, and `card-group` is taken in the component loop before any interaction happens."},{"date":"2026-09-08","text":"The cause is interaction residue, and the fix that settled the split pane instance in CUI-062 does reach this capture after all.\n\nThree measurements, all taken in the Playwright image the gate renders in.\n\nFirst, the capture is history dependent. The same CardGroup element rasterises five different ways depending only on what ran before it. A bare page load gives one rendering, and the chart tooltip hover gives a second. The modal round trip gives a third, the EventLanes captures a fourth, and the component loop prefix a fifth. Each history is stable across 25 repetitions, so 150 observations produced no variation within a history.\n\nSecond, load reproduces the failure. With all four cores saturated, `npm run visual:compare` failed 2 of 4 runs. Seven unloaded runs the same day failed none. Both failures were `dark/search-input.png` at 20 pixels. Every differing pixel sits on one of the four rounded corners at one unit per channel, which is the signature this record opened with.\n\nThird, the residue is what makes it load sensitive. A probe captured `CardGroup` and `SearchInput` twelve times each under that same load. On a freshly loaded page both were stable, giving 24 observations and one rendering each. After the interaction sequence `preparePage` runs, `SearchInput` produced two renderings across twelve.\n\nThis corrects a claim in the note above. That note says `card-group` is taken in the component loop before any interaction happens. It is not. `captureTheme` calls `preparePage` first, which hovers a chart point, fires a toast, and opens and closes a modal. The measurement above shows each of those changes the CardGroup pixels.\n\nThe defect is in the harness rather than in CardGroup. Every rounded corner in the run sits one unit from a second stable rendering, and load decides which one is photographed. The `card-group` capture is the instance somebody noticed.\n\nWhat is not established is why contention flips a corner blend by one unit. The fix the residue measurement points at is to run the component loop on a freshly loaded page. That would move captures which depend on the interactions, including Skeleton, Toast and ToastContainer, so it needs a reviewed baseline re-record and the owner's decision."},{"date":"2026-09-08","text":"The pointer defect recorded in CUI-075 is the likely cause, and its fix may close this record.\n\nMoving the pointer park to before the component loop made `dark/card-group.png` byte identical across eight comparison runs under full CPU load. The same load without it failed the gate on 2 of 4 runs, and made `dark/search-input.png` bistable.\n\nThis is not proof. The `card-group` instance was never reproduced today, in seven unloaded runs, four loaded runs, or twelve loaded probe repetitions. What is measured is that the capture holds still under a load that previously broke its neighbours."},{"date":"2026-09-08","text":"This closes on the cause rather than on watching the symptom stop, and the difference is worth stating.\n\nThe parked pointer recorded in CUI-075 reached this capture. Moving the pointer changed `dark/card-group.png` by 68 pixels, so it was carrying the same leftover hover state that made `dark/search-input.png` bistable under load. It was not a bystander to that defect.\n\nNobody ever watched this capture flake and then stop. It did not reproduce today at all, before the fix or after it. What is measured is that the mechanism which provably touched it is gone, and that nothing has differed since.\n\nIf it returns, the load harness is the way back in. Saturating the cores turned the failure from one run in six into two runs in four, which is what made the cause findable at all."}],"links":["CUI-052","CUI-062"]},{"id":"CUI-056","title":"A tooltip near the right edge of the window is squeezed to one character per line","type":"defect","severity":"med","status":"closed","foundBy":"repository owner (host), reading the preview: the tooltip to expand a panel is very narrow and wrapped","opened":"2026-09-07","resolved":"2026-09-07","stint":"nav sidebar pass, 2026-09-07","evidence":{"commits":["3a8b97e"],"integrated":[],"verified":"`npx vitest run --project browser src/components/Tooltip.placement.test.tsx`: 4 tests pass. Measured before the fix, a Card's maximize control at x=1401 in a 1440px viewport gave a bubble 30px wide and 496px tall against 268x28 for the same string in the middle of the page. Three targeted reverts each fail the test that covers them: dropping `width: max-content` fails at `expected 30 to be 268`, dropping the horizontal correction fails at `expected -111.484375 to be greater than or equal to 7`, and dropping the flip leaves `data-side` at `top` against `bottom`. `npm run ci` exits 0 with the visual gate unchanged at 0 differing pixels."},"resolution":null,"details":"A tooltip is `position: fixed` and was positioned with `left` alone. A fixed box laid out from `left` gets only the space between that point and the right edge of the viewport, so its shrink-to-fit width is capped by whatever is left. A Card's maximize control sits 39px from the right edge on every page, and its 44 character tooltip measured 30px wide and 496px tall: one character per line, and mostly above the top of the screen.\n\n`components/Tooltip.md` said so, in the sense that it carried a paragraph headed \"No collision detection\" and told a consumer to choose `side` for the space available. What it did not say is that a trigger near an edge does not merely clip, it reshapes the bubble into a column of single letters. Nothing in the kit chooses `side` per position, and the components that place a control at the right of a header cannot.\n\nThe same bubble in the middle of the page measured 268x28, so the defect only appears where a control actually lives.","notes":[{"date":"2026-09-07","text":"Fixed rather than documented, because there is no `side` a consumer could have chosen: the bubble was reshaped by its position, not just moved. `width: max-content` takes the size out of the position, and the component measures itself once open, shifting to keep 8px clear horizontally and flipping to the other side of the trigger vertically.\n\nOne thing the first attempt got wrong is worth recording. The correction ran unguarded, and every rect is zero in an environment without layout, so a zero box read as off the left edge and the effect corrected it forever. Three Card tests failed with `Maximum update depth exceeded`. A measurement pass has to refuse to act on a measurement it did not get."}],"links":["CUI-016"]},{"id":"CUI-057","title":"Sizing a sidebar to its content has three answers, and nothing says which one applies","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["2de8103"],"integrated":[],"verified":"Section 7.11 of `DESIGN_SYSTEM_SPEC.md` carries the three cases in one table, and `Tree.md`, `Panel.md` and `SectionedTree.md` link to it rather than each restating a third. The numbers come from `src/components/Tree.sizing.test.tsx`, which measures a 200px scrolling column holding two lists of twenty rows: a bare tree reports 400px of scrollHeight at the default against 1160px with `scroll={false}`, a panel with `height=\"auto\"` reports 1272px either way, and SectionedTree reports 1250px. Those match the figures this record opened with. Flipping Tree's `scroll` default to false fails the first test, and the restore is byte-identical. `npm run ci` exits 0 at 2de8103."},"resolution":null,"details":"Building a nav sidebar meant asking one question: how do I stop this column scrolling inside itself so the page can scroll once? It has three different answers, and which one is right depends on what sits between the tree and the scroller.\n\nMeasured across six compositions in a 200px scrolling column, each holding two lists of 20 rows:\n\n- `Panel height=\"auto\"` wrapping a `Tree`: works, and `Tree scroll` changes nothing. Both settings gave 1272px of scrollHeight.\n- A bare `Tree`: needs `scroll={false}`. The default gave 400px of scrollHeight for 1160px of tree, with each tree clamped to 200px and its rows spilling out of a box nothing scrolls.\n- `SectionedTree`: needs neither. It gave 1368px either way, because it never hands a section a definite height.\n\nA consumer cannot tell these apart by reading. The reason is a CSS rule nobody has to know until it bites them: a percentage height resolves to auto against a parent whose height is indefinite, so a Panel sized to its content silently fixes the tree inside it.\n\nTwo smaller traps came with it. `Tree scroll` is named after `window.scroll`, so leaving it out of the destructuring made it a function rather than a boolean: TypeScript caught that in `SectionedTree` and would have let `if (scroll)` pass as always true in `Tree`. And the half-right version of the override fails quietly, at 780px of scrollHeight for 1160px of tree, with the missing rows reachable by `scrollIntoView` and by nothing a user does.\n\nThe fix is probably a decision table in one place rather than more API. `components/Tree.md` now says a tree inside a panel needs no `scroll` of its own, which is one third of it.","notes":[{"date":"2026-09-07","text":"One measurement in this record was not reproduced. The half-released override that reported 780px for 1160px of tree comes from overriding `max-height` and `overflow` by hand, rather than from any combination of props, so a test cannot reach it through the component. Section 7.11 states the hazard without the number instead of quoting a figure nothing checks.\n\nThe fix stayed documentation, at the owner's decision. Renaming `scroll` would fix the trap it shares with `window.scroll` and break every consumer, so the table records the trap and the prop keeps its name."}],"links":["CUI-011","CUI-014"]},{"id":"CUI-058","title":"Nothing says who supplies the padding around a CardGroup, so a page bleeds to the window edge","type":"defect","severity":"low","status":"closed","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["397f03f"],"integrated":[],"verified":"`components/CardGroup.md` now says the inset belongs to the page container rather than to the group, and gives the reason: a page built from a table needs the same inset, and two nested groups would otherwise inset twice. Its compiling example composes the group inside a `Page`, and `npm run docs:compile` type-checks that example against the published entry point. `npm run ci` exits 0 at 397f03f."},"resolution":null,"details":"The first version of the nav sidebar page ran from the left edge of the window to the right, with no inset and no rounded corners, so its cards did not read as cards. Every other pattern page insets by `var(--space-4)`.\n\nThe reason is that the padding comes from the demo's own root element. `preview/src/pages/patterns/ExplorerDemo.tsx` puts it there, and so does the dashboard's. Neither `Card` nor `CardGroup` supplies it, and neither specification mentions it.\n\nSo the composition a consumer copies out of `components/CardGroup.md` produces a page that looks wrong, and the fix is a property on an element that is not part of the kit. The repository owner spotted it immediately and could not say what the difference was, which is the point: nothing names it.\n\nEither `CardGroup` should own the inset, or the specification should say the consumer does and show it. The first is a visual change to every existing page, so this is a decision rather than a correction.","notes":[{"date":"2026-09-07","text":"The decision went to neither option this record offers. The inset belongs to a page container rather than to `CardGroup`, because five of the eleven pattern demos use `CardGroup` and a page built from a table or a form bleeds the same way. Section 2 of `DESIGN_SYSTEM_SPEC.md` already names that container as the `page` layout mode and ships nothing for it, which is filed as CUI-061. This record is one instance of that gap. It closes when the container lands and `components/CardGroup.md` says who supplies the inset."}],"links":["CUI-061"]},{"id":"CUI-059","title":"A bounded ancestor loses content silently, and only this repository can see it","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":"2026-09-08","stint":"page layout mode, 2026-09-07","evidence":{"commits":["03730f5"],"integrated":[],"verified":"`src/lib/clippedContentWarning.ts` runs on every component root through `forwardRefToRoot` and `checkedRootRef`, and `src/components/clippedContentWarning.test.tsx` covers both directions in browser mode. Three reverts each fail the test that covers them: dropping the call from `forwardRefToRoot` fails the positive test, treating a clipping box as scrollable fails it too, and reporting scrolling ancestors fails the negative one. Every restore was byte-identical. The guard was measured in the published build rather than the source, which is the trap CUI-006 met: after `npm run build` the check is in `dist/lib/clippedContentWarning.js` with `process.env.NODE_ENV === \"production\"` intact, so a consumer's bundler keeps it in development and strips it from production. `npm run ci` exits 0 at 03730f5."},"resolution":null,"details":"The nav sidebar page failed `visual:capture` with `the nav-sidebar pattern hides content a pointer cannot reach — div hides 403px`. The element was the preview's own wrapper, which is `overflow: hidden` and bounded, and the fix was for the demo to own a scroller. Finding out which element it was took instrumenting the gate to print the class name, because the message names a `div`.\n\nA consumer gets no message at all. They embed a component in their own bounded layout, the content overflows an ancestor that clips without scrolling, and the rows below the fold are reachable by `scrollIntoView` and by nothing a user does. That is the same failure CUI-011 describes and the same one that hid 1701px of a tree in this repository's own Explorer.\n\n`scripts/visual-baseline.mjs` has the check and it is nine lines: walk the tree, find boxes whose `scrollHeight` exceeds their `clientHeight` while `overflow-y` is neither visible nor scrollable, and report them. `src/lib/stylesheetWarning.ts` already shows there is a place to put a development-only warning that ships.\n\nTwo things to settle before writing it. It has to measure after layout rather than at render, and it must not run in production, which is the trap the stylesheet warning met in CUI-006, where a guard on `import.meta.env.DEV` compiled to an empty function in the published build while every test passed.","notes":[{"date":"2026-09-08","text":"The check runs automatically on every component root rather than being opt-in, at the owner's decision. A consumer who does not know about this failure will never opt in, and a warning that defaults to off is a warning nobody receives.\n\nBoth things this record asked to settle are settled. It measures on a frame after mount rather than during commit, because a ref runs before the browser has laid the page out and every box reads zero there. It is guarded on `process.env.NODE_ENV`, and that guard was checked in the built artifact rather than the source."}],"links":["CUI-006","CUI-011"]},{"id":"CUI-060","title":"SectionedTree renders two expand-all controls with the same label and configures only one","type":"defect","severity":"low","status":"closed","foundBy":"session agent, building patterns/NavSidebar.md, at the owner's request to record what was hard","opened":"2026-09-07","resolved":"2026-09-08","stint":"page layout mode, 2026-09-07","evidence":{"commits":["7a26aea"],"integrated":[],"verified":"`src/components/SectionedTree.expandAll.test.tsx` counts each kind of control through its own hook across all four values of the prop: `true` renders one sections control and two per-section ones, `false` renders none, `\"sections\"` and `\"trees\"` render one kind each. A fifth test holds the two accessible names apart. Two reverts fail the tests that cover them: rendering the sections control unconditionally fails the `false` and `\"trees\"` cases, and giving both controls the same label again fails the naming test. Restores were byte-identical. The nav sidebar capture loses the control it could not remove, at 8053 differing pixels in the light theme, and four comparison runs after the re-record passed. `npm run ci` exits 0 at 7a26aea."},"resolution":null,"details":"`SectionedTree` renders a control above the sections reading `Collapse all`, and gives each section's `Tree` another that reads `Collapse all` too. `expandAllControl` turns off the second kind and not the first, and neither the prop's name nor `components/SectionedTree.md` says so.\n\nTwo consequences, both met while building the nav sidebar pattern. A reader looking at the rendered page cannot tell which control `expandAllControl` governs. And a test asserting `queryAllByRole(\"button\", { name: /expand all/i })` is empty passes whether the prop works or not, because the surviving control reads `Collapse all` while the sections are open. That assertion was written in this session and had to be replaced with a count.\n\nThe sections control also has no prop of its own, so a sidebar that does not want it cannot remove it.\n\nThe smallest honest fix is to name them differently in the DOM, through distinct accessible names or a `data-part`, and to say in the specification which one `expandAllControl` reaches. Giving the sections control its own prop is the larger version.","notes":[{"date":"2026-09-08","text":"The larger fix was taken, at the owner's decision, and without keeping `false` backward compatible. `expandAllControl` reaches both kinds of control now, so `false` removes both where it used to leave the sections one standing.\n\nTwo tests in the repository had encoded the defect. One in `SectionedTree.chrome.test.tsx` asserted only that the count fell when the prop was set, which passed while one control ignored it. One in `patterns.wiring.test.tsx` asserted the nav sidebar kept exactly one control, which was the one it could not remove. Both now count each kind through its own hook.\n\nA second defect came out of the work and is filed as CUI-063. The per-section control sits inside the toolbar that `filterable` gates, so turning off a filter box takes an unrelated control with it."}],"links":["CUI-004"]},{"id":"CUI-061","title":"The page layout mode is specified with padding, and nothing implements it","type":"defect","severity":"med","status":"closed","foundBy":"session agent, laying out the options for CUI-058 at the owner's request","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["aa08dac","31cefa3"],"integrated":[],"verified":"`Page` exports from `src/index.ts` and `components/Page.md` specifies it, so section 2's table names something the package ships. 17 tests cover the inset, the width and the scroll, and each rule was verified by reverting it: five reverts produced five failures, and the restore was byte-identical. The preview's four pages take all three from it in 31cefa3, after which `npm run visual:compare` reported 105 of 110 captures byte-identical. The four that moved are the `Page` demo and the two `modal` captures that photograph it; the fifth is CUI-055. `npm run ci` exits 0 at 397f03f."},"resolution":null,"details":"Section 2 of `DESIGN_SYSTEM_SPEC.md` lists three layout modes a feature may use inside the shell. The row for `page` reads \"Centered max-width container with padding\". Nothing in the package provides one. There is no component, no class and no token for a page container.\n\nThe sentence below that table hands the job to the consumer, and it covers width alone: \"Each page's content area is responsible for applying its own width constraints\". The padding the table promises is never assigned to anyone.\n\nThe preview shows what follows. Sixteen selectors in `preview/src/preview.css` set a `--space-4` padding on a pattern demo's root. Several demos carry it at two depths at once, `explorer-demo-11` alongside `explorer-demo-19`, and `master-detail-demo-17` alongside `master-detail-demo-190`. A comment in that file explains to the next reader that this padding is what makes the pages read as cards.\n\nThree properties belong to a page container, and none of them has an owner. The inset from the window edge, the maximum width, and which element scrolls. The third is the expensive one: when no ancestor owns the scroll, content is clipped and unreachable, which is the failure the hidden Explorer tree recorded in CUI-011.\n\nOne more measurement bears on the fix. `scrollbar-gutter: stable` reserves the scrollbar's space so nothing shifts when it appears. It is used once in the repository, at line 62 of `src/styles/components/event-lanes.css`, and is named in no specification. A container that owns the scroll should carry it, and the design system should say so.","notes":[{"date":"2026-09-07","text":"One approach was tried and removed, because a later reader would otherwise try it again. The cap was first a centred box inside the page, which is the obvious way to keep the scrollbar at the window edge. With that box in place the visual gate lost six captures: `pattern-chart-scrolled`, `pattern-dashboard-scrolled` and `pattern-markdown-viewer-scrolled` in both themes.\n\nThe box gave the pages inside it a height to resolve against that no longer bounded them, so a page laid out with `height: 100%` grew to its content and the demo area inside it stopped scrolling. That is the class of failure CUI-057 records. The cap is side padding that grows instead, which leaves the children as the page's own children.\n\nThe gate caught this through its manifest check rather than through any pixel comparison. A unit test written for it afterwards could not fail, because reinstating a wrapper in isolation still resolved the height."}],"links":["CUI-058","CUI-057","CUI-059","CUI-011"]},{"id":"CUI-062","title":"The visual gate photographs whatever the mouse was last left over","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while adding a Page section to the components page","opened":"2026-09-07","resolved":"2026-09-07","stint":"page layout mode, 2026-09-07","evidence":{"commits":["42ba5b4"],"integrated":[],"verified":"Measured against the baseline at aa08dac with one working tree: `interaction-tree-arrow-navigation.png` differed by 7485 pixels in the light theme and 7483 in the dark before the fix, and by 32 and 30 after it. Two `npm run visual:capture` runs with nothing changed between them produced byte-identical files, so the difference was the pointer rather than noise. `npm run ci` exits 0 at 645a59e."},"resolution":null,"details":"`scripts/visual-baseline.mjs` clicks Open Modal to photograph the dialog, and Playwright leaves the real pointer where it clicked. Every capture taken after that point photographs whatever then sits under it.\n\nAdding one section to the components page moved a `Tree` row under that pointer. `interaction-tree-arrow-navigation.png` then differed by 7541 pixels, and none of it was a Tree change. The row had gained `--color-row-hover`, which is `rgba(0, 0, 0, 0.04)` in the light theme. That shifts a light row by 4 to 15 units per channel, which is the magnitude the diff measured.\n\nThe gate allows no difference at all, so a capture like that has to be re-recorded before a run passes. A reviewer reading the diff sees a Tree that moved. The cause is a pointer nobody moved away.\n\nParking the pointer at the top left corner before the tree interaction drops the same capture to 32 differing pixels, which is antialiasing from the section added above it.","notes":[],"links":["CUI-055"]},{"id":"CUI-063","title":"A tree's expand-all control renders only when `filterable` is on, and nothing says so","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while giving the two expand-all controls names that differ in CUI-060","opened":"2026-09-08","resolved":"2026-09-08","stint":"page layout mode, 2026-09-07","evidence":{"commits":["85b28e5"],"integrated":[],"verified":"`src/components/Tree.expandAll.test.tsx` renders each half of the toolbar without the other: `onToggleExpandAll` with `filterable` left at its default gives one `[data-part=\"expand-all\"]` and no filter box, `filterable` alone gives the reverse, and neither gives neither. Restoring the single `filterable` gate fails the first of those, and the restore was byte-identical. The visual gate moved two captures, `pattern-explorer-scrolled` in both themes, because the Explorer's Dependencies section sets `filterable: false` and now shows the expand-all control its `expandAllControl` always asked for. Three comparison runs after the re-record passed. `npm run ci` exits 0 at 85b28e5."},"resolution":null,"details":"`Tree` renders its expand-all control inside the toolbar that `filterable` gates, and `filterable` defaults to `false`. So passing `onToggleExpandAll` to a `Tree` renders nothing, and nothing says why.\n\n`docs-compile` found it. `components/Tree.md` documents `data-part=\"expand-all\"`, and that gate holds every documented hook against the specification's own compiling example. The example passed `onToggleExpandAll` and rendered no control, which is the same silence a consumer meets.\n\n`SectionedTree` hides the coupling rather than fixing it. Its `filterable` defaults to `true`, so the controls appear until a consumer turns the filter off, and then the per-section expand-all controls go with it. A navigation sidebar turning off a filter box it does not want loses a control it never asked to lose.\n\nNeither specification mentions the dependency. A prop named for a filter box should not decide whether an unrelated control renders, so the fix is to give the control its own condition rather than to document the coupling.","notes":[{"date":"2026-09-08","text":"Fixed rather than documented. A prop named for a filter box should not decide whether an unrelated control renders, and writing the coupling down would have asked every consumer to memorise an accident.\n\nNo new prop was needed. `onToggleExpandAll` was already the switch, since passing nothing renders no control, so this makes an existing prop do what its type implies.\n\nOne consequence is worth naming. The `components/SectionedTree.md` paragraph describing this coupling, written earlier the same day, was deleted in the same commit that made it false. A record's fix can strand the documentation the record produced."}],"links":["CUI-060"]},{"id":"CUI-064","title":"The specification says the class names are generated and change on every build, and neither is true","type":"defect","severity":"low","status":"closed","foundBy":"repository owner (host), asking: \"did we hard-code numbers? cs-component-tree-92?\"","opened":"2026-09-08","resolved":"2026-09-08","stint":"page layout mode, 2026-09-07","evidence":{"commits":["91b303d"],"integrated":[],"verified":"`components/Tree.md` no longer says the class names are generated or that they change on every build, and gives the true reason to prefer the documented hooks instead. `scripts/check-integrity.mjs` now fails rather than warns on a stale name, and its comment no longer offers the two grounds that had gone: a search of `src/` and `preview/src/` finds no name composed by interpolation, and no script generates one. Both failure directions were provoked and observed. A class defined in `page.css` and referenced nowhere reports `.cs-component-page-99 is defined but referenced by no component source`, and a class referenced in `Page.tsx` and defined nowhere reports the reverse, each naming its file and line. Both restores were byte-identical and the run returned to PASS. `npm run ci` exits 0 at 91b303d."},"resolution":null,"details":"`components/Tree.md` tells a consumer to prefer the documented `data-part` hooks over \"the generated class names, which change on every build\". They are not generated, and they do not change.\n\n`cs-component-tree-92` is a literal string in `src/components/Tree.tsx` at line 952, with nine rules under that selector in `src/styles/components/tree.css`. It reaches the published build verbatim, and two consecutive `npm run build` runs produced a byte-identical `dist/components/Tree.js`.\n\nNothing in this repository generates these names. The only scripts that name `cs-component-` are `check-integrity.mjs` and `check-consumer-dom-contract.mjs`, and both only read them. The numbering is a fossil of a one-time conversion away from utility classes, which `--tw-space-y-reverse` in `preview/src/preview.css` still shows.\n\nThe advice is right and its reason is false, which is the pairing that costs a reader later. Someone who checks the claim finds the names stable and starts depending on one. Nothing renumbers it for them, and nothing warns when a hand edit does.\n\n`scripts/check-integrity.mjs` carries the same claim in the comment above its class hygiene check, where it is also the stated reason that check only warns rather than failing.","notes":[{"date":"2026-09-08","text":"A correction to this record's own details, and an addition that makes it actionable.\n\nThe details call the numbering a fossil of a one-time conversion away from utility classes. The history does not support that. `src/styles/components/tree.css` arrives with these names in `d8462fb`, the initial implementation, so no conversion happened in this repository. A `--tw-space-y-reverse` property in `preview/src/preview.css` and a commit message calling two variables Tailwind-era are circumstantial. Whatever produced the names predates the first commit, and this record should not have asserted otherwise.\n\nThe addition is that both reasons `scripts/check-integrity.mjs` gives for warning rather than failing are now false. Nothing generates the names, and no name is composed dynamically: every `cs-component-` occurrence under `src/` and `preview/src/` is a complete literal, with interpolation only ever appended after a finished name. So that check could fail rather than warn, which would make a stale name an error instead of a line nobody reads.\n\nOne piece of evidence for the maintenance cost, from the session that filed this. Allocating a new name meant scripting a search for the highest number in use, 505, and taking 506. Removing this component's content wrapper left `cs-component-page-5` deleted while `-6` stayed in use, so the sequence has a hole. Nothing objects to either, because nothing is watching."},{"date":"2026-09-08","text":"Closed on the false statements rather than on the naming scheme. Renaming the classes to something a reader can interpret was considered and not done. `scripts/check-consumer-dom-contract.mjs` exists to audit a consumer's repository for references to exactly these names, so the project expects consumers to reach for them whatever the DOM contract says. A rename would break those consumers, and the case for it is maintainer comfort.\n\nIf that rename is ever wanted, the way in is one component at a time as each is touched, after running `npm run check:consumer-dom` to see who would break. Not as one change."}],"links":[]},{"id":"CUI-065","title":"Five sheets compose Tooltip and none of them imports its stylesheet","type":"defect","severity":"high","status":"closed","foundBy":"consumer report on three applications pinned to 0.2.1-dev, verified against 0c015ef","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["e025a0f","f11b338"],"integrated":[],"verified":"Six sheets now import what their component renders: `card.css`, `table.css`, `tree.css`, `theme-toggle.css` and `event-lanes.css` take `tooltip.css`, and `event-lanes.css` also takes `chart-tooltip.css`. The sixth was found by the check written for this, not by the report. Removing the import from `card.css` fails `check-integrity` with `Card renders Tooltip but this sheet does not @import \"./tooltip.css\"`, and the restore is byte-identical. `npm run ci` exits 0 at f11b338."},"resolution":null,"details":"A component sheet in this package imports the sheets of what it renders. `table.css` imports `button.css`, `dropdown.css`, `search-input.css` and `skeleton.css`; `tree.css` imports three; `sectioned-tree.css` imports three; `card.css` imports `skeleton.css`.\n\nNone of the five sheets whose component renders a `Tooltip` imports `tooltip.css`. Those are `card.css`, `table.css`, `tree.css`, `theme-toggle.css` and `event-lanes.css`, and the last two import nothing at all.\n\nA consumer loading per-component sheets therefore has a working page until a tooltip opens. Without the sheet the bubble has no `position: fixed`, so it lays out in flow at the end of the body and moves the page under the pointer. `ThemeToggle` wraps its control in a `Tooltip` unconditionally, so one click on the theme toggle is enough.\n\nThree applications reported this. All three load per-component sheets, none imports `tooltip.css`, and none renders a `Tooltip` directly. The convention is already right everywhere else, which is why nobody noticed the one place it was not applied.","notes":[{"date":"2026-09-08","text":"A check now holds the import graph against the component sources, so this cannot drift again. It is in `check-integrity.mjs` as `sheet-imports`, and it earned its place before it was committed: it reported that `EventLanes` renders a `ChartTooltip` while `event-lanes.css` imported no `chart-tooltip.css`. All three reporting applications render `EventLanes`, so that instance was live for them and nobody had found it.\n\nThe consumer's own suggestion, a `requires` field in the spec frontmatter, was not needed. The `@import` graph is already that declaration and is machine readable, so what was missing was something holding it to the source rather than a second copy of it to keep in step."}],"links":["CUI-066"]},{"id":"CUI-066","title":"Tooltip renders through a portal, so the missing stylesheet check never sees it","type":"defect","severity":"med","status":"closed","foundBy":"consumer report on three applications pinned to 0.2.1-dev, verified against 0c015ef","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["5d73668"],"integrated":[],"verified":"The bubble's ref now calls `warnWhenUnstyled` alongside its own assignment, so the one node carrying `data-component=\"Tooltip\"` reaches the check. A test in `src/components/stylesheetWarning.test.tsx` deletes the marker rule, opens a tooltip by focusing a trigger, and asserts the message names Tooltip and its sheet. Putting the plain ref back fails that test, and the restore is byte-identical. `npm run ci` exits 0 at 5d73668."},"resolution":null,"details":"`warnWhenUnstyled` reaches a component either through `forwardRefToRoot` or through `checkedRootRef`. `Tooltip` uses neither. It calls `forwardRef` directly at `src/components/Tooltip.tsx:88`, spends that ref on the trigger rather than the bubble for reasons the file explains and which are sound, and renders its own root through `createPortal`.\n\nSo no node carrying `data-component=\"Tooltip\"` is ever handed to the check, and a missing `tooltip.css` is the one missing sheet in the package that says nothing at all.\n\nThat would be a small gap on its own. It is not small here, because `Tooltip` is composed into five components a consumer already had working, and the failure mode moves the page rather than merely looking wrong. The check exists so that this class of mistake is never silent, and this is the one case where it is.","notes":[],"links":["CUI-065"]},{"id":"CUI-067","title":"The missing stylesheet warning fires on a MarkdownViewer that needs no stylesheet","type":"defect","severity":"med","status":"closed","foundBy":"consumer report on three applications pinned to 0.2.1-dev, verified against 0c015ef","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["0c41ee9"],"integrated":[],"verified":"`components/MarkdownViewer.md` now says inline mode still needs `styles/components/markdown-viewer.css`, and why. `npm run check` exits 0 at 0c41ee9."},"resolution":null,"details":"`MarkdownViewer` in `inline` mode gives its root `data-component=\"MarkdownViewer\"` and no `cs-component-` class, at `src/components/MarkdownViewer.tsx:783`. The presence marker is keyed on the attribute rather than on any class, so the check runs on that root and reports a missing sheet the root does not use.\n\nA consumer rendering `\u003cMarkdownViewer content={...} inline />` with `markdown-content.css` and `syntax.css` loaded, and `markdown-viewer.css` deliberately not, gets a warning naming a sheet they were right to leave out.\n\nA warning that fires on a correct configuration is worse than no warning, because it teaches a reader to ignore the next one. That undoes what the check was built for.\n\nOne thing to settle when fixing it. The outline and minimap chrome is gated on the `outline` prop rather than on `inline`, so a consumer passing both does render elements that need the sheet. Whether the skip belongs on `inline` alone needs measuring rather than assuming.","notes":[{"date":"2026-09-08","text":"This record's own details are wrong, and the measurement is the useful part. Inline mode does not need \"no stylesheet\": the scroller carries `cs-component-markdown-viewer-156` at `MarkdownViewer.tsx:855`, and that class has a rule, `min-width: 0`, which is what lets the content shrink inside a flex row. So the warning the consumer reported as a false positive was correct, and their import set was incomplete.\n\nDocumented rather than changed. Changing the component on a premise that does not hold would have removed a rule that matters to anyone embedding the viewer in a flex row.\n\nThe caveat this record raised also turned out to be unnecessary. `inline` suppresses outline and minimap unconditionally at `MarkdownViewer.tsx:270`, so the two cannot coexist and there was no combination to measure."}],"links":[]},{"id":"CUI-068","title":"Table hands a truncation tooltip the cell's rendered node, which Tooltip's own entry forbids","type":"defect","severity":"med","status":"closed","foundBy":"consumer report on three applications pinned to 0.2.1-dev, verified against 0c015ef","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["7cf1a08"],"integrated":[],"verified":"`TableColumn` gains an optional `tooltip`, and the bubble now takes `column.tooltip`, then `searchValue`, then the plain text inside the cell, and renders no tooltip when none of those yields any. `src/components/Table.truncation.test.tsx` covers all four in browser mode, including that a cell rendering an element appears once rather than twice while the bubble is open. Handing the tooltip `children` again fails three of the four, and the restore is byte-identical. `npm run ci` exits 0 at 7cf1a08."},"resolution":null,"details":"`src/components/Table.tsx` passes `content={col.cell(row, activeFilterQuery)}` to the `Tooltip` around a non-wrapping cell, and renders the same call again inside the trigger. A rich cell is therefore rendered twice, once in the table and once in a portal.\n\n`catalog.json` lists this under Tooltip's own `avoid_when`: \"The content is interactive (links, buttons) — a tooltip is not a popover\". A cell returning a link, a button or any element with an `id` produces a duplicated id and a control in a portal, which is an accessibility defect rather than a cosmetic one. A cell returning a `StatusBadge` duplicates a `data-component` root.\n\nThe predecessor did not have this shape. It set `title` from `textContent`, which is text by construction.\n\nThe component and its own catalogue entry disagree, and the entry is right.","notes":[{"date":"2026-09-08","text":"One trap in writing the test is worth recording. The first version passed its negative case while the tooltip never opened at all, because the cell did not overflow and the tooltip is deliberately overflow-only. A label with spaces wraps rather than overflowing, and a label with hyphens breaks at them, so the fixture needed an unbreakable run. `StatusBadge` was also the wrong trigger: it clips internally, so the cell around it never overflows either."}],"links":[]},{"id":"CUI-069","title":"Tooltip has no visual capture, and the reason the gate gives for that no longer holds","type":"defect","severity":"low","status":"closed","foundBy":"consumer report on three applications pinned to 0.2.1-dev, verified against 0c015ef","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["187d41f"],"integrated":[],"verified":"`Tooltip` moves from `UNCAPTURED` into `COMPONENTS` and is captured open, in both themes, on a page of its own. The capture is 163x28 and reads \"Theme: dark. Click to cycle.\", taken by focusing the theme toggle, whose tooltip is unconditional and opens at no delay. `npm run visual:capture` added only `light/tooltip.png` and `dark/tooltip.png`; no existing capture moved. Three comparison runs afterwards passed. `npm run ci` exits 0 at 187d41f."},"resolution":null,"details":"`scripts/visual-baseline.mjs` excuses `Tooltip` from capture with \"renders only while open, so it has no resting state to photograph\".\n\nThat reason does not survive the gate's own behaviour. It already captures three states that exist only after an interaction: `interaction-modal-focus-trap`, `interaction-tree-arrow-navigation` and `interaction-split-pane-drag`. Having no resting state is a thing this gate does three times, not an obstacle.\n\nSo the one component added in this release, now composed into five existing ones, whose failure mode moves the page, and which has since needed viewport collision handling, is the one thing the zero-tolerance gate cannot see.\n\nAnything added here should be built the way CUI-055 ended up: a capture taken after an interaction photographs everything the run did before it unless it gets a page of its own.","notes":[{"date":"2026-09-08","text":"The excuse was retired rather than rewritten. It read \"renders only while open, so it has no resting state to photograph\", and this gate already takes three states that exist only after an interaction, so that was never the obstacle it sounded like.\n\nThe capture takes a page of its own for the reason CUI-055 ended on: a capture taken after an interaction otherwise photographs whatever the run did before it."}],"links":["CUI-055"]},{"id":"CUI-070","title":"The upgrade guidance for consumers exists only inside closed ledger records","type":"improvement","severity":"med","status":"closed","foundBy":"consumer report on three applications pinned to 0.2.1-dev, verified against 0c015ef","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["69d16b2"],"integrated":[],"verified":"`CHANGELOG.md` carries a 0.3.0 section covering the changed `MarkdownMinimap` signature, the widened `SectionedTree.expandAllControl`, the `Table` tooltip change, both `Tree` default flips, the four parser changes, the new stylesheet imports, `Page`, `Tooltip`, `TableColumn.tooltip`, the clipping warning and the shipped `catalog.json`. It is registered in `.cs-lint.yaml`, so `cs-lint prose` and `cs-lint refs` both read it. `README.md` links to it, `AGENTS.md` routes to it, and `CONTRIBUTING.md` routes future changes to it. Removing the `AGENTS.md` entry fails `docs:refs`, `npm run check` and `npm run ci` alike, each reporting REF-302. `npm run ci` exits 0 at 69d16b2."},"resolution":null,"details":"There is no `CHANGELOG.md` and no migration document, and `package.json` still reads `0.2.0` while `Page.tsx`, `Tooltip.md`, `Tree.md`, `Panel.md` and `catalog.json` all document props as `since: 0.3.0`.\n\nThe range carries at least one changed signature, `MarkdownMinimap` moving from `contentRef` to `content: HTMLElement | null`; two deliberate default flips, `Tree.labelOverflow` to `\"truncate\"` and `Tree.scrollSelectedIntoView` to `true`; one prop whose meaning changed in place on `MarkdownViewer`; four parser changes that alter rendered markdown; a new stylesheet requirement; a new `Page` export; and `SectionedTree.expandAllControl` widening to a union where `false` now removes a control it used to leave standing.\n\nThe guidance for most of this is already written, in the `notes` of closed records including CUI-005, CUI-007 and CUI-008. A consumer cannot find it there. Collecting it is the difference between an upgrade that takes an hour and one that takes a day, and the prose mostly exists already.","notes":[{"date":"2026-09-08","text":"`CONTRIBUTING.md` now routes a consumer-facing change to the changelog as well as to the document that owns it, and says why that exception to the one-fact-one-place rule is deliberate. Without that row the file would go stale, which is how the guidance ended up in closed records in the first place.\n\nThe version is still `0.2.0`. Bumping it and cutting a tag are release decisions and stay with the owner, so the section says plainly that it is unpublished rather than implying otherwise."},{"date":"2026-09-08","text":"This record's evidence was wrong when it was first written, and the correction is worth more than the fix.\n\nIt cited a commit that registered `CHANGELOG.md` with the linters while `AGENTS.md` did not name it, and claimed `npm run ci` exited 0 there. It did not: `cs-lint refs` rejects that state as REF-302, which was measured afterwards by removing the entry again and watching all three commands fail. The claim came from misreading an exit code, which is the one thing an evidence line exists to prevent.\n\nThe commit was rebuilt with the routing folded into it, so the range is bisectable and this record cites a commit that passes. Rewriting it moved the sha, which is why the citation above is not the one this record was filed with."}],"links":[]},{"id":"CUI-071","title":"The published README links to main, so an install reads documentation for code it does not have","type":"defect","severity":"med","status":"closed","foundBy":"repository owner (host), asking: \"what did we decide about how a consumer of the npm package would learn about it w/o the repo?\"","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["4cbe972"],"integrated":[],"verified":"`scripts/stage-package.mjs` reads the sha from `dist/BUILD.json` and pins every rewritten link to it. Staged for real at 0db9db1: `CATALOG.md` resolves to `/blob/0db9db173d714da625c2a58713f05d16fac7a131/CATALOG.md`, and a search of the staged README for `/blob/main/` or `/tree/main/` returns nothing. Five tests in `scripts/stage-package.test.mjs` cover the rewrite, and returning the ref to `main` fails one of them while the other four still pass. The restore is byte-identical. `npm run ci` exits 0 at 4cbe972."},"resolution":null,"details":"`scripts/stage-package.mjs` builds a separate publish root and rewrites every relative README link into an absolute URL, because the documents it points at are not in the tarball. That part works, and it means the dead-link problem a reader might expect does not exist in the published package.\n\nLine 56 hardcodes the ref: `${REPO}/blob/main/...` and `${REPO}/tree/main/...`. So the link points at whatever `main` holds when the reader follows it, not at what they installed.\n\nThree applications are pinned to `0.2.1-dev.20260901200135.3160175`, built from `3160175`. The moment this branch merges, `main` carries 152 further commits including a new `Page` export, a widened `SectionedTree.expandAllControl` and props marked `since: 0.3.0`. Those three would then be reading documentation for a package none of them has, with nothing saying so.\n\nThe fix is small and the scaffolding is already there. `scripts/build.mjs` stamps `dist/BUILD.json` with the commit sha, so the staged links can pin to that instead of to `main`. A sha is available for a dev build and a release alike, and a sha-pinned blob URL cannot move afterwards, which a tag can.\n\nThat also answers the question this record came from, which was how documentation is supposed to work across dev builds and releases. Pinned to the commit, every install points at the documentation for exactly itself, and there is no docs version to keep in step with anything.","notes":[{"date":"2026-09-08","text":"Staging without a commit to pin to now throws rather than falling back. A fallback to `main` would reintroduce exactly this defect at the moment the stamp went missing, which is the worst time to be quiet about it.\n\nThe sha was chosen over the tag deliberately. It exists for a dev build and a release alike, so one rule covers both, and a sha-pinned blob URL cannot be repointed afterwards the way a tag can."}],"links":[]},{"id":"CUI-072","title":"catalog.json is the index an agent needs and it does not ship","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner (host), asking: \"what did we decide about how a consumer of the npm package would learn about it w/o the repo?\"","opened":"2026-09-08","resolved":"2026-09-08","stint":"consumer report, 2026-09-08","evidence":{"commits":["4cbe972"],"integrated":[],"verified":"`catalog.json` is copied into the staged root and added to the `files` list, so it survives the filter `npm publish` applies. Measured on the tarball rather than the staging directory: `npm pack --dry-run` in `.package` lists `56.9kB catalog.json`, and the package goes from 101.1 kB packed to 116.4 kB. `npm run ci` exits 0 at 4cbe972."},"resolution":null,"details":"`package.json` ships `dist`, `LICENSE`, `NOTICE` and `README.md`. `CATALOG.md` and `catalog.json` are not among them, and nothing in `scripts/build.mjs` copies them into `dist`.\n\nShipping only a README is the norm for an npm package, so this is conventional rather than broken. What is unusual is the dependence. This repository's own designated entry points for finding anything are `CATALOG.md`, described in its own text as the look-here-first index, and `AGENTS.md`, described as where an agent looks first. Neither ships. The package's stated audience is agent and LLM interfaces, and an agent working from an install has no path to either.\n\n`catalog.json` is the one worth shipping. It is generated, machine-readable, small, and it carries one record per component with its intents, when to use it, and the path to its specification. It is what an agent would read rather than the rendered markdown.\n\nThe argument for it is not its size. A shipped artifact cannot disagree with the install it shipped in, which is the failure CUI-071 records for anything reached by a link.\n\nShipping `components/` and `patterns/` was considered and is not proposed. That is 48 further files against a package currently 101 kB packed, and the pinned links in CUI-071 plus this index cover the need. Revisit if a consumer says otherwise.","notes":[{"date":"2026-09-08","text":"Fifteen kilobytes packed for the index this project tells an agent to read first. `components/` and `patterns/` still do not ship, and the record says why: 48 further files, against a need that the pinned links and this index already cover.\n\nThe published README says both things now. It names the commit its links point at, and it says `catalog.json` is the one document that travels with the code."}],"links":["CUI-071"]},{"id":"CUI-073","title":"Jekyll reads the JSX braces in the docs as its own syntax, so the pages build fails on main","type":"defect","severity":"high","status":"closed","foundBy":"the pages workflow, on the first push to main after this branch landed","opened":"2026-09-08","resolved":"2026-09-08","stint":"cs-sandbox/ui-v1, 2026-09-08","evidence":{"commits":["c2711c1","b484f12"],"integrated":[],"verified":"Reproduced against Liquid and Jekyll themselves, in a container, and then shown gone.\n\n`github-pages` 232, the gem GitHub Pages serves, carrying Jekyll 3.10.0 and Liquid 4.0.4. Building the tree at c2711c1~1 exits 1 on `Liquid syntax error (line 275): Variable '{{ width: \"100%\", maxWidth: W, aspectRatio: `${W}' was not properly terminated with regexp: /\\}\\}/ in patterns/Dashboard.md`, the sentence run 34190402253 printed. Building the tree at 81e9b6e exits 0, writes 66 pages, and logs no Liquid error and no Liquid warning. All eleven brace fragments come through the rendered HTML verbatim, no built page carries a leftover raw tag, and `ledger/ledger.html` comes out byte-identical to its source.\n\n`Liquid::Template.parse` at 4.0.4 over each page separately gives the same split: 1 of 65 pages fails to parse before, 0 of 65 after.\n\n`node scripts/check-integrity.mjs` reports 0 failures on the fixed tree. With the nine documents reverted to c2711c1~1 it reports 11, one per brace, at the lines this record names; restoring them left `git status` and `git diff` empty. `npm run ci` passed before each of the three commits.\n\nNot run: the `pages` workflow itself. Its deploy job has no ref guard, so dispatching it from a branch would publish that branch to the live docs URL."},"resolution":"The eleven `{{` are wrapped in `{% raw %}` blocks. Around a fence the tags sit outside it, so `docs:compile` reads every example byte for byte; the two in prose wrap the code span. Section 9 of `check-integrity.mjs` then fails `npm run check` on a `{{` or a `{%` outside a raw block, in any Markdown file a Jekyll build of the tree would render. It reads the scope from `_config.yml`'s exclude list rather than restating it.","details":"`pages.yml` builds the repository as a Jekyll site on every push to `main`, and it failed on the first such push after this branch landed. Run 34190402253, at 6194052.\n\nJekyll reads `{{` as the opening of a template variable. The pattern and component documents carry JSX examples with inline style objects, and those braces are what it chokes on:\n\n    Liquid Exception: Liquid syntax error (line 275): Variable\n    '{{ width: \"100%\", maxWidth: W, aspectRatio: `${W}' was not properly\n    terminated with regexp: /\\}\\}/ in patterns/Dashboard.md\n\nNine markdown files carry `{{`, eleven occurrences between them: `patterns/ComponentStates.md`, `patterns/Dashboard.md`, `patterns/NavSidebar.md`, `patterns/MarkdownViewer.md`, `components/Skeleton.md`, `components/Toast.md`, `components/CodeBlock.md`, `components/EventLanes.md` and `DESIGN_SYSTEM_SPEC.md`.\n\nThis branch introduced it. `patterns/Dashboard.md` and `patterns/ComponentStates.md` gained those examples in fd8e400, 7108192 and 87dec12, and `pages` last passed on 2026-09-01 against 3160175, where the lines did not exist.\n\nTwo things make it worth more than its size. `_config.yml` already documents this exact failure from the other direction, where `@dnd-kit` shipped a CHANGELOG with an unterminated `{{` and the fix was to exclude `node_modules`. The same bug then walked in through the repository's own documents.\n\nAnd `pages` runs on `main` alone, so 158 commits of branch work never exercised it. That is the shape of the catalog coverage gap CUI-069 records and of the `ci.mjs` mirror the handoff warns about: a gate that only runs where nobody is looking is a gate that reports the failure to whoever merges.\n\nExcluding the documents is against `_config.yml`'s stated intent, which is that every page keeps the URL it already has. `render_with_liquid: false` needs Jekyll 4 and GitHub Pages runs 3.10, so the remaining fix is `{% raw %}` around the fences. Something also has to stop it recurring, because `pages` will not run on a branch.","notes":[{"date":"2026-09-08","text":"`ledger/ledger.html` carries a `{{` inside its embedded JSON and is left alone. Jekyll copies an HTML file with no YAML header as a static file, and the plugin that promotes a headerless document to a page takes Markdown only, so Liquid never reads it. The check is scoped to Markdown for that reason."},{"date":"2026-09-08","text":"The raw tags show as literal text when GitHub renders these documents, because GitHub applies no Liquid. Excluding the documents is what `_config.yml` rules out, and turning Liquid off per document needs Jekyll 4 against the 3.10 GitHub Pages serves, so the visible tags are what the fix costs."},{"date":"2026-09-08","text":"Only one of the eleven stops a build. `languages={{ json }}` in `components/CodeBlock.md` is valid Liquid, so the pre-fix document renders as `languages= />` with the value deleted and the build exits 0. Two more raise a Liquid warning, which fails nothing. Asking Liquid to parse each document would catch one of the eleven, or three if a warning counted, and would put Ruby on the critical path of `npm run check`. The gate matches an unwrapped brace instead, which catches all eleven and needs nothing installed."}],"links":["CUI-069"]},{"id":"CUI-074","title":"Nothing builds the site before a merge, so only a Liquid brace is caught in time","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, while closing CUI-073","opened":"2026-09-08","resolved":"2026-09-08","stint":"pages build, 2026-09-08","evidence":{"commits":["1244860"],"integrated":[],"verified":"`npm run pages:build` exits 0 on this tree in 1.7 seconds. Reverted against the documents as they stood at c2711c1~1, in a throwaway worktree, it exits 1 and names the cause: `Liquid syntax error (line 275): Variable '{{ width: \"100%\"...' was not properly terminated`. So the gate can fail, which is the thing a new gate has to prove. `npm run ci` exits 0 at 1244860 reporting `every gate ran`, and with both container runtimes forced absent it still exits 0 while reporting `2 gate(s) did not run` and naming the site build among them. `actionlint` exits 0 on the changed workflows."},"resolution":null,"details":"`pages.yml` runs on a push to `main` and nowhere else, so the site is first built after the merge. CUI-073 is what that cost once: eleven Liquid braces reached `main`, and the build reported them to whoever merged.\n\nSection 9 of `check-integrity.mjs` now catches that one failure mode before the commit exists. It does not build the site. A change to `_config.yml`, a document that gains a YAML header, or anything else Jekyll refuses still reaches `main` before anyone hears about it.\n\nBuilding on a branch is cheap. The `github-pages` gem, version 232, builds this tree in a container in about a second with `PAGES_REPO_NWO` set. It fails on the documents as they stood at c2711c1~1 and passes on them as they stand now. A build job in `ci.yml` using `actions/jekyll-build-pages@v1`, with no deploy job after it, would cover every push.\n\nThe cost is the mirror. CONTRIBUTING says `npm run ci` is every gate the workflow has, in the order the workflow takes them, so a job with no local counterpart weakens that sentence. A local counterpart needs Ruby, which nothing else here needs, and a gate that skips where Ruby is missing is the shape of hole this record is about.","notes":[{"date":"2026-09-08","text":"The cost this record weighed turned out not to be real, which is why it closes with a local mirror rather than without one.\n\nThe objection recorded above was that a local counterpart needs Ruby, and that a gate skipping where Ruby is missing is the shape of hole this record describes. It needs no Ruby. The gate runs `actions/jekyll-build-pages`' own image, so its only prerequisite is a container runtime, which is what the visual gate already asks for. `npm run ci` names the skip on the way out, as it already does for that gate and for `actionlint`.\n\nThe gem is version 232 and the build takes under two seconds, so nothing about the run is expensive enough to argue about."}],"links":["CUI-073"]},{"id":"CUI-075","title":"The component loop still photographs the hover the parked pointer leaves","type":"defect","severity":"med","status":"closed","foundBy"
